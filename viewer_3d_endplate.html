<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ======================================================================
// PAYLOAD DELIVERY
// The payload may be baked in below, or published to sessionStorage by a
// tiny companion writer component. The writer path lets this iframe stay
// alive across Streamlit reruns, so changing an input rebuilds the model
// in place instead of reloading the whole scene.
// ======================================================================
const PKEY = "ins_endplate_payload_v1";
const SKEY = "ins_endplate_view_v1";

function readStore(k){
  try { const r = sessionStorage.getItem(k); return r ? JSON.parse(r) : null; }
  catch (e) { return null; }
}
function writeStore(k, v){
  try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}

let P = __PAYLOAD__;
if (!P) P = readStore(PKEY);

const host  = document.getElementById("cv");
const boot  = document.getElementById("boot");
const leg   = document.getElementById("leg");
const up    = document.getElementById("util");
const pulse = document.getElementById("pulse");

// ---- renderer, camera and controls are created ONCE -------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
const camera = new THREE.PerspectiveCamera(42, 1, 1, 20000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
host.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
// Default zoomSpeed of 1.0 moves several model widths per wheel notch
// at this scale, which is what made the view jump between far too
// close and far too far. Slow it down and damp it.
controls.dampingFactor = 0.085;
controls.rotateSpeed = 0.75;
controls.panSpeed = 0.65;
// Zoom is handled below, not by OrbitControls. Its wheel handling scales
// the dolly by a factor derived from the event delta, and with a model
// measured in millimetres one notch crossed the entire distance range,
// which is why the readout jumped straight from one clamp to the other.
controls.enableZoom = false;

scene.add(new THREE.AmbientLight(0xffffff, 0.66));
const k1 = new THREE.DirectionalLight(0xffffff, 0.85);
k1.position.set(1, 1.3, 1); scene.add(k1);
const k2 = new THREE.DirectionalLight(0x88aaff, 0.32);
k2.position.set(-1, 0.4, -1); scene.add(k2);

const ROOT = new THREE.Group(); scene.add(ROOT);

const MAT = {
  beam:    new THREE.MeshStandardMaterial({color:0x7f8c9b, metalness:0.35, roughness:0.62}),
  plate:   new THREE.MeshStandardMaterial({color:0x9aa7b4, metalness:0.35, roughness:0.55}),
  support: new THREE.MeshStandardMaterial({color:0x5f6a76, metalness:0.3,  roughness:0.7}),
  bolt:    new THREE.MeshStandardMaterial({color:0xd9b25a, metalness:0.75, roughness:0.35}),
  weld:    new THREE.MeshStandardMaterial({color:0x4ea1d3, metalness:0.4,  roughness:0.5}),
};
const SHARED = [MAT.beam, MAT.plate, MAT.support, MAT.bolt, MAT.weld];

let G, R, S, PL, PW, TP, BD, BF, TW, TF, DB, GAGE, PITCH, EV, NR, WD, TS, BL;
let CFG, FAM = "end_plate", AX = "x", BEAMX = 0, CD, CB, CW, CF;
let stiffGrp;
let boltPos = [], supportGrp, plateGrp, beamGrp, weldGrp, boltGrp, dimGrp, OV;
let DEFAULT_CAM = [1,1,1], DEFAULT_TGT = [0,0,0];
let exploded = false, xrayOn = false, dimsOn = false;
let labelsOn = true, curMode = "assembly";

function ratioColour(r){
  const c = new THREE.Color();
  if (r <= 1.0) c.setHSL(0.33 - 0.33*Math.min(r,1.0), 0.75, 0.45);
  else c.setHSL(0.0, 0.85, 0.42);
  return c;
}
function label(text, colour, scale){
  const cv = document.createElement("canvas");
  const fs = 44, pad = 12;
  let ctx = cv.getContext("2d");
  ctx.font = "600 "+fs+"px -apple-system, Segoe UI, sans-serif";
  cv.width = Math.ceil(ctx.measureText(text).width) + pad*2;
  cv.height = fs + pad*2;
  ctx = cv.getContext("2d");
  ctx.font = "600 "+fs+"px -apple-system, Segoe UI, sans-serif";
  ctx.fillStyle = "rgba(13,17,23,0.85)";
  ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle = colour || "#e6edf3";
  ctx.textBaseline = "middle";
  ctx.fillText(text, pad, cv.height/2);
  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, depthTest:false, transparent:true}));
  const h = S * (scale || 0.075);
  sp.scale.set(h * cv.width/cv.height, h, 1);
  sp.renderOrder = 999;
  sp.userData.isLabel = true;
  sp.visible = labelsOn;
  return sp;
}
function box(w,h,d,mat){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); }
function line(pts, colour){
  const g = new THREE.BufferGeometry().setFromPoints(
    pts.map(p=>new THREE.Vector3(p[0],p[1],p[2])));
  return new THREE.Line(g, new THREE.LineBasicMaterial({color:colour}));
}
function disposeTree(obj){
  obj.traverse(o=>{
    if (o.geometry) o.geometry.dispose();
    if (o.material){
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(m=>{
        if (SHARED.indexOf(m) !== -1) return;
        if (m.map) m.map.dispose();
        m.dispose();
      });
    }
  });
}
function clearGroup(g){
  if (!g) return;
  while (g.children.length){ const c = g.children[0]; disposeTree(c); g.remove(c); }
}

// ======================================================================
// BUILD
// ======================================================================
function build(){
  G = P.geom; R = P.results;
  CFG = P.config || {frame:"flange", family:"end_plate",
                     beam_attach:"bolted", col_attach:"welded",
                     slotted:false, coped:false, stiffeners:false};
  PL=G.plate_L; PW=G.plate_W; TP=G.t_plate; TS=G.t_support;
  BD=G.beam_d; BF=G.beam_bf; TW=G.tw_beam; TF=G.tf_beam;
  DB=G.db; GAGE=G.gage; PITCH=G.pitch; EV=G.ev; NR=G.n_rows; WD=G.weld_D;
  CD=G.col_d||300; CB=G.col_bf||300; CW=G.col_tw||10; CF=G.col_tf||15;
  S = Math.max(PL, PW, BD, CD);
  BL = Math.max(BD*2.2, 420);
  FAM = CFG.family;

  clearGroup(ROOT);

  supportGrp = new THREE.Group(); ROOT.add(supportGrp);
  plateGrp   = new THREE.Group(); ROOT.add(plateGrp);
  beamGrp    = new THREE.Group(); ROOT.add(beamGrp);
  weldGrp    = new THREE.Group(); ROOT.add(weldGrp);
  boltGrp    = new THREE.Group(); ROOT.add(boltGrp);
  stiffGrp   = new THREE.Group(); ROOT.add(stiffGrp);

  buildSupport();
  buildBeam();
  buildConnection();
  if (CFG.stiffeners) buildStiffeners();

  OV = new THREE.Group(); ROOT.add(OV);
  dimGrp = new THREE.Group(); dimGrp.visible = dimsOn; ROOT.add(dimGrp);
  buildDims();

  const bb = new THREE.Box3().setFromObject(ROOT);
  if (!bb.isEmpty()){
    const sp = bb.getBoundingSphere(new THREE.Sphere());
    const fov = camera.fov * Math.PI / 180;
    FITDIST = (sp.radius / Math.sin(fov / 2)) * 1.12;
    controls.minDistance = FITDIST * 0.06;
    controls.maxDistance = FITDIST * 14;
    camera.near = Math.max(0.05, FITDIST * 0.002);
    camera.far  = FITDIST * 120;
    camera.updateProjectionMatrix();
    DEFAULT_CAM = [sp.center.x + FITDIST*0.62,
                   sp.center.y + FITDIST*0.40,
                   sp.center.z + FITDIST*0.70];
    DEFAULT_TGT = [sp.center.x, sp.center.y, sp.center.z];
  }

  setExplode(exploded);
  setXray(xrayOn);
  setLabels(labelsOn);
  buildUtil();
  setMode(curMode);
}

// ---------------------------------------------------------------------
// SUPPORTING MEMBER
// The beam always arrives along +x. The face it lands on sits at x = 0.
// ---------------------------------------------------------------------
function buildSupport(){
  const H = Math.max(BD*2.6, 900);

  if (CFG.frame === "hss"){
    const w = Math.max(CD, 200), t = Math.max(TS, 8);
    const outer = box(w, H, w, MAT.support);
    outer.position.set(-w/2, 0, 0);
    supportGrp.add(outer);
    const inner = new THREE.Mesh(new THREE.BoxGeometry(w-2*t, H+2, w-2*t),
      new THREE.MeshStandardMaterial({color:0x0d1117}));
    inner.position.set(-w/2, 0, 0);
    supportGrp.add(inner);
    return;
  }

  if (CFG.frame === "web"){
    // Beam lands on the column WEB. The web is a plane perpendicular to
    // x; the two flanges are perpendicular to z and are CENTRED ON THE
    // WEB, half on each side. Offsetting them to one side is what made
    // the column read as a channel.
    const web = box(CW, H, CD - 2*CF, MAT.support);
    web.position.set(-CW/2, 0, 0);
    supportGrp.add(web);
    [1,-1].forEach(s=>{
      const fl = box(CB, H, CF, MAT.support);
      fl.position.set(0, 0, s*(CD-CF)/2);      // centred on x = 0
      supportGrp.add(fl);
    });
    return;
  }

  // Beam lands on the column FLANGE. The near flange face is at x = 0,
  // the web runs back in x on the centreline, far flange behind it.
  const near = box(CF, H, CB, MAT.support);
  near.position.set(-CF/2, 0, 0);
  supportGrp.add(near);
  const web = box(CD - 2*CF, H, CW, MAT.support);
  web.position.set(-CF - (CD-2*CF)/2, 0, 0);
  supportGrp.add(web);
  const far = box(CF, H, CB, MAT.support);
  far.position.set(-CD + CF/2, 0, 0);
  supportGrp.add(far);
}

// ---------------------------------------------------------------------
// SUPPORTED BEAM
// ---------------------------------------------------------------------
function buildBeam(){
  // Where the beam end sits. An end plate is sandwiched at the face; a
  // shear tab leaves a setback so the beam never touches the support.
  BEAMX = (FAM === "end_plate") ? TP : (G.setback || 10.0);

  const wh = BD - 2*TF;
  const web = box(BL, wh, TW, MAT.beam);
  web.position.set(BEAMX + BL/2, 0, 0);
  beamGrp.add(web);

  [1,-1].forEach(s=>{
    // The coped arrangement removes the top flange local to the support.
    const cope = (CFG.coped && s > 0) ? (G.cope_len || PL*0.55) : 0;
    const len = BL - cope;
    const fl = box(len, TF, BF, MAT.beam);
    fl.position.set(BEAMX + cope + len/2, s*(BD-TF)/2, 0);
    beamGrp.add(fl);
  });
  if (CFG.coped){
    const c = G.cope_len || PL*0.55;
    const lb = label("cope " + c.toFixed(0) + " mm", "#fca5a5", 0.05);
    lb.position.set(BEAMX + c*0.5, BD*0.62, 0);
    beamGrp.add(lb);
  }
}

// ---------------------------------------------------------------------
// PLATE, BOLTS AND WELDS - this is what actually differs between the
// arrangements.
// ---------------------------------------------------------------------
// The four families that cover every arrangement. What differs is where
// the steel sits and which way the bolts run; the rest is shared.
//
//   end_plate     plate across the beam end, bolts along the beam axis
//   single_plate  one plate off the support, beam web on one face
//   double_plate  two plates, beam web sandwiched between them
//   angles        a pair of angle cleats, one each side of the beam web
//
function buildConnection(){
  boltPos = [];
  const y0 = -(NR-1)*PITCH/2;
  FAM = CFG.family;

  if (FAM === "end_plate"){
    AX = "x";
    const plate = box(TP, PL, PW, MAT.plate);
    plate.position.set(TP/2, 0, 0);
    plateGrp.add(plate);
    for (let i=0;i<NR;i++)
      for (const z of [-GAGE/2, GAGE/2])
        boltPos.push({x: TP/2, y: y0 + i*PITCH, z: z});
    holes();
    boltsAlongX();
    // the plate is always welded to the beam, both sides of the web
    [1,-1].forEach(s=>weldGrp.add(filletBead(PL, WD, TP, s*TW/2, "x")));
    return;
  }

  AX = "z";
  const e  = G.ecc || PL*0.35;
  const lp = G.tab_len || Math.max(e + 2*EV, 90);

  // Where the vertical elements sit relative to the beam web.
  let faces = [];
  if (FAM === "single_plate") faces = [ TW/2 + TP/2 ];
  else                        faces = [ TW/2 + TP/2, -TW/2 - TP/2 ];

  faces.forEach(off=>{
    if (FAM === "angles"){
      // An angle cleat: one leg on the column, one on the beam web.
      const legc = G.angle_leg_col || Math.max(TP*6, 65);
      const legb = G.angle_leg_beam || Math.max(TP*6, 65);
      const sgn  = off > 0 ? 1 : -1;
      // leg against the beam web
      const lb_ = box(legb, PL, TP, MAT.plate);
      lb_.position.set(legb/2 + (G.setback||10), 0, off);
      plateGrp.add(lb_);
      // leg against the column face, turned outboard
      const lc = box(TP, PL, legc, MAT.plate);
      lc.position.set((G.setback||10) + TP/2, 0,
                      off + sgn*(legc/2 - TP/2));
      plateGrp.add(lc);
      weldGrp.add(filletBead(PL, WD, 0, off + sgn*(legc - TP), "z-edge"));
    } else {
      const pl = box(lp, PL, TP, MAT.plate);
      pl.position.set(lp/2, 0, off);
      plateGrp.add(pl);
      if (CFG.col_attach === "welded"){
        weldGrp.add(filletBead(PL, WD, 0, off, "z-edge"));
      } else {
        // bolted to the column through a short return
        for (let i=0;i<NR;i++)
          boltPos.push({x: -TP, y: y0 + i*PITCH, z: off, toCol: true});
      }
    }
  });

  // Attachment to the beam web.
  const zface = (FAM === "single_plate") ? (TW/2 + TP/2) : 0;
  if (CFG.beam_attach === "bolted"){
    for (let i=0;i<NR;i++)
      boltPos.push({x: (FAM === "angles")
                       ? (G.setback||10) + (G.angle_leg_beam||65)*0.55
                       : e,
                    y: y0 + i*PITCH, z: zface});
    boltsAlongZ();
  } else {
    // welded to the beam web instead: a bead each side
    faces.forEach(off=>{
      const sgn = off > 0 ? 1 : -1;
      weldGrp.add(filletBead(PL*0.9, WD,
        (FAM === "angles") ? (G.setback||10) : e*0.5,
        sgn*(TW/2), "x"));
    });
    const lb = label("welded to the beam web", "#7dd3fc", 0.05);
    lb.position.set(e, -PL*0.62, TW/2 + TP*3);
    plateGrp.add(lb);
  }

  if (CFG.slotted && CFG.beam_attach === "bolted"){
    const sl = label("slotted holes - no axial restraint", "#fcd34d", 0.05);
    sl.position.set(e, PL*0.62, TW/2 + TP*3);
    plateGrp.add(sl);
  }
}

function holes(){
  boltPos.forEach(b=>{
    const r = new THREE.Mesh(
      new THREE.TorusGeometry(G.d_hole/2, Math.max(0.6, TP*0.08), 8, 22),
      new THREE.MeshStandardMaterial({color:0x39424e}));
    r.rotation.y = Math.PI/2;
    r.position.set(TP+0.4, b.y, b.z);
    plateGrp.add(r);
  });
}

function boltsAlongX(){
  boltPos.forEach(b=>{
    const L = TP + TS + DB*1.2;
    const sh = new THREE.Mesh(
      new THREE.CylinderGeometry(DB/2, DB/2, L, 18), MAT.bolt);
    sh.rotation.z = Math.PI/2;
    sh.position.set((TP-TS)/2, b.y, b.z);
    boltGrp.add(sh);
    [[TP, DB*0.6],[-TS, DB*0.55]].forEach(hd=>{
      const hh = new THREE.Mesh(
        new THREE.CylinderGeometry(DB*0.85, DB*0.85, hd[1], 6), MAT.bolt);
      hh.rotation.z = Math.PI/2;
      hh.position.set(hd[0] + (hd[0]>0?hd[1]/2:-hd[1]/2), b.y, b.z);
      boltGrp.add(hh);
    });
  });
}

function boltsAlongZ(){
  const grip = (FAM === "double_plate" || FAM === "angles")
               ? (TW + 2*TP) : (TW + TP);
  boltPos.filter(b=>!b.toCol).forEach(b=>{
    const L = grip + DB*1.2;
    const sh = new THREE.Mesh(
      new THREE.CylinderGeometry(DB/2, DB/2, L, 18), MAT.bolt);
    sh.rotation.x = Math.PI/2;
    sh.position.set(b.x, b.y, 0);
    boltGrp.add(sh);
    [1,-1].forEach(s=>{
      const hh = new THREE.Mesh(
        new THREE.CylinderGeometry(DB*0.85, DB*0.85, DB*0.55, 6), MAT.bolt);
      hh.rotation.x = Math.PI/2;
      hh.position.set(b.x, b.y, s*(L/2 + DB*0.27));
      boltGrp.add(hh);
    });
    // slot indication
    if (CFG.slotted){
      const sl = new THREE.Mesh(
        new THREE.BoxGeometry(G.slot_len || DB*2.2, DB*1.15, 1.6),
        new THREE.MeshBasicMaterial({color:0xfbbf24}));
      sl.position.set(b.x, b.y, TW/2 + TP + 1.4);
      boltGrp.add(sl);
    }
  });
}

// A fillet bead. axis "x" runs the bead up the plate face at a given z;
// "z-edge" runs it up the joint between the plate face and the support.
function filletBead(len, leg, atX, atZ, axis){
  const shape = new THREE.Shape();
  shape.moveTo(0,0); shape.lineTo(leg,0); shape.lineTo(0,leg); shape.lineTo(0,0);
  const geo = new THREE.ExtrudeGeometry(shape, {depth: len, bevelEnabled:false});
  const m = new THREE.Mesh(geo, MAT.weld);
  if (axis === "x"){
    m.rotation.y = -Math.PI/2;
    m.position.set(atX, -len/2, atZ);
    if (atZ < 0) m.scale.set(1,1,-1);
  } else {
    m.rotation.y = -Math.PI/2;
    m.rotation.z = Math.PI/2;
    m.position.set(0, -len/2, atZ);
    if (atZ < 0) m.scale.set(1,1,-1);
  }
  return m;
}

// Stiffener plates. A stiffener spans the clear web depth of the
// column, h = d - 2t, so its size follows the column section rather
// than being a free input. Count, spacing and thickness are chosen.
function buildStiffeners(){
  const t1 = G.stiff_t || 10;
  const n  = Math.max(0, Math.round(G.stiff_n === undefined ? 2 : G.stiff_n));
  if (n === 0) return;
  const h  = CD - 2*CF;                    // clear depth between flanges
  const sp = G.stiff_sp || 0;              // 0 means align to the flanges

  // Levels. Two stiffeners with no spacing given sit opposite the beam
  // flanges, which is what a moment connection needs. Anything else is
  // laid out symmetrically about the beam centreline at the given pitch.
  const ys = [];
  if (n === 2 && !sp){
    ys.push((BD-TF)/2, -(BD-TF)/2);
  } else {
    const pitch = sp || (BD - TF) / Math.max(1, n - 1);
    const y0 = -pitch * (n - 1) / 2;
    for (let i = 0; i < n; i++) ys.push(y0 + i*pitch);
  }

  ys.forEach(y=>{
    if (CFG.frame === "web"){
      // spans between the column flanges, sits behind the shear plate
      const st = box(CB*0.85, t1, h, MAT.support);
      st.position.set(-CB*0.42 + CW/2, y, 0);
      stiffGrp.add(st);
    } else if (CFG.frame === "flange"){
      // one each side of the column web
      [1,-1].forEach(z=>{
        const st = box(h, t1, (CB - CW)/2 * 0.9, MAT.support);
        st.position.set(-CF - h/2, y, z*(CW/2 + (CB-CW)/4));
        stiffGrp.add(st);
      });
    }
  });

  const lb = label(n + " stiffeners, t = " + t1.toFixed(0)
    + " mm, h = d - 2t = " + h.toFixed(0) + " mm", "#94a3b8", 0.046);
  lb.position.set(-CD*0.5, BD*0.74, 0);
  stiffGrp.add(lb);
}

function buildDims(){

    dimLine([TP,-PL/2,-PW/2],[TP,-PL/2,PW/2],"W = "+PW.toFixed(0),[0,-o*0.5,0]);

function dimLine(a,b,txt,off){
  const A=new THREE.Vector3(a[0]+off[0],a[1]+off[1],a[2]+off[2]);
  const B=new THREE.Vector3(b[0]+off[0],b[1]+off[1],b[2]+off[2]);
  const mat=new THREE.LineBasicMaterial({color:0x64748b});
  dimGrp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([A,B]),mat));
  dimGrp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(a[0],a[1],a[2]),A]),mat));
  dimGrp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(b[0],b[1],b[2]),B]),mat));
  const lb=label(txt,"#cbd5e1",0.05);
  lb.position.copy(A.clone().add(B).multiplyScalar(0.5)); dimGrp.add(lb);
}

// ---- zoom gauge -----------------------------------------------------
// Distance is stepped geometrically: every notch multiplies it by the
// same factor, so the feel is even at any scale. ZOOM_STEPS is how many
// notches it takes to cross the whole range, so raising it makes the
// wheel finer.
const ZOOM_STEPS = 40;
const zEl = document.getElementById("zoom");
const zVal = document.getElementById("zval");
let FITDIST = 1;
let targetDist = 1;   // where the camera is heading
let curDist = 1;      // where it is now, eased toward the target

function zoomFactor(){
  const r = controls.maxDistance / controls.minDistance;
  return Math.pow(r, 1 / ZOOM_STEPS);
}
function clampDist(d){
  return Math.max(controls.minDistance,
                  Math.min(controls.maxDistance, d));
}
function distNow(){ return camera.position.distanceTo(controls.target); }

// Move the camera along its current sight line to a given distance.
function applyDistance(d){
  const dir = camera.position.clone().sub(controls.target);
  const cur = dir.length() || 1;
  dir.multiplyScalar(d / cur);
  camera.position.copy(controls.target).add(dir);
}
function setTargetDist(d, snap){
  targetDist = clampDist(d);
  if (snap){ curDist = targetDist; applyDistance(curDist); controls.update(); }
  syncZoom();
}
function stepZoom(notches){
  setTargetDist(targetDist * Math.pow(zoomFactor(), notches));
  saveViewSoon();
}

function sliderToDist(v){
  const lo = Math.log(controls.minDistance);
  const hi = Math.log(controls.maxDistance);
  return Math.exp(lo + (hi - lo) * (1 - v / 1000));
}
function distToSlider(d){
  const lo = Math.log(controls.minDistance);
  const hi = Math.log(controls.maxDistance);
  const t = (Math.log(clampDist(d)) - lo) / (hi - lo);
  return Math.round((1 - Math.max(0, Math.min(1, t))) * 1000);
}
let syncing = false;
function syncZoom(){
  if (syncing) return;
  syncing = true;
  zEl.value = distToSlider(targetDist);
  zVal.textContent = (FITDIST / Math.max(curDist, 1e-6)).toFixed(2) + "x";
  syncing = false;
}
zEl.addEventListener("input", function(){
  if (syncing) return;
  setTargetDist(sliderToDist(parseFloat(zEl.value)));
  saveViewSoon();
});

// Wheel: one notch per event, regardless of how large deltaY is. A
// trackpad fires many small events, so those are accumulated and only
// spend a notch once they add up.
let wheelAccum = 0;
renderer.domElement.addEventListener("wheel", function(ev){
  ev.preventDefault();
  wheelAccum += ev.deltaY;
  const TH = 24;
  while (Math.abs(wheelAccum) >= TH){
    stepZoom(wheelAccum > 0 ? 1 : -1);
    wheelAccum += (wheelAccum > 0 ? -TH : TH);
  }
}, {passive: false});

// Pinch to zoom, since OrbitControls no longer does it.
const pointers = new Map();
let pinchStart = 0, pinchStartDist = 0;
renderer.domElement.addEventListener("pointerdown", function(ev){
  pointers.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
  if (pointers.size === 2){
    const p = Array.from(pointers.values());
    pinchStart = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    pinchStartDist = targetDist;
  }
});
renderer.domElement.addEventListener("pointermove", function(ev){
  if (!pointers.has(ev.pointerId)) return;
  pointers.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
  if (pointers.size === 2 && pinchStart > 0){
    const p = Array.from(pointers.values());
    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    if (d > 0) setTargetDist(pinchStartDist * (pinchStart / d));
  }
});
function endPointer(ev){
  pointers.delete(ev.pointerId);
  if (pointers.size < 2){ pinchStart = 0; saveViewSoon(); }
}
renderer.domElement.addEventListener("pointerup", endPointer);
renderer.domElement.addEventListener("pointercancel", endPointer);
renderer.domElement.addEventListener("pointerleave", endPointer);

// Frame the whole assembly, whatever its size.
function fitView(){
  const bboxT = new THREE.Box3().setFromObject(ROOT);
  if (bboxT.isEmpty()) return;
  const sph = bboxT.getBoundingSphere(new THREE.Sphere());
  const fov = camera.fov * Math.PI / 180;
  const d = (sph.radius / Math.sin(Math.min(fov, camera.aspect * fov) / 2))
            * 1.12;
  controls.target.copy(sph.center);
  const dir = camera.position.clone().sub(sph.center).normalize();
  if (!isFinite(dir.x) || dir.lengthSq() < 1e-9) dir.set(0.6, 0.4, 0.7).normalize();
  camera.position.copy(sph.center).add(dir.multiplyScalar(clampDist(d)));
  controls.update();
  setTargetDist(clampDist(d), true);
}
function restoreView(){
  const s = readStore(SKEY);
  if (!s) { resetView(); return; }
  try {
    if (Array.isArray(s.cp) && s.cp.length===3 && isFinite(s.cp[0]))
      camera.position.fromArray(s.cp);
    if (Array.isArray(s.ct) && s.ct.length===3 && isFinite(s.ct[0]))
      controls.target.fromArray(s.ct);
    const d = camera.position.distanceTo(controls.target);
    if (!isFinite(d) || d < controls.minDistance || d > controls.maxDistance){
      camera.position.set(DEFAULT_CAM[0], DEFAULT_CAM[1], DEFAULT_CAM[2]);
      controls.target.set(DEFAULT_TGT[0], DEFAULT_TGT[1], DEFAULT_TGT[2]);
    }
    controls.update();
    setTargetDist(distNow(), true);
    setExplode(!!s.ex); setXray(!!s.xr); setDims(!!s.dm);
    if (s.lb !== undefined) setLabels(!!s.lb); else setLabels(true);
    if (s.mode) setMode(s.mode);
  } catch (e) { resetView(); }
}

btnEx.onclick = function(){ setExplode(!exploded); saveView(); };
btnXr.onclick = function(){ setXray(!xrayOn); saveView(); };
btnDm.onclick = function(){ setDims(!dimsOn); saveView(); };
document.getElementById("labels").onclick = function(){
  setLabels(!labelsOn); saveView(); };
document.getElementById("reset").onclick = resetView;
document.getElementById("fit").onclick = function(){ fitView(); saveView(); };
document.getElementById("mode").onchange = function(e){
  setMode(e.target.value); saveView();
};
controls.addEventListener("change", syncZoom);
controls.addEventListener("end", saveViewSoon);

// ======================================================================
// SIZING, LIVE UPDATE, LOOP
// ======================================================================
function resize(){
  const w = host.clientWidth, h = host.clientHeight;
  if (!w || !h) return;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
addEventListener("resize", resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(host);

function flash(){
  pulse.classList.add("on");
  setTimeout(function(){ pulse.classList.remove("on"); }, 420);
}

let started = false;
function start(){
  if (started) return;
  started = true;
  boot.classList.add("gone");
  resize();
  build();
  const had = readStore(SKEY);
  restoreView();
  if (!had) fitView();
  syncZoom();
  saveView();
}

// Poll for a fresh payload. When the writer publishes new results the
// model is rebuilt in place and the camera is put straight back, so the
// change appears without the view jumping.
let lastSig = P ? JSON.stringify(P) : null;
setInterval(function(){
  if (!started) return;
  const q = readStore(PKEY);
  if (!q) return;
  const sig = JSON.stringify(q);
  if (sig === lastSig) return;
  lastSig = sig;
  P = q;
  const camSave = camera.position.toArray();
  const tgtSave = controls.target.toArray();
  build();
  camera.position.fromArray(camSave);
  controls.target.fromArray(tgtSave);
  controls.update();
  syncZoom();
  flash();
}, 200);

let waited = 0;
(function bootLoop(){
  if (P){ lastSig = JSON.stringify(P); start(); return; }
  P = readStore(PKEY);
  if (P){ lastSig = JSON.stringify(P); start(); return; }
  waited += 120;
  if (waited > 5000){ boot.textContent = "No model data received."; return; }
  setTimeout(bootLoop, 120);
})();

(function loop(){
  requestAnimationFrame(loop);
  controls.update();
  if (Math.abs(targetDist - curDist) > Math.max(targetDist, 1) * 0.0004){
    curDist += (targetDist - curDist) * 0.20;
    applyDistance(curDist);
    syncZoom();
  }
  renderer.render(scene, camera);
})();
</script>
