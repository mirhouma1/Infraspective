<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#0d1117;
    font-family:-apple-system, "Segoe UI", Roboto, sans-serif; color:#e6edf3; }
  #root { display:flex; flex-direction:column; height:100vh; }
  #stage { position:relative; flex:1 1 auto; min-height:0; touch-action:none; }
  #cv { display:block; width:100%; height:100%; }
  #hud { position:absolute; left:10px; top:8px; font-size:11px; line-height:1.45;
    color:#8b949e; pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.9); }
  #hud b { color:#e6edf3; font-size:12px; }
  #legend { position:absolute; right:10px; top:8px; font-size:10.5px;
    line-height:1.5; color:#c9d1d9; pointer-events:none; text-align:right;
    text-shadow:0 1px 3px rgba(0,0,0,.9); }
  .sw { display:inline-block; width:9px; height:9px; border-radius:2px;
    margin-left:5px; vertical-align:middle; }
  #err { position:absolute; left:10px; bottom:8px; color:#f85149; font-size:11px; }
  #props { position:absolute; right:8px; bottom:8px; max-height:62%;
    overflow:auto; background:rgba(13,17,23,.82); border:1px solid #30363d;
    border-radius:8px; padding:8px 10px; font-size:10.5px; line-height:1.5;
    color:#c9d1d9; display:none; max-width:60%; }
  #props .g { color:#6e7681; text-transform:uppercase; letter-spacing:.05em;
    font-size:9px; margin-top:6px; }
  #props .g:first-child { margin-top:0; }
  #props .k { color:#8b949e; display:inline-block; min-width:58px; }
  #props .v { color:#e6edf3; }
  #bar { flex:0 0 auto; background:#161b22; border-top:1px solid #30363d;
    padding:6px 8px; }
  .row { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  .row + .row { margin-top:5px; }
  button.t { background:#21262d; color:#8b949e; border:1px solid #30363d;
    border-radius:6px; padding:5px 9px; font-size:11px; cursor:pointer;
    white-space:nowrap; }
  button.t.on { background:#1f6feb; color:#fff; border-color:#1f6feb; }
  button.v { background:#21262d; color:#c9d1d9; border:1px solid #30363d;
    border-radius:6px; padding:5px 9px; font-size:11px; cursor:pointer; }
  button.v:active { background:#1f6feb; color:#fff; }
  button.t:focus-visible, button.v:focus-visible, select:focus-visible {
    outline:2px solid #58a6ff; outline-offset:1px; }
  select { background:#21262d; color:#e6edf3; border:1px solid #30363d;
    border-radius:6px; padding:5px 7px; font-size:11px; flex:1 1 190px;
    min-width:150px; }
  .lbl { font-size:10px; color:#6e7681; text-transform:uppercase;
    letter-spacing:.05em; margin-right:2px; }
  #expl { font-size:11px; color:#8b949e; line-height:1.45; margin-top:6px;
    padding-top:6px; border-top:1px solid #21262d; }
</style>
</head>
<body>
<div id="root">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="legend"></div>
    <div id="props"></div>
    <div id="err"></div>
  </div>
  <div id="bar">
    <div class="row">
      <span class="lbl">View</span>
      <button class="v" id="vIso">Iso</button>
      <button class="v" id="vFront">Web face</button>
      <button class="v" id="vSide">Section</button>
      <button class="v" id="vTop">Top</button>
      <button class="v" id="vFit">Fit</button>
      <button class="t" id="vPan">Pan mode</button>
      <button class="v" id="vSpin">Spin</button>
    </div>
    <div class="row">
      <span class="lbl">Parts</span>
      <button class="t" id="pWeb">Web</button>
      <button class="t" id="pFlange">Flanges</button>
      <button class="t" id="pDoub">Doublers</button>
      <button class="t" id="pPin">Pin</button>
      <button class="t" id="pWeld">Welds</button>
      <button class="t" id="pSling">Sling</button>
      <button class="t" id="pExpl">Exploded</button>
    </div>
    <div class="row">
      <span class="lbl">Show</span>
      <button class="t" id="tDim">Dimensions</button>
      <button class="t" id="tPath">Failure paths</button>
      <button class="t" id="tFlow">Load path</button>
      <button class="t" id="tProps">Design data</button>
      <button class="t" id="tLab">Labels</button>
      <button class="t" id="tAx">Axes</button>
    </div>
    <div class="row">
      <span class="lbl">Behaviour</span>
      <select id="mode"></select>
    </div>
    <div id="expl"></div>
  </div>
</div>

<script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
<script>
var DATA = __GEOMETRY_JSON__;

function fail(m) { document.getElementById("err").textContent = m; }

try {

var G = DATA.geom || {};
var RES = DATA.results || {};
var LOAD = DATA.load || {};
var CHECKS = DATA.checks || [];

var stage = document.getElementById("stage");
var canvas = document.getElementById("cv");

var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

var scene = new THREE.Scene();
scene.background = new THREE.Color(DATA.bg || "#0d1117");

function makeEnv() {
  var c = document.createElement("canvas");
  c.width = 16; c.height = 256;
  var g = c.getContext("2d");
  var grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0.00, "#ffffff");
  grad.addColorStop(0.35, "#c8d2dc");
  grad.addColorStop(0.55, "#7d8894");
  grad.addColorStop(0.75, "#3a424b");
  grad.addColorStop(1.00, "#14181d");
  g.fillStyle = grad; g.fillRect(0, 0, 16, 256);
  var tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  var p = new THREE.PMREMGenerator(renderer);
  p.compileEquirectangularShader();
  var env = p.fromEquirectangular(tex).texture;
  p.dispose(); tex.dispose();
  return env;
}
scene.environment = makeEnv();

var key = new THREE.DirectionalLight(0xffffff, 1.35);
key.position.set(1, 1.4, 1); scene.add(key);
var fill = new THREE.DirectionalLight(0xffffff, 0.45);
fill.position.set(-1, 0.3, -0.8); scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff, 0.3));

// =====================================================================
// text sprites
// =====================================================================
function label(text, color, scale) {
  color = color || "#e6edf3";
  scale = scale || 1.0;
  var pad = 8, fs = 44;
  var c = document.createElement("canvas");
  var g = c.getContext("2d");
  g.font = "600 " + fs + "px -apple-system, Segoe UI, Roboto, sans-serif";
  var wpx = Math.ceil(g.measureText(text).width) + pad * 2;
  c.width = wpx; c.height = fs + pad * 2;
  g = c.getContext("2d");
  g.font = "600 " + fs + "px -apple-system, Segoe UI, Roboto, sans-serif";
  g.fillStyle = "rgba(13,17,23,0.72)";
  g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = color;
  g.textBaseline = "middle";
  g.fillText(text, pad, c.height / 2);
  var tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false }));
  sp.userData.aspect = c.width / c.height;
  sp.userData.baseScale = scale;
  return sp;
}
var LABELS = [], labelsOn = true;
function regLabel(sp) { LABELS.push(sp); sp.visible = labelsOn; return sp; }
function setLabels(on) {
  labelsOn = on;
  for (var i = 0; i < LABELS.length; i++) LABELS[i].visible = on;
}
function sizeLabels(root, unit) {
  root.traverse(function (o) {
    if (o.isSprite && o.userData.aspect) {
      var h = unit * o.userData.baseScale;
      o.scale.set(h * o.userData.aspect, h, 1);
    }
  });
}

// =====================================================================
// materials, one per component so each can be coloured on its own
// =====================================================================
var STEEL = new THREE.Color("#9fb0c0");
var DIM = new THREE.Color("#39424e");
var PARTC = {
  member:  new THREE.Color("#9fb0c0"),
  flange:  new THREE.Color("#8b9bab"),
  doubler: new THREE.Color("#7d9ec0"),
  pin:     new THREE.Color("#c9a227"),
  weld:    new THREE.Color("#d97706")
};

function newMat(comp) {
  return new THREE.MeshStandardMaterial({
    color: (PARTC[comp] || STEEL).clone(),
    metalness: DATA.metalness !== undefined ? DATA.metalness : 0.85,
    roughness: DATA.roughness !== undefined ? DATA.roughness : 0.30,
    side: THREE.DoubleSide
  });
}

var MATS = {};       // component -> [materials]
var GROUPS = {};     // component -> THREE.Group
function group(comp) {
  if (!GROUPS[comp]) {
    GROUPS[comp] = new THREE.Group();
    GROUPS[comp].userData.component = comp;
    scene.add(GROUPS[comp]);
  }
  return GROUPS[comp];
}
function addMesh(comp, geo, mat) {
  var m = mat || newMat(comp);
  if (!MATS[comp]) MATS[comp] = [];
  MATS[comp].push(m);
  var mesh = new THREE.Mesh(geo, m);
  mesh.userData.component = comp;
  group(comp).add(mesh);
  return mesh;
}

// =====================================================================
// geometry
// =====================================================================
function buildShape(outer, holes) {
  var s = new THREE.Shape();
  s.moveTo(outer[0][0], outer[0][1]);
  for (var i = 1; i < outer.length; i++) s.lineTo(outer[i][0], outer[i][1]);
  s.closePath();
  for (var h = 0; h < (holes || []).length; h++) {
    var lp = holes[h];
    var p = new THREE.Path();
    p.moveTo(lp[0][0], lp[0][1]);
    for (var j = 1; j < lp.length; j++) p.lineTo(lp[j][0], lp[j][1]);
    p.closePath();
    s.holes.push(p);
  }
  return s;
}
function extrude(outer, holes, depth) {
  var g = new THREE.ExtrudeGeometry(buildShape(outer, holes),
    { depth: depth, bevelEnabled: false, curveSegments: 16, steps: 1 });
  g.translate(0, 0, -depth / 2);
  g.computeVertexNormals();
  return g;
}

var tw = G.tw || 12, td = G.td || 12;
var Dhole = G.Dhole || 45, Dpin = G.Dpin || 42;
var e_top = G.e_top || 90, e_dtop = G.e_dtop || 70;
var W_web = G.W_web || 280, W_d = G.W_d || 280, L_d = G.L_d || 140;
var wWeld = G.w_weld || 0;
var dSec = G.d_sec || 0, bfSec = G.bf_sec || 0, tfSec = G.tf_sec || 0;
var hasSec = (G.has_section || 0) > 0.5;
var webW = G.web_w || W_web;
var yBot = (G.y_bot !== undefined) ? G.y_bot : -(L_d + e_top) * 1.6;
var yTop = (G.y_top !== undefined) ? G.y_top : e_top;
var tEff = G.t_eff || (tw + 2 * td);

// web of the member, bored
addMesh("member", extrude(DATA.web.outer, DATA.web.holes, tw));

// flanges, only when a real section has been picked
if (hasSec) {
  var xF = (dSec - tfSec) / 2.0;
  [-1, 1].forEach(function (sgn) {
    var g = new THREE.BoxGeometry(tfSec, yTop - yBot, bfSec);
    var m = addMesh("flange", g);
    m.position.set(sgn * xF, (yTop + yBot) / 2.0, 0);
    m.userData.explode = new THREE.Vector3(sgn * dSec * 0.55, 0, 0);
  });
}

// doubler plates, one each face of the web. A zero thickness doubler is
// not a plate, so nothing is drawn rather than a zero depth extrusion
// that would render as a stray sheet.
var hasDoubler = td > 0.0;
var zDoub = tw / 2.0 + td / 2.0;
if (hasDoubler) {
  [-1, 1].forEach(function (sgn) {
    var m = addMesh("doubler",
      extrude(DATA.doubler.outer, DATA.doubler.holes, td));
    m.position.z = sgn * zDoub;
    m.userData.explode = new THREE.Vector3(
      0, 0, sgn * Math.max(W_d, L_d) * 0.45);
  });
}

// pin through the bore
(function () {
  var len = tEff + Dpin * 1.1;
  var g = new THREE.CylinderGeometry(Dpin / 2, Dpin / 2, len, 28);
  var m = addMesh("pin", g);
  m.rotation.x = Math.PI / 2;
  m.position.set(0, 0, 0);
  m.userData.explode = new THREE.Vector3(0, 0, Math.max(W_d, L_d) * 1.1);
})();

// fillet welds round the doubler footprint. The two vertical runs and
// the bottom run are always there. The run along the top edge is drawn
// only when it has been included in the check, because the tear-out
// path crosses it and it is normally discounted.
(function () {
  if (!(wWeld > 0) || !hasDoubler) return;
  var yD0 = e_dtop - L_d, yD1 = e_dtop;
  var weldTop = (G.weld_top || 0) > 0.5;
  var off = Math.max(W_d, L_d) * 0.45;

  // A right angle triangle of leg w, extruded len along its own z. The
  // triangle is placed by rotating that local z onto the run direction
  // and then mirroring with a unit scale, which is the only way to get
  // all four corners of a footprint right from one geometry.
  function fillet(len) {
    var tri = new THREE.Shape();
    tri.moveTo(0, 0);
    tri.lineTo(wWeld, 0);
    tri.lineTo(0, wWeld);
    tri.closePath();
    var g = new THREE.ExtrudeGeometry(tri,
      { depth: len, bevelEnabled: false, steps: 1 });
    g.translate(0, 0, -len / 2);
    g.computeVertexNormals();
    return g;
  }

  [-1, 1].forEach(function (sgnZ) {
    // The two vertical runs, up the side edges of the doubler. Rotating
    // -90 about x sends local z to world y, local x to world x and
    // local y to world -z, so the mirrors are sx = sgnX, sy = -sgnZ.
    [-1, 1].forEach(function (sgnX) {
      var m = addMesh("weld", fillet(L_d));
      m.rotation.x = -Math.PI / 2;
      m.scale.set(sgnX, -sgnZ, 1);
      m.position.set(sgnX * W_d / 2, (yD0 + yD1) / 2, sgnZ * (tw / 2));
      m.userData.explode = new THREE.Vector3(0, 0, sgnZ * off);
    });
    // The bottom run, and the top run only when it has been counted in
    // the check. Rotating +90 about y sends local z to world x, local x
    // to world -z and local y to world y, so sx = -sgnZ and sy is the
    // side of the doubler the weld sits on.
    var runs = [[yD0, -1]];
    if (weldTop) runs.push([yD1, 1]);
    runs.forEach(function (rw) {
      var m = addMesh("weld", fillet(W_d));
      m.rotation.y = Math.PI / 2;
      m.scale.set(-sgnZ, rw[1], 1);
      m.position.set(0, rw[0], sgnZ * (tw / 2));
      m.userData.explode = new THREE.Vector3(0, 0, sgnZ * off);
    });
  });
})();

// =====================================================================
// span and overlay helpers
// =====================================================================
var overlays = new THREE.Group(); scene.add(overlays);
var SPAN = Math.max(webW, W_d, e_top + L_d, hasSec ? dSec : 0);
var UNIT = SPAN * 0.055;

function addLine(grp, a, b, color) {
  grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(a[0], a[1], a[2]), new THREE.Vector3(b[0], b[1], b[2])]),
    new THREE.LineBasicMaterial({ color: color, depthTest: false })));
}
function addLabel(grp, text, pos, color, sc) {
  var sp = regLabel(label(text, color, sc));
  sp.position.set(pos[0], pos[1], pos[2]);
  grp.add(sp);
  return sp;
}

// A force is a shaft with a head on it, drawn to a length that means
// something. Everything on screen that represents a force is drawn
// through here, so nothing is ever a bare line the reader has to guess
// the direction of.
function addArrow(grp, origin, dir, len, color, headFrac) {
  var d = new THREE.Vector3(dir[0], dir[1], dir[2]).normalize();
  var o = new THREE.Vector3(origin[0], origin[1], origin[2]);
  var hl = len * (headFrac || 0.18);
  var a = new THREE.ArrowHelper(d, o, len, color, hl, hl * 0.55);
  a.line.material.depthTest = false;
  a.line.material.linewidth = 2;
  a.cone.material.depthTest = false;
  a.line.renderOrder = 5;
  a.cone.renderOrder = 5;
  grp.add(a);
  return a;
}

function fmtkN(v) {
  if (v === null || v === undefined || isNaN(v)) return "";
  return Number(v).toFixed(v >= 100 ? 0 : 1) + " kN";
}

// =====================================================================
// sling and applied force
//
// Tf is the factored load the member sees at the bore, and it acts
// along the axis of the member. The two sling legs at theta from
// horizontal are what puts it there, so each leg carries
//
//     P = Tf / (2 sin theta)
//
// and the horizontal components of the two legs cancel at the pin.
// That is the whole reason the sling angle matters: drop theta from
// 60 to 30 degrees and the leg tension goes up by 73 percent while Tf
// does not move at all. Both numbers are drawn, so the reader can see
// which one the checks are using.
// =====================================================================
var gSling = new THREE.Group(); scene.add(gSling);
(function () {
  var ang = (LOAD.sling_angle_deg !== undefined && LOAD.sling_angle_deg !== null)
    ? Number(LOAD.sling_angle_deg) : 60.0;
  var th = ang * Math.PI / 180.0;
  var Tf = (RES.Tf_kN !== undefined && RES.Tf_kN !== null)
    ? Number(RES.Tf_kN) : null;
  var s = Math.sin(th);
  var Pleg = (Tf !== null && s > 1e-6) ? Tf / (2.0 * s) : null;

  var len = SPAN * 0.70;
  var colLeg = 0xff7b72;
  var colRes = 0x7ee787;

  // the two legs, drawn from the pin outwards along the sling
  [-1, 1].forEach(function (sgn) {
    var dir = [sgn * Math.cos(th), Math.sin(th), 0];
    addArrow(gSling, [0, 0, 0], dir, len, colLeg, 0.16);
  });
  if (Pleg !== null) {
    var lx = Math.cos(th) * len * 0.78, ly = Math.sin(th) * len * 0.78;
    addLabel(gSling, "P = " + fmtkN(Pleg), [lx, ly, 0], "#ff7b72", 0.92);
    addLabel(gSling, "P = " + fmtkN(Pleg), [-lx, ly, 0], "#ff7b72", 0.92);
  }

  // the resultant the checks actually use, straight up the member
  addArrow(gSling, [0, 0, 0], [0, 1, 0], len * 0.92, colRes, 0.16);
  addLabel(gSling, "Tf = " + (Tf === null ? "-" : fmtkN(Tf)),
           [SPAN * 0.10, len * 0.86, 0], "#7ee787", 1.0);

  // the included angle, drawn as an arc off the horizontal so it is
  // obvious which angle theta is
  (function () {
    var r = len * 0.34, pts = [];
    for (var i = 0; i <= 24; i++) {
      var a = th * i / 24.0;
      pts.push(new THREE.Vector3(r * Math.cos(a), r * Math.sin(a), 0));
    }
    gSling.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineDashedMaterial({ color: 0xffa657, depthTest: false })));
    addLine(gSling, [0, 0, 0], [r * 1.15, 0, 0], 0xffa657);
    addLabel(gSling, ang.toFixed(0) + " deg",
             [r * Math.cos(th / 2) * 1.18, r * Math.sin(th / 2) * 1.18, 0],
             "#ffa657", 0.85);
  })();
})();

// =====================================================================
// load path
//
// Where the force goes after it reaches the bore. This is the part a
// bored eye gets wrong most often, so it is drawn rather than
// described: the doublers only carry what the weld can deliver into
// them, and below the doublers the section is back to the bare member.
// =====================================================================
var gFlow = new THREE.Group(); overlays.add(gFlow);
(function () {
  var Pw = LOAD.P_web_kN, Pd = LOAD.P_doubler_kN;
  var yD0 = e_dtop - L_d;
  var arrowLen = Math.max(L_d, e_top) * 0.42;

  // bearing on the loaded half of the bore, pushing up on the material
  // above it
  (function () {
    var r = Dhole / 2.0;
    for (var i = 0; i <= 6; i++) {
      var a = Math.PI * (0.12 + 0.76 * i / 6.0);
      var px = r * Math.cos(a), py = r * Math.sin(a);
      addArrow(gFlow, [px, py, 0], [Math.cos(a), Math.sin(a), 0],
               r * 0.55, 0xf0883e, 0.30);
    }
    addLabel(gFlow, "bearing on the bore", [0, Dhole * 0.90, tEff * 0.5],
             "#f0883e", 0.85);
  })();

  // the share each ply carries, drawn on the ply that carries it
  if (Pw !== undefined && Pw !== null) {
    addArrow(gFlow, [0, yD0 - arrowLen * 1.15, 0], [0, -1, 0],
             arrowLen, 0x58a6ff, 0.20);
    addLabel(gFlow, "web " + fmtkN(Pw),
             [webW * 0.16, yD0 - arrowLen * 1.55, 0], "#58a6ff", 0.85);
  }
  if (hasDoubler && Pd !== undefined && Pd !== null) {
    [-1, 1].forEach(function (sgn) {
      addArrow(gFlow, [0, yD0 + L_d * 0.32, sgn * zDoub], [0, -1, 0],
               arrowLen, 0x7d9ec0, 0.20);
    });
    addLabel(gFlow, "doublers " + fmtkN(Pd),
             [0, yD0 + L_d * 0.10, zDoub * 2.2], "#7d9ec0", 0.85);
  }

  // the weld is the only way into the doublers, so the transfer is
  // drawn across the joint at the side runs
  if (hasDoubler && wWeld > 0) {
    [-1, 1].forEach(function (sgnX) {
      [-1, 1].forEach(function (sgnZ) {
        addArrow(gFlow, [sgnX * W_d / 2, yD0 + L_d * 0.55, sgnZ * (tw / 2)],
                 [0, 0, sgnZ], Math.max(td * 2.2, wWeld * 3.0),
                 0xd97706, 0.28);
      });
    });
    addLabel(gFlow, "weld delivers the doublers' share",
             [0, yD0 + L_d * 0.72, zDoub * 2.6], "#d97706", 0.82);
  }

  // and below it all, the bare member, Cl. 13.2 (a)
  addLabel(gFlow, "below here the bare member carries all of Tf, Cl. 13.2 (a)",
           [0, yD0 - arrowLen * 2.15, 0], "#8b949e", 0.80);
})();

// =====================================================================
// dimensions
// =====================================================================
var gDim = new THREE.Group(); overlays.add(gDim);
(function () {
  var zf = tEff / 2 + 0.6;
  var o = SPAN * 0.10;

  addLine(gDim, [W_d / 2 + o, 0, zf], [W_d / 2 + o, e_top, zf], 0x7ee787);
  addLabel(gDim, "e_top = " + e_top.toFixed(0),
           [W_d / 2 + o * 2.2, e_top * 0.5, zf], "#7ee787", 0.9);

  addLine(gDim, [-W_d / 2 - o, 0, zf], [-W_d / 2 - o, e_dtop, zf], 0x58a6ff);
  addLabel(gDim, "e_dtop = " + e_dtop.toFixed(0),
           [-W_d / 2 - o * 2.4, e_dtop * 0.5, zf], "#58a6ff", 0.9);

  addLine(gDim, [-W_d / 2, e_dtop - L_d - o, zf], [W_d / 2, e_dtop - L_d - o, zf],
          0x58a6ff);
  addLabel(gDim, "W_d = " + W_d.toFixed(0),
           [0, e_dtop - L_d - o * 2.0, zf], "#58a6ff", 0.9);

  addLine(gDim, [-W_d / 2 - o * 2.6, e_dtop - L_d, zf],
          [-W_d / 2 - o * 2.6, e_dtop, zf], 0x58a6ff);
  addLabel(gDim, "L_d = " + L_d.toFixed(0),
           [-W_d / 2 - o * 4.2, e_dtop - L_d / 2, zf], "#58a6ff", 0.9);

  addLine(gDim, [-webW / 2, e_top + o, zf], [webW / 2, e_top + o, zf], 0x8b949e);
  addLabel(gDim, "clear web = " + W_web.toFixed(0),
           [0, e_top + o * 2.0, zf], "#c9d1d9", 0.9);

  addLabel(gDim, "bore " + Dhole.toFixed(0), [0, -Dhole * 0.85, zf],
           "#c9d1d9", 0.9);
  addLabel(gDim, "pin " + Dpin.toFixed(0), [0, -Dhole * 1.35, zf],
           "#c9a227", 0.9);
  addLabel(gDim, "tw = " + tw.toFixed(1) + "  td = " + td.toFixed(1)
           + "  t_eff = " + tEff.toFixed(1),
           [0, -Dhole * 1.9, zf], "#8b949e", 0.85);
  if (hasSec && DATA.section) {
    addLabel(gDim, DATA.section, [0, yTop + o * 3.4, 0], "#c9d1d9", 1.0);
  }
})();

// =====================================================================
// failure paths
// =====================================================================
var gPath = new THREE.Group(); overlays.add(gPath);
(function () {
  var P = DATA.paths;
  if (!P) { return; }
  var zf = tEff / 2 + 0.8;

  function poly(pts, color, z) {
    if (!pts || pts.length < 2) { return; }
    var v = [];
    for (var i = 0; i < pts.length; i++) {
      v.push(new THREE.Vector3(pts[i][0], pts[i][1], z));
    }
    gPath.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(v),
      new THREE.LineBasicMaterial({ color: color, depthTest: false })));
  }

  [-1, 1].forEach(function (sgn) {
    poly(P.tearout, 0xff7b72, sgn * zf);
    poly(P.tearout_mirror, 0xff7b72, sgn * zf);
    poly(P.net_left, 0xffa657, sgn * zf);
    poly(P.net_right, 0xffa657, sgn * zf);
    poly(P.bearing, 0x7ee787, sgn * zf);
  });

  // where the doubler stops and the path continues through the web
  (P.split || []).forEach(function (pt) {
    var g = new THREE.SphereGeometry(Math.max(1.2, Dhole * 0.045), 12, 10);
    var m = new THREE.Mesh(g, new THREE.MeshBasicMaterial(
      { color: 0xff7b72, depthTest: false }));
    m.position.set(pt[0], pt[1], zf);
    gPath.add(m);
  });

  if (P.label_tearout) {
    var t = "tear-out k = " + Number(P.k).toFixed(0);
    if (P.k_doubler !== null && P.k_doubler !== undefined
        && P.k_web !== null && P.k_web !== undefined) {
      t += "  (" + Number(P.k_doubler).toFixed(0) + " through the pack, "
         + Number(P.k_web).toFixed(0) + " web alone)";
    }
    addLabel(gPath, t, [P.label_tearout[0], P.label_tearout[1], zf],
             "#ff7b72", 0.85);
  }
  if (P.label_net) {
    addLabel(gPath, "Anet section", [P.label_net[0], P.label_net[1], zf],
             "#ffa657", 0.85);
  }
  if (P.label_bearing) {
    addLabel(gPath, "bearing", [P.label_bearing[0], P.label_bearing[1], zf],
             "#7ee787", 0.85);
  }
})();

var gAx = new THREE.Group(); overlays.add(gAx);
(function () {
  var a = SPAN * 0.75;
  var defs = [[[a, 0, 0], 0xff7b72, "x"], [[0, a, 0], 0x7ee787, "y"],
              [[0, 0, a], 0x79c0ff, "z"]];
  for (var i = 0; i < defs.length; i++) {
    addLine(gAx, [0, 0, 0], defs[i][0], defs[i][1]);
    addLabel(gAx, defs[i][2], [defs[i][0][0] * 1.1, defs[i][0][1] * 1.1,
             defs[i][0][2] * 1.1],
             "#" + new THREE.Color(defs[i][1]).getHexString(), 1.1);
  }
})();

// =====================================================================
// colour modes
// =====================================================================
function utilColor(u) {
  if (u === null || u === undefined) return STEEL.clone();
  var c = new THREE.Color();
  var x = Math.max(0, Math.min(1.3, u)) / 1.3;
  c.setHSL((1 - x) * 0.33, 0.75, 0.5);
  return c;
}

function worstFor(comp) {
  var w = null;
  for (var i = 0; i < CHECKS.length; i++) {
    var c = CHECKS[i];
    if (c.component === comp && c.uc !== null && c.uc !== undefined) {
      if (w === null || c.uc > w.uc) w = c;
    }
  }
  return w;
}

function setComp(comp, col) {
  var list = MATS[comp] || [];
  for (var i = 0; i < list.length; i++) list[i].color.copy(col);
}

function paint(mode) {
  var comps = Object.keys(MATS);
  var html = "";
  for (var i = 0; i < comps.length; i++) {
    var comp = comps[i];
    if (mode === "plain") {
      setComp(comp, (PARTC[comp] || STEEL).clone());
    } else if (mode === "util") {
      var w = worstFor(comp);
      setComp(comp, w ? utilColor(w.uc) : (PARTC[comp] || STEEL).clone());
    } else if (mode === "gov") {
      var w2 = worstFor(comp);
      var isGov = w2 && w2.label === RES.governing_name;
      setComp(comp, isGov ? utilColor(w2.uc) : DIM.clone());
    } else if (mode === "verdict") {
      var w3 = worstFor(comp);
      if (!w3) setComp(comp, DIM.clone());
      else setComp(comp, new THREE.Color(
        w3.verdict === "OK" ? "#3fb950" : "#f85149"));
    }
  }
  if (mode === "util" || mode === "gov") {
    for (var j = 0; j < CHECKS.length; j++) {
      var c = CHECKS[j];
      if (c.uc === null || c.uc === undefined) continue;
      html += c.label + " " + c.uc.toFixed(3)
        + "<span class='sw' style='background:#"
        + utilColor(c.uc).getHexString() + "'></span><br>";
    }
  } else if (mode === "verdict") {
    for (var k = 0; k < CHECKS.length; k++) {
      html += CHECKS[k].label + " " + CHECKS[k].verdict
        + "<span class='sw' style='background:"
        + (CHECKS[k].verdict === "OK" ? "#3fb950" : "#f85149")
        + "'></span><br>";
    }
  }
  document.getElementById("legend").innerHTML = html;
}

// =====================================================================
// exploded view
// =====================================================================
var explodeOn = false;
function applyExplode(on) {
  explodeOn = on;
  var comps = Object.keys(GROUPS);
  for (var i = 0; i < comps.length; i++) {
    GROUPS[comps[i]].traverse(function (o) {
      if (!o.isMesh) return;
      if (!o.userData.home) o.userData.home = o.position.clone();
      var e = o.userData.explode;
      o.position.copy(o.userData.home);
      if (on && e) o.position.add(e);
    });
  }
}

// =====================================================================
// camera and orbit
// =====================================================================
var FOV = 32;
var radius = SPAN * 1.1;
var camera = new THREE.PerspectiveCamera(FOV, 1, radius * 0.004, radius * 400);
var focusY = (e_top + (e_dtop - L_d)) * 0.35;
var target = new THREE.Vector3(0, focusY, 0);
var sph = { theta: 0.85, phi: 1.15, dist: radius * 2.6 };
var spin = false, panMode = false;

function fitDist(objH, objW, margin) {
  var vt = Math.tan(FOV * Math.PI / 360);
  var asp = camera.aspect || 1;
  return Math.max((objH / 2) / vt, (objW / 2) / (asp * vt)) * (margin || 1.15);
}
function fitWhole(margin) {
  return fitDist((e_top - (e_dtop - L_d)) * 2.6,
                 Math.max(webW, W_d) * 1.7, margin || 1.15);
}
function applyCamera() {
  sph.phi = Math.max(0.02, Math.min(Math.PI - 0.02, sph.phi));
  sph.dist = Math.max(radius * 0.05, Math.min(radius * 40, sph.dist));
  var sp = Math.sin(sph.phi);
  camera.position.set(
    target.x + sph.dist * sp * Math.sin(sph.theta),
    target.y + sph.dist * Math.cos(sph.phi),
    target.z + sph.dist * sp * Math.cos(sph.theta));
  camera.lookAt(target);
}
function pan(dxPx, dyPx) {
  var hpx = stage.clientHeight || 1;
  var worldPerPx = 2 * sph.dist * Math.tan(FOV * Math.PI / 360) / hpx;
  var st = Math.sin(sph.theta), ct = Math.cos(sph.theta);
  var sp = Math.sin(sph.phi), cp = Math.cos(sph.phi);
  target.x += (-dxPx * ct + dyPx * (-st * cp)) * worldPerPx;
  target.y += (dyPx * sp) * worldPerPx;
  target.z += (-dxPx * (-st) + dyPx * (-ct * cp)) * worldPerPx;
  applyCamera();
}
applyCamera();

var ptrs = {}, last = null, pinch0 = null, mid0 = null;
canvas.addEventListener("pointerdown", function (e) {
  canvas.setPointerCapture(e.pointerId);
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  if (Object.keys(ptrs).length === 1) last = { x: e.clientX, y: e.clientY };
  spin = false;
});
canvas.addEventListener("pointermove", function (e) {
  if (!ptrs[e.pointerId]) return;
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  var ids = Object.keys(ptrs);
  if (ids.length === 1 && last) {
    var dx = e.clientX - last.x, dy = e.clientY - last.y;
    if (panMode) { pan(dx, dy); }
    else { sph.theta -= dx * 0.009; sph.phi -= dy * 0.009; applyCamera(); }
    last = { x: e.clientX, y: e.clientY };
  } else if (ids.length === 2) {
    var a = ptrs[ids[0]], b = ptrs[ids[1]];
    var d2 = Math.hypot(a.x - b.x, a.y - b.y);
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (pinch0 === null) { pinch0 = d2; mid0 = { x: mx, y: my }; }
    if (d2 > 0) { sph.dist *= pinch0 / d2; pinch0 = d2; }
    if (mid0) { pan(mx - mid0.x, my - mid0.y); mid0 = { x: mx, y: my }; }
    applyCamera();
  }
});
function up(e) {
  delete ptrs[e.pointerId];
  if (Object.keys(ptrs).length < 2) { pinch0 = null; mid0 = null; }
  if (Object.keys(ptrs).length === 0) last = null;
  var rest = Object.keys(ptrs);
  if (rest.length === 1) last = { x: ptrs[rest[0]].x, y: ptrs[rest[0]].y };
}
canvas.addEventListener("pointerup", up);
canvas.addEventListener("pointercancel", up);
canvas.addEventListener("wheel", function (e) {
  e.preventDefault();
  sph.dist *= (1 + (e.deltaY > 0 ? 0.12 : -0.12));
  applyCamera();
}, { passive: false });

function setView(th, ph, dist) {
  spin = false;
  target.set(0, focusY, 0);
  sph.theta = th; sph.phi = ph; sph.dist = dist;
  applyCamera();
  sizeLabels(scene, UNIT * (sph.dist / (radius * 2.6)));
}
document.getElementById("vIso").onclick = function () {
  setView(0.85, 1.15, fitWhole(1.20)); };
document.getElementById("vFront").onclick = function () {
  setView(0, 1.5708, fitWhole(1.10)); };
document.getElementById("vSide").onclick = function () {
  setView(1.5708, 1.5708, fitWhole(1.10)); };
document.getElementById("vTop").onclick = function () {
  setView(0, 0.05, fitDist(Math.max(bfSec, tEff * 6) * 2.2,
                           Math.max(webW, dSec) * 1.5, 1.2)); };
document.getElementById("vFit").onclick = function () {
  setView(sph.theta, sph.phi, fitWhole(1.16)); };
document.getElementById("vSpin").onclick = function () { spin = !spin; };
(function () {
  var pb = document.getElementById("vPan");
  pb.onclick = function () {
    panMode = !panMode; pb.classList.toggle("on", panMode); };
})();

// =====================================================================
// toggles
// =====================================================================
function bindToggle(id, grp, initial, after) {
  var b = document.getElementById(id);
  if (!b) { return function () {}; }
  var on = !!initial;
  function apply() {
    b.classList.toggle("on", on);
    if (grp) grp.visible = on;
    if (after) after(on);
  }
  b.onclick = function () { on = !on; apply(); };
  apply();
  return function (want) { if (want !== on) { on = want; apply(); } };
}

(function () {
  var el = document.getElementById("props");
  var rows = DATA.props || [];
  if (!rows.length) { el.innerHTML = "<div class='g'>No data</div>"; return; }
  var cur = null, html = "";
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (r.group !== cur) { cur = r.group; html += "<div class='g'>" + cur + "</div>"; }
    var u = r.unit ? (" " + r.unit) : "";
    html += "<div><span class='k'>" + r.symbol + "</span><span class='v'>"
         + r.value + u + "</span></div>";
  }
  el.innerHTML = html;
})();

bindToggle("pWeb", group("member"), true);
bindToggle("pFlange", group("flange"), true);
bindToggle("pDoub", group("doubler"), true);
bindToggle("pPin", group("pin"), true);
bindToggle("pWeld", group("weld"), true);
bindToggle("pSling", gSling, true);
bindToggle("pExpl", null, false, function (on) { applyExplode(on); });
bindToggle("tDim", gDim, false);
bindToggle("tPath", gPath, false);
bindToggle("tFlow", gFlow, false);
bindToggle("tAx", gAx, false);
bindToggle("tProps", null, false, function (on) {
  document.getElementById("props").style.display = on ? "block" : "none"; });
bindToggle("tLab", null, true, function (on) { setLabels(on); });

// =====================================================================
// behaviour dropdown
// =====================================================================
var MODES = [
  ["plain", "As fabricated",
   "The eye as built. Turn on Exploded to pull the doublers and the pin "
   + "off the web, and Load path to see where the force actually goes."],
  ["util", "Utilisation by part",
   "Every part is coloured by the worst unity check that applies to it. "
   + "Green is lightly worked, red is at or beyond capacity. A part with "
   + "no check of its own keeps its plain colour."],
  ["gov", "Governing check",
   "Only the part carrying the governing check keeps its colour, "
   + "everything else drops back. This is the one to look at when you "
   + "want to know where the design is actually being decided."],
  ["verdict", "Pass or fail",
   "Flat green for OK and red for NG on every part that carries a check, "
   + "with no shading in between."]
];
var sel = document.getElementById("mode");
for (var i = 0; i < MODES.length; i++) {
  var o = document.createElement("option");
  o.value = MODES[i][0]; o.textContent = MODES[i][1];
  sel.appendChild(o);
}
var currentMode = "plain";
function setMode(m) {
  currentMode = m;
  paint(m);
  for (var i = 0; i < MODES.length; i++) {
    if (MODES[i][0] === m) {
      document.getElementById("expl").textContent = MODES[i][2];
    }
  }
}
sel.onchange = function () { setMode(sel.value); };
setMode("plain");

// =====================================================================
// hud
// =====================================================================
(function () {
  var h = "<b>" + (DATA.label || "Lifting eye") + "</b><br>";
  if (DATA.section) { h += DATA.section + "<br>"; }
  h += "bore " + Dhole.toFixed(0) + " through tw " + tw.toFixed(1)
     + " + 2 x PL" + td.toFixed(0) + "<br>";
  h += "doubler " + W_d.toFixed(0) + " x " + L_d.toFixed(0)
     + " x " + td.toFixed(0);
  if (RES.Tf_kN !== undefined && RES.Tf_kN !== null) {
    h += "<br>Tf = " + Number(RES.Tf_kN).toFixed(1) + " kN";
  }
  if (RES.governing_name) {
    h += "<br>governs: " + RES.governing_name;
    if (RES.governing_uc !== undefined && RES.governing_uc !== null) {
      h += " at " + Number(RES.governing_uc).toFixed(3);
    }
  }
  if (RES.overall) {
    h += "<br><span style='color:"
      + (RES.overall === "OK" ? "#3fb950" : "#f85149") + "'>"
      + RES.overall + "</span>";
  }
  document.getElementById("hud").innerHTML = h;
})();

// =====================================================================
// resize and loop
// =====================================================================
function resize() {
  var w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  sizeLabels(scene, UNIT * (sph.dist / (radius * 2.6)));
}
window.addEventListener("resize", resize);
resize();
sph.dist = fitWhole(1.20);
applyCamera();
sizeLabels(scene, UNIT * (sph.dist / (radius * 2.6)));

var lastDist = sph.dist;
function loop() {
  requestAnimationFrame(loop);
  if (spin) { sph.theta += 0.004; applyCamera(); }
  if (Math.abs(sph.dist - lastDist) > radius * 0.01) {
    lastDist = sph.dist;
    sizeLabels(scene, UNIT * (sph.dist / (radius * 2.6)));
  }
  renderer.render(scene, camera);
}
loop();

} catch (err) {
  fail("Viewer error: " + err.message);
}
</script>
</body>
