<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#0d1117;
    font-family:-apple-system, "Segoe UI", Roboto, sans-serif; color:#e6edf3; }
  #root { display:flex; flex-direction:column; height:100vh; }
  #stage { position:relative; flex:1 1 auto; min-height:0; touch-action:none; }
  #cv { display:block; width:100%; height:100%; }
  #hud { position:absolute; left:10px; top:8px; font-size:11px; line-height:1.45;
    color:#8b949e; pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.9); }
  #hud b { color:#e6edf3; font-size:12px; }
  #legend { position:absolute; right:10px; top:8px; font-size:10.5px;
    line-height:1.5; color:#c9d1d9; pointer-events:none; text-align:right;
    text-shadow:0 1px 3px rgba(0,0,0,.9); }
  .sw { display:inline-block; width:9px; height:9px; border-radius:2px;
    margin-left:5px; vertical-align:middle; }
  #err { position:absolute; left:10px; bottom:8px; color:#f85149; font-size:11px; }
  #props { position:absolute; right:8px; bottom:8px; max-height:62%;
    overflow:auto; background:rgba(13,17,23,.82); border:1px solid #30363d;
    border-radius:8px; padding:8px 10px; font-size:10.5px; line-height:1.5;
    color:#c9d1d9; display:none; max-width:60%; }
  #props .g { color:#6e7681; text-transform:uppercase; letter-spacing:.05em;
    font-size:9px; margin-top:6px; }
  #props .g:first-child { margin-top:0; }
  #props .k { color:#8b949e; display:inline-block; min-width:52px; }
  #props .v { color:#e6edf3; }
  #bar { flex:0 0 auto; background:#161b22; border-top:1px solid #30363d;
    padding:6px 8px; }
  .row { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  .row + .row { margin-top:5px; }
  button.t { background:#21262d; color:#8b949e; border:1px solid #30363d;
    border-radius:6px; padding:5px 9px; font-size:11px; cursor:pointer;
    white-space:nowrap; }
  button.t.on { background:#1f6feb; color:#fff; border-color:#1f6feb; }
  button.v { background:#21262d; color:#c9d1d9; border:1px solid #30363d;
    border-radius:6px; padding:5px 9px; font-size:11px; cursor:pointer; }
  button.v:active { background:#1f6feb; color:#fff; }
  button.t:focus-visible, button.v:focus-visible, select:focus-visible {
    outline:2px solid #58a6ff; outline-offset:1px; }
  select { background:#21262d; color:#e6edf3; border:1px solid #30363d;
    border-radius:6px; padding:5px 7px; font-size:11px; flex:1 1 190px;
    min-width:150px; }
  .lbl { font-size:10px; color:#6e7681; text-transform:uppercase;
    letter-spacing:.05em; margin-right:2px; }
  #expl { font-size:11px; color:#8b949e; line-height:1.45; margin-top:6px;
    padding-top:6px; border-top:1px solid #21262d; }
</style>
</head>
<body>
<div id="root">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="legend"></div>
    <div id="props"></div>
    <div id="err"></div>
  </div>
  <div id="bar">
    <div class="row">
      <span class="lbl">View</span>
      <button class="v" id="vIso">Iso</button>
      <button class="v" id="vElev">Elevation</button>
      <button class="v" id="vPlan">Plan</button>
      <button class="v" id="vEnd">Section</button>
      <button class="v" id="vFit">Fit</button>
      <button class="t" id="vPan">Pan mode</button>
      <button class="v" id="vSpin">Spin</button>
    </div>
    <div class="row">
      <span class="lbl">Show</span>
      <button class="t" id="tDim">Dimensions</button>
      <button class="t" id="tProps">Section data</button>
      <button class="t" id="tLab">Labels</button>
      <button class="t" id="tSup">Supports</button>
      <button class="t" id="tAx">Axes</button>
      <button class="t" id="tLoad">Load</button>
      <button class="t" id="tMom">Moment diagram</button>
      <button class="t" id="tBrace">Lateral bracing</button>
    </div>
    <div class="row">
      <span class="lbl">Shape</span>
      <button class="t" id="tDefl">Deflected shape</button>
      <button class="t" id="tLTB">LTB shape</button>
    </div>
    <div class="row">
      <span class="lbl">Behaviour</span>
      <select id="mode"></select>
    </div>
    <div id="expl"></div>
  </div>
</div>

<script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
<script>
var DATA = __GEOMETRY_JSON__;

function fail(m) { document.getElementById("err").textContent = m; }

// =====================================================================
// view-state persistence
//
// Streamlit tears this iframe down and rebuilds it on every rerun, so
// without help the camera, the toggles and the behaviour mode all reset
// whenever any input on the page changes. The cure: every interaction
// writes a small state blob to sessionStorage, and a fresh mount reads
// it back before first paint. Camera distance and target are stored as
// ratios of the model size, so the restore still frames sensibly after
// the span or the section changes.
// =====================================================================
var SKEY = "ifs_flexure_viewer_v1";
var SAVED = null;
try { SAVED = JSON.parse(sessionStorage.getItem(SKEY) || "null"); }
catch (e0) { SAVED = null; }

var TSTATE = {};          // live toggle states by button id
var _saveTimer = null;
function persist() {
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(function () {
    try {
      sessionStorage.setItem(SKEY, JSON.stringify({
        cam: { theta: sph.theta, phi: sph.phi,
               distR: sph.dist / radius,
               tx: target.x / L, ty: target.y / L, tz: target.z / L,
               pan: panMode },
        mode: currentMode,
        togg: TSTATE
      }));
    } catch (e1) {}
  }, 150);
}

try {

// =====================================================================
// scene
// =====================================================================
var stage = document.getElementById("stage");
var canvas = document.getElementById("cv");

var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

var scene = new THREE.Scene();
scene.background = new THREE.Color(DATA.bg || "#0d1117");

function makeEnv() {
  var c = document.createElement("canvas");
  c.width = 16; c.height = 256;
  var g = c.getContext("2d");
  var grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0.00, "#ffffff");
  grad.addColorStop(0.35, "#c8d2dc");
  grad.addColorStop(0.55, "#7d8894");
  grad.addColorStop(0.75, "#3a424b");
  grad.addColorStop(1.00, "#14181d");
  g.fillStyle = grad; g.fillRect(0, 0, 16, 256);
  var tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  var p = new THREE.PMREMGenerator(renderer);
  p.compileEquirectangularShader();
  var env = p.fromEquirectangular(tex).texture;
  p.dispose(); tex.dispose();
  return env;
}
scene.environment = makeEnv();

var key = new THREE.DirectionalLight(0xffffff, 1.35);
key.position.set(1, 1.4, 1); scene.add(key);
var fill = new THREE.DirectionalLight(0xffffff, 0.45);
fill.position.set(-1, 0.3, -0.8); scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff, 0.3));

// =====================================================================
// text sprites
// =====================================================================
function label(text, color, scale) {
  color = color || "#e6edf3";
  scale = scale || 1.0;
  var pad = 8, fs = 44;
  var c = document.createElement("canvas");
  var g = c.getContext("2d");
  g.font = "600 " + fs + "px -apple-system, Segoe UI, Roboto, sans-serif";
  var wpx = Math.ceil(g.measureText(text).width) + pad * 2;
  c.width = wpx; c.height = fs + pad * 2;
  g = c.getContext("2d");
  g.font = "600 " + fs + "px -apple-system, Segoe UI, Roboto, sans-serif";
  g.fillStyle = "rgba(13,17,23,0.72)";
  g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = color;
  g.textBaseline = "middle";
  g.fillText(text, pad, c.height / 2);
  var tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false }));
  sp.userData.aspect = c.width / c.height;
  sp.userData.baseScale = scale;
  return sp;
}

var LABELS = [];
var labelsOn = true;

function regLabel(sp) { LABELS.push(sp); sp.visible = labelsOn; return sp; }

function setLabels(on) {
  labelsOn = on;
  for (var i = 0; i < LABELS.length; i++) LABELS[i].visible = on;
}

function sizeLabels(root, unit) {
  root.traverse(function (o) {
    if (o.isSprite && o.userData.aspect) {
      var h = unit * o.userData.baseScale;
      o.scale.set(h * o.userData.aspect, h, 1);
    }
  });
}

// =====================================================================
// geometry
// =====================================================================
function buildShape(outer, holes) {
  var s = new THREE.Shape();
  s.moveTo(outer[0][0], outer[0][1]);
  for (var i = 1; i < outer.length; i++) s.lineTo(outer[i][0], outer[i][1]);
  s.closePath();
  for (var h = 0; h < (holes || []).length; h++) {
    var lp = holes[h];
    var p = new THREE.Path();
    p.moveTo(lp[0][0], lp[0][1]);
    for (var j = 1; j < lp.length; j++) p.lineTo(lp[j][0], lp[j][1]);
    p.closePath();
    s.holes.push(p);
  }
  return s;
}

var L = DATA.length_mm;
var STEPS = 64;

var member = new THREE.Group();
var overlays = new THREE.Group();
scene.add(member); scene.add(overlays);

var mat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  metalness: DATA.metalness !== undefined ? DATA.metalness : 0.85,
  roughness: DATA.roughness !== undefined ? DATA.roughness : 0.3,
  vertexColors: true,
  side: THREE.DoubleSide
});

var meshes = [];
var loops = [DATA.outer].concat(DATA.extra_loops || []);
for (var li = 0; li < loops.length; li++) {
  var shp = buildShape(loops[li], li === 0 ? (DATA.holes || []) : []);
  var g = new THREE.ExtrudeGeometry(shp, {
    depth: L, bevelEnabled: false, curveSegments: 12, steps: STEPS });
  g.translate(0, 0, -L / 2);
  g.computeVertexNormals();
  g.userData.base = g.attributes.position.array.slice(0);
  var m = new THREE.Mesh(g, mat);
  member.add(m);
  meshes.push(m);
}

// The member is left in its extrusion frame, so it lies down as a beam:
//   local x = lateral, across the flange width
//   local y = section depth, up
//   local z = the span
// The column viewer stands the same extrusion up instead. Nothing is
// rotated here, so gravity, sag and the moment diagram all act in -y.

// =====================================================================
// plate-element zone classification
// =====================================================================
var Z = DATA.zones || {};
var kind = DATA.kind || "I";

function zoneOf(x, y) {
  if (kind === "I" || kind === "CHANNEL") {
    if (Math.abs(y) >= (Z.flange_y || 1e9) - 0.51) return "flange";
    return "web";
  }
  if (kind === "TEE") {
    var top = (DATA.dims.d || 0) - (DATA.dims.y_bar || 0);
    if (y >= top - (DATA.dims.t || 0) - 0.51) return "flange";
    return "web";
  }
  if (kind === "RHS") {
    if (Math.abs(y) >= (Z.flange_y || 1e9) - 0.51) return "flange";
    if (Math.abs(x) >= (Z.web_x || 1e9) - 0.51) return "web";
    return "flange";
  }
  if (kind === "CHS") return "wall";
  return "leg";
}

var zoneCache = [];
for (var mi = 0; mi < meshes.length; mi++) {
  var pos = meshes[mi].geometry.userData.base;
  var zc = new Array(pos.length / 3);
  for (var vi = 0; vi < zc.length; vi++) {
    zc[vi] = zoneOf(pos[vi * 3], pos[vi * 3 + 1]);
  }
  zoneCache.push(zc);
}

// =====================================================================
// span functions: load type, moment envelope, deflected shape
// =====================================================================
var D = DATA.dims || {};
var RES = DATA.results || {};
var LOAD = DATA.load || {};
var LOADT = String(LOAD.type || "none").toLowerCase();
var CLS = parseInt(RES.section_class || 0, 10);
var halfD = (D.d || 100) / 2;

var LB = L;
if (DATA.supports && DATA.supports.x && DATA.supports.x.L > 0) {
  LB = Math.min(DATA.supports.x.L, L);
}

var ENDS = String((DATA.supports && DATA.supports.ends) || "pin_pin");

function spanFrac(zz) { return (zz + L / 2) / L; }

// ---------------------------------------------------------------------
// Raw bending moment along the span, in units of w L^2 for a UDL and
// P L for a point load. s runs 0 at the left support to 1 at the right.
// Sagging is positive. A fixed end therefore returns a negative value,
// and the diagram is drawn on the far side of the baseline.
//
// fix_free is a cantilever built in at s = 0, and its point load acts at
// the free tip rather than at mid-span.
// ---------------------------------------------------------------------
function rawMom(s) {
  s = Math.max(0, Math.min(1, s));
  if (LOADT === "udl") {
    if (ENDS === "fix_fix") return 0.5 * s * (1 - s) - 1 / 12;
    if (ENDS === "fix_pin") return -1 / 8 + 5 * s / 8 - 0.5 * s * s;
    if (ENDS === "fix_free") return -0.5 * (1 - s) * (1 - s);
    return 0.5 * s * (1 - s);
  }
  if (LOADT === "point") {
    if (ENDS === "fix_free") return -(1 - s);
    if (ENDS === "fix_fix") {
      return (s <= 0.5) ? (s / 2 - 1 / 8) : ((1 - s) / 2 - 1 / 8);
    }
    if (ENDS === "fix_pin") {
      return (s <= 0.5) ? (-3 / 16 + 11 * s / 16) : (5 / 16) * (1 - s);
    }
    return (s <= 0.5) ? (s / 2) : ((1 - s) / 2);
  }
  return 1;                                   // uniform moment
}

// Raw deflected shape, positive downwards.
function rawDefl(s) {
  s = Math.max(0, Math.min(1, s));
  if (LOADT === "udl") {
    if (ENDS === "fix_fix") return s * s * (1 - s) * (1 - s);
    if (ENDS === "fix_pin") return s * s * (3 - 5 * s + 2 * s * s);
    if (ENDS === "fix_free") return s * s * (6 - 4 * s + s * s);
    return s - 2 * s * s * s + s * s * s * s;
  }
  if (LOADT === "point") {
    if (ENDS === "fix_free") return s * s * (3 - s);
    if (ENDS === "fix_fix") {
      var u = s <= 0.5 ? s : 1 - s;
      return u * u * (3 - 4 * u);
    }
    if (ENDS === "fix_pin") return s * s * (3 - 5 * s + 2 * s * s);
    var t = s <= 0.5 ? s : 1 - s;
    return 3 * t - 4 * t * t * t;
  }
  return Math.sin(Math.PI * s);
}

// Both shapes are normalised numerically, so the peak of whichever case
// is selected reads as 1. Sampling beats hard-coding a constant for each
// of the eight combinations.
function peakOf(fn) {
  var mx = 0;
  for (var i = 0; i <= 400; i++) {
    var v = Math.abs(fn(i / 400));
    if (v > mx) mx = v;
  }
  return mx > 1e-9 ? mx : 1;
}
var MOM_PEAK = peakOf(rawMom);
var DEFL_PEAK = peakOf(rawDefl);

// Signed, normalised. Negative means hogging, so the top flange is in
// tension there and the bottom flange carries the compression.
function momEnv(zz) { return rawMom(spanFrac(zz)) / MOM_PEAK; }

// Normalised, positive downwards.
function deflEnv(zz) { return rawDefl(spanFrac(zz)) / DEFL_PEAK; }

// Lateral torsional half-wave, one per unbraced length, alternating side.
function ltbEnv(zz) {
  var s = zz + L / 2;
  var lb = LB > 0 ? LB : L;
  var k = Math.floor(s / lb - 1e-9);
  if (k < 0) k = 0;
  var u = (s - k * lb) / lb;
  u = Math.max(0, Math.min(1, u));
  var sign = (k % 2 === 0) ? 1 : -1;
  return sign * Math.sin(Math.PI * u);
}

// =====================================================================
// colour modes
// =====================================================================
var STEEL = new THREE.Color("#9fb0c0");
var DIM = new THREE.Color("#4a5568");
var COMP = new THREE.Color("#f85149");     // compression fibres
var TENS = new THREE.Color("#58a6ff");     // tension fibres
var NEUT = new THREE.Color("#6e7681");     // neutral axis
var CLSC = [new THREE.Color("#3fb950"), new THREE.Color("#58a6ff"),
            new THREE.Color("#d29922"), new THREE.Color("#f85149")];

function utilColor(u) {
  var c = new THREE.Color();
  if (u === null || u === undefined) return STEEL.clone();
  var x = Math.max(0, Math.min(1.3, u)) / 1.3;
  c.setHSL((1 - x) * 0.33, 0.75, 0.5);
  return c;
}

function heatColor(f) {
  var c = new THREE.Color();
  c.setHSL(0.66 - 0.66 * Math.max(0, Math.min(1, f)), 0.85, 0.52);
  return c;
}

// f > 0 compression, f < 0 tension, 0 at the neutral axis.
function bendColor(f) {
  var c = NEUT.clone();
  var a = Math.max(-1, Math.min(1, f));
  if (a >= 0) c.lerp(COMP, a); else c.lerp(TENS, -a);
  return c;
}

// Through-depth stress profile. Class 1 and 2 reach Fy over the whole
// depth, so the block is rectangular. Class 3 and 4 stay elastic, so it
// is the familiar triangle.
function stressProfile(y) {
  if (halfD <= 0) return 0;
  if (CLS >= 1 && CLS <= 2) {
    if (Math.abs(y) < halfD * 0.04) return y / (halfD * 0.04);
    return y > 0 ? 1 : -1;
  }
  return y / halfD;
}

function elementFor(zone, list) {
  if (!list) return null;
  for (var i = 0; i < list.length; i++) {
    if (list[i].zone === zone) return list[i];
  }
  return null;
}

function paint(mode) {
  for (var mi = 0; mi < meshes.length; mi++) {
    var geo = meshes[mi].geometry;
    var n = geo.attributes.position.count;
    var col = new Float32Array(n * 3);
    var base = geo.userData.base;
    for (var vi = 0; vi < n; vi++) {
      var zone = zoneCache[mi][vi];
      var bx = base[vi * 3], by = base[vi * 3 + 1], bz = base[vi * 3 + 2];
      var c = STEEL.clone();

      if (mode === "class") {
        var e2 = elementFor(zone, DATA.elements_t2);
        if (e2 && e2.cls) { c = CLSC[Math.min(3, e2.cls - 1)].clone(); }
        else { c = DIM.clone(); }

      } else if (mode === "stress") {
        c = bendColor(stressProfile(by) * momEnv(bz));

      } else if (mode === "moment") {
        c = heatColor(Math.abs(momEnv(bz)));

      } else if (mode === "ltb") {
        // Whichever flange is in compression at this point along the span
        // is the one that can buckle sideways. Over a fixed end the
        // moment reverses, so it is the bottom flange that needs the
        // bracing there, not the top.
        var mm = momEnv(bz);
        var compTop = (mm >= 0);
        if (zone === "flange" && ((by > 0) === compTop)) {
          c = COMP.clone();
          c.lerp(new THREE.Color("#0d1117"),
                 0.55 * (1 - Math.abs(ltbEnv(bz))));
        } else if (zone === "flange") {
          c = TENS.clone().lerp(new THREE.Color("#0d1117"), 0.45);
        } else {
          c = DIM.clone();
        }

      } else if (mode === "util") {
        c = utilColor(RES.util === undefined ? null : RES.util);
      }

      col[vi * 3] = c.r; col[vi * 3 + 1] = c.g; col[vi * 3 + 2] = c.b;
    }
    geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  }

  var html = "";
  if (mode === "class" && DATA.elements_t2) {
    for (var j = 0; j < DATA.elements_t2.length; j++) {
      var e3 = DATA.elements_t2[j];
      html += e3.label + " Class " + e3.cls
        + "<span class='sw' style='background:#"
        + CLSC[Math.min(3, e3.cls - 1)].getHexString() + "'></span><br>";
    }
    html += "free edge<span class='sw' style='background:#f85149'></span>"
      + "  supported edge"
      + "<span class='sw' style='background:#3fb950'></span><br>"
      + "flange: one edge free | web: both supported";
  } else if (mode === "stress") {
    html = "tension<span class='sw' style='background:#"
      + TENS.getHexString() + "'></span>"
      + "<span class='sw' style='background:#" + NEUT.getHexString()
      + "'></span><span class='sw' style='background:#"
      + COMP.getHexString() + "'></span> compression<br>"
      + (CLS >= 1 && CLS <= 2 ? "Class " + CLS + ", plastic block"
                              : "Class " + (CLS || "?") + ", elastic");
  } else if (mode === "moment") {
    html = "low<span class='sw' style='background:#"
      + heatColor(0).getHexString() + "'></span>"
      + "<span class='sw' style='background:#"
      + heatColor(0.5).getHexString() + "'></span>"
      + "<span class='sw' style='background:#"
      + heatColor(1).getHexString() + "'></span> peak moment";
  } else if (mode === "ltb") {
    html = "compression flange<span class='sw' style='background:#"
      + COMP.getHexString() + "'></span><br>"
      + "Lb = " + (LB / 1000).toFixed(2) + " m";
  } else if (mode === "util" && RES.util !== null && RES.util !== undefined) {
    html = "Mf / Mr  " + (100 * RES.util).toFixed(0) + "%"
      + "<span class='sw' style='background:#"
      + utilColor(RES.util).getHexString() + "'></span>";
  }
  document.getElementById("legend").innerHTML = html;
}

// =====================================================================
// deformed shapes
//
// Deflection sags the beam in -y. Lateral torsional buckling sweeps the
// section sideways in x and twists it about the shear centre, which for
// a doubly symmetric I-shape sits at the centroid. Both are scaled for
// visibility, not to any deflection calculation.
// =====================================================================
var deflOn = false;
var ltbOn = false;

function applyShape() {
  var sag = deflOn ? Math.max(L * 0.020, halfD * 0.30) : 0;
  var amp = ltbOn ? Math.max(L * 0.030, halfD * 0.55) : 0;
  var twist = ltbOn ? 0.22 : 0;

  for (var mi = 0; mi < meshes.length; mi++) {
    var geo = meshes[mi].geometry;
    var p = geo.attributes.position.array;
    var b = geo.userData.base;
    for (var vi = 0; vi < p.length / 3; vi++) {
      var x = b[vi * 3], y = b[vi * 3 + 1], z = b[vi * 3 + 2];
      if (ltbOn) {
        var e = ltbEnv(z);
        var th = twist * e;
        var ct = Math.cos(th), stt = Math.sin(th);

  }
  pts.push(L / 2);

  for (var k = 1; k < pts.length - 1; k++) braceFrame(pts[k]);

  // ---- Lb dimension chain above the beam ----
  addLine(gBrace, [0, yDim, -L / 2], [0, yDim, L / 2], GRN);
  for (var k2 = 0; k2 < pts.length; k2++) {
    addLine(gBrace, [0, yDim - tick, pts[k2]], [0, yDim + tick, pts[k2]],
            GRN);
  }
  var segLen = pts.length > 2 ? LB : L;
  var zMid = (pts[0] + pts[1]) / 2;
  addLabel(gBrace,
           "Lb = " + (segLen / 1000).toFixed(2) + " m (unbraced length)",
           [0, yDim + span * 0.55, zMid], "#7ee787");

  if (pts.length > 2) {
    addLabel(gBrace, "brace point: holds the compression flange sideways",
             [0, yTop + span * 0.45, pts[1]], "#3fb950");
  } else {
    addLabel(gBrace, "no intermediate brace: ends only, Lb = L",
             [0, yTop + span * 0.45, 0], "#7ee787");
  }
})();

// ---- Table 2 element conditions (shown in class mode) ---------------
// Depicts the classification conditions in place on the member: the
// flange outstand is supported along ONE edge (the web junction, solid
// green) and FREE at the tip (dashed red), which is Table 2's "flanges
// of I-sections bent about the major axis". The web is supported along
// BOTH edges. The outstand width b_el = b/2 is dimensioned on the end
// face.
var gClassCond = new THREE.Group(); overlays.add(gClassCond);
(function () {
  var tF = D.t || 0;
  var z0 = -L / 2;

  function dashed(a, b, color) {
    var g = lineGeom(a, b);
    var m = new THREE.LineDashedMaterial({ color: color,
      dashSize: span * 0.45, gapSize: span * 0.3, depthTest: false });
    var ln = new THREE.Line(g, m);
    ln.computeLineDistances();
    gClassCond.add(ln);
  }

  // free tips of both flanges, dashed red
  var yT = halfD - tF / 2, yB = -halfD + tF / 2;
  dashed([-halfB, yT, -L / 2], [-halfB, yT, L / 2], 0xf85149);
  dashed([halfB, yT, -L / 2], [halfB, yT, L / 2], 0xf85149);
  dashed([-halfB, yB, -L / 2], [-halfB, yB, L / 2], 0xf85149);
  dashed([halfB, yB, -L / 2], [halfB, yB, L / 2], 0xf85149);

  // web-to-flange junctions, solid green: the supported edges
  addLine(gClassCond, [0, halfD - tF, -L / 2], [0, halfD - tF, L / 2],
          0x3fb950);
  addLine(gClassCond, [0, -halfD + tF, -L / 2], [0, -halfD + tF, L / 2],
          0x3fb950);

  addLabel(gClassCond, "free edge (tip of the outstand)",
           [-halfB - span * 0.9, halfD + span * 0.75, -L * 0.22],
           "#f85149");
  addLabel(gClassCond, "supported edge (web junction)",
           [halfB + span * 1.1, halfD - tF - span * 0.35, -L * 0.22],
           "#3fb950");
  addLabel(gClassCond, "web: supported along both edges",
           [halfB + span * 1.1, 0, L * 0.22], "#3fb950");

  // b_el = b/2 outstand dimension on the end face
  var yb2 = halfD + span * 0.30;
  var tick = span * 0.10;
  addLine(gClassCond, [0, yb2, z0], [halfB, yb2, z0], 0xf0883e);
  addLine(gClassCond, [0, yb2 - tick, z0], [0, yb2 + tick, z0], 0xf0883e);
  addLine(gClassCond, [halfB, yb2 - tick, z0], [halfB, yb2 + tick, z0],
          0xf0883e);
  addLabel(gClassCond,
           "b_el = b/2 = " + halfB.toFixed(0) + " mm (one outstand)",
           [halfB * 0.5, yb2 + span * 0.45, z0], "#f0883e");
})();
gClassCond.visible = false;

// =====================================================================
// camera and orbit
// =====================================================================
var FOV = 32;
var radius = Math.sqrt(L * L / 4 + span * span) * 1.05;
var camera = new THREE.PerspectiveCamera(FOV, 1, radius * 0.004, radius * 400);
var target = new THREE.Vector3(0, 0, 0);
var sph = { theta: 0.85, phi: 1.15, dist: radius * 2.6 };
var spin = false;
var panMode = false;

function fitDist(objH, objW, margin) {
  var vt = Math.tan(FOV * Math.PI / 360);
  var asp = camera.aspect || 1;
  var dH = (objH / 2) / vt;
  var dW = (objW / 2) / (asp * vt);
  return Math.max(dH, dW) * (margin || 1.15);
}

// The beam runs horizontally, so the span sets the width and the section
// plus the load arrows and moment diagram set the height.
function fitWhole(margin) {
  return fitDist(span * 11.0, L * 1.08, margin || 1.12);
}

function applyCamera() {
  sph.phi = Math.max(0.02, Math.min(Math.PI - 0.02, sph.phi));
  sph.dist = Math.max(radius * 0.05, Math.min(radius * 40, sph.dist));
  var sp = Math.sin(sph.phi);
  camera.position.set(
    target.x + sph.dist * sp * Math.sin(sph.theta),
    target.y + sph.dist * Math.cos(sph.phi),
    target.z + sph.dist * sp * Math.cos(sph.theta));
  camera.lookAt(target);
  persist();
}

function pan(dxPx, dyPx) {
  var hpx = stage.clientHeight || 1;
  var worldPerPx = 2 * sph.dist * Math.tan(FOV * Math.PI / 360) / hpx;
  var st = Math.sin(sph.theta), ct = Math.cos(sph.theta);
  var sp = Math.sin(sph.phi), cp = Math.cos(sph.phi);
  var rx = ct, ry = 0, rz = -st;
  var ux = -st * cp, uy = sp, uz = -ct * cp;
  target.x += (-dxPx * rx + dyPx * ux) * worldPerPx;
  target.y += (-dxPx * ry + dyPx * uy) * worldPerPx;
  target.z += (-dxPx * rz + dyPx * uz) * worldPerPx;
  applyCamera();
}

applyCamera();

var ptrs = {}, last = null, pinch0 = null, mid0 = null;
canvas.addEventListener("pointerdown", function (e) {
  canvas.setPointerCapture(e.pointerId);
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  if (Object.keys(ptrs).length === 1) last = { x: e.clientX, y: e.clientY };
  spin = false;
});
canvas.addEventListener("pointermove", function (e) {
  if (!ptrs[e.pointerId]) return;
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  var ids = Object.keys(ptrs);

  if (ids.length === 1 && last) {
    var dx = e.clientX - last.x;
    var dy = e.clientY - last.y;
    if (panMode) {
      pan(dx, dy);
    } else {
      sph.theta -= dx * 0.009;
      sph.phi -= dy * 0.009;
      applyCamera();
    }
    last = { x: e.clientX, y: e.clientY };

  } else if (ids.length === 2) {
    var a = ptrs[ids[0]], b = ptrs[ids[1]];
    var d2 = Math.hypot(a.x - b.x, a.y - b.y);
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (pinch0 === null) { pinch0 = d2; mid0 = { x: mx, y: my }; }
    if (d2 > 0) { sph.dist *= pinch0 / d2; pinch0 = d2; }
    if (mid0) { pan(mx - mid0.x, my - mid0.y); mid0 = { x: mx, y: my }; }
    applyCamera();
  }
});
function up(e) {
  delete ptrs[e.pointerId];
  if (Object.keys(ptrs).length < 2) { pinch0 = null; mid0 = null; }
  if (Object.keys(ptrs).length === 0) last = null;
  var rest = Object.keys(ptrs);
  if (rest.length === 1) last = { x: ptrs[rest[0]].x, y: ptrs[rest[0]].y };
}
canvas.addEventListener("pointerup", up);
canvas.addEventListener("pointercancel", up);
canvas.addEventListener("wheel", function (e) {
  e.preventDefault();
  sph.dist *= (1 + (e.deltaY > 0 ? 0.12 : -0.12));
  applyCamera();
}, { passive: false });

function setView(th, ph, dist) {
  spin = false;
  target.set(0, 0, 0);
  sph.theta = th; sph.phi = ph; sph.dist = dist;
  applyCamera();
  sizeLabels(overlays, UNIT * (sph.dist / (radius * 2.6)));
}
document.getElementById("vIso").onclick = function () {
  setView(0.85, 1.15, fitWhole(1.22));
};
// looking straight at the web, the way a beam elevation is drawn
document.getElementById("vElev").onclick = function () {
  setView(1.5708, 1.5708, fitWhole(1.10));
};
// looking down on the top flange
document.getElementById("vPlan").onclick = function () {
  setView(1.5708, 0.05, fitWhole(1.10));
};
// looking along the span at the cross-section
document.getElementById("vEnd").onclick = function () {
  setView(0, 1.5708, fitDist(span * 3.2, span * 3.2, 1.25));
};
document.getElementById("vFit").onclick = function () {
  setView(sph.theta, sph.phi, fitWhole(1.16));
};
document.getElementById("vSpin").onclick = function () { spin = !spin; };
(function () {
  var pb = document.getElementById("vPan");
  pb.onclick = function () {
    panMode = !panMode;
    pb.classList.toggle("on", panMode);
    persist();
  };
})();

// =====================================================================
// toggles
// =====================================================================
function bindToggle(id, group, initial, after) {
  var b = document.getElementById(id);
  var on = (SAVED && SAVED.togg && typeof SAVED.togg[id] === "boolean")
    ? SAVED.togg[id] : !!initial;
  function apply() {
    TSTATE[id] = on;
    b.classList.toggle("on", on);
    if (group) group.visible = on;
    if (after) after(on);
    persist();
  }
  b.onclick = function () { on = !on; apply(); };
  apply();
  return function (want) { if (want !== on) { on = want; apply(); } };
}

(function () {
  var el = document.getElementById("props");
  var rows = DATA.props || [];
  if (!rows.length) { el.innerHTML = "<div class='g'>No data</div>"; return; }
  var cur = null, html = "";
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (r.group !== cur) {
      cur = r.group;
      html += "<div class='g'>" + cur + "</div>";
    }
    var u = r.unit ? (" " + r.unit) : "";
    html += "<div><span class='k'>" + r.symbol + "</span>"
         + "<span class='v'>" + r.value + u + "</span></div>";
  }
  el.innerHTML = html;
})();

bindToggle("tDim", gDim, false);
bindToggle("tSup", gSup, true);
bindToggle("tAx", gAx, false);
bindToggle("tLoad", gLoad, LOADT === "udl" || LOADT === "point");
bindToggle("tMom", gMom, false);
bindToggle("tBrace", gBrace, false);
bindToggle("tProps", null, false, function (on) {
  document.getElementById("props").style.display = on ? "block" : "none";
});
bindToggle("tLab", null, true, function (on) { setLabels(on); });

var setDefl = bindToggle("tDefl", null, false, function (on) {
  deflOn = on; applyShape(); paint(currentMode);
});
var setLTB = bindToggle("tLTB", null, false, function (on) {
  ltbOn = on; applyShape(); paint(currentMode);
});

// =====================================================================
// behaviour dropdown
// =====================================================================
var MODES = [
  ["plain", "Plain steel", "The member as fabricated. No result mapped."],
  ["class", "Table 2 section class",
   "Each plate element is coloured by the class its width-to-thickness "
   + "ratio earns in flexure. Class 1 green through Class 4 red. The "
   + "section class is the least compact of the two. The overlay shows "
   + "the Table 2 support conditions: each flange outstand is supported "
   + "along ONE edge, the web junction (green), and free at the tip "
   + "(dashed red), so its width is b_el = b/2. The web is supported "
   + "along BOTH edges by the flanges, which is why its limits are far "
   + "higher."],
  ["stress", "Bending stress through the depth",
   "Red is compression, blue is tension, grey is the neutral axis. A "
   + "Class 1 or 2 section reaches Fy over the full depth, so the block "
   + "is rectangular and Mr uses Zx. A Class 3 or 4 section stays "
   + "elastic, so the stress varies linearly and Mr uses Sx or Se. The "
   + "colour also follows the moment along the span, and flips over a "
   + "fixed end where the moment reverses."],
  ["moment", "Bending moment along the span",
   "Colour follows the moment diagram, so the peak moment region stands "
   + "out. The shape follows both the load pattern and the end "
   + "conditions, so a fixed end carries hogging moment and the "
   + "diagram crosses zero somewhere along the span."],
  ["ltb", "Lateral torsional buckling",
   "Only the compression flange is at risk of buckling sideways, so it "
   + "is picked out in red and the tension flange in blue. The shading "
   + "Near a fixed end the moment reverses, so it is the bottom "
   + "flange that needs bracing there. The shading peaks midway "
   + "between braces. Turn on LTB shape to see the movement."],
  ["util", "Utilisation Mf / Mr",
   "The whole member coloured by the demand to capacity ratio. Green is "
   + "lightly loaded, red is at or beyond the factored resistance."]
];

var sel = document.getElementById("mode");
for (var i = 0; i < MODES.length; i++) {
  var o = document.createElement("option");
  o.value = MODES[i][0]; o.textContent = MODES[i][1];
  sel.appendChild(o);
}
var currentMode = "plain";
function setMode(m) {
  var known = false;
  for (var i = 0; i < MODES.length; i++) {
    if (MODES[i][0] === m) known = true;
  }
  if (!known) m = "plain";
  currentMode = m;
  sel.value = m;
  paint(m);
  // the Table 2 condition overlay only makes sense in class mode
  gClassCond.visible = (m === "class");
  for (var i2 = 0; i2 < MODES.length; i2++) {
    if (MODES[i2][0] === m) {
      document.getElementById("expl").textContent = MODES[i2][2];
    }
  }
  if (m === "ltb") { setLTB(true); }
  persist();
}
sel.onchange = function () { setMode(sel.value); };
setMode(SAVED && SAVED.mode ? SAVED.mode : "plain");

// =====================================================================
// hud
// =====================================================================
(function () {
  var h = "<b>" + (DATA.label || "") + "</b><br>";
  h += (DATA.family_label || "") + "<br>";
  h += "L = " + (L / 1000).toFixed(2) + " m";
  var ENDTXT = { pin_pin: "pinned - pinned",
                 fix_pin: "fixed - pinned",
                 fix_fix: "fixed - fixed",
                 fix_free: "fixed - free" };
  h += "<br>" + (ENDTXT[ENDS] || ENDS);
  if (LB > 0 && LB < L - 1e-6) h += "   Lb = " + (LB / 1000).toFixed(2) + " m";
  if (RES.section_class) h += "<br>Class " + RES.section_class;
  if (RES.Mr_kNm !== undefined && RES.Mr_kNm !== null) {
    h += "<br>Mr = " + Number(RES.Mr_kNm).toFixed(1) + " kN-m";
  }
  if (RES.Mf_kNm !== undefined && RES.Mf_kNm !== null) {
    h += "<br>Mf = " + Number(RES.Mf_kNm).toFixed(1) + " kN-m";
  }
  if (RES.util !== undefined && RES.util !== null) {
    h += "<br>Mf / Mr = " + (100 * RES.util).toFixed(0) + "%";
  }
  if (RES.governs) h += "<br>Governed by " + RES.governs;
  document.getElementById("hud").innerHTML = h;
})();

// =====================================================================
// resize and loop
// =====================================================================
function resize() {
  var w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  sizeLabels(overlays, UNIT * (sph.dist / (radius * 2.6)));
}
window.addEventListener("resize", resize);
resize();
sph.dist = fitWhole(1.22);
applyCamera();

// restore the camera the user last had, scaled to the current model size
if (SAVED && SAVED.cam && isFinite(SAVED.cam.distR)) {
  sph.theta = SAVED.cam.theta;
  sph.phi = SAVED.cam.phi;
  sph.dist = Math.max(radius * 0.05,
                      Math.min(radius * 40, SAVED.cam.distR * radius));
  target.set((SAVED.cam.tx || 0) * L, (SAVED.cam.ty || 0) * L,
             (SAVED.cam.tz || 0) * L);
  panMode = !!SAVED.cam.pan;
  document.getElementById("vPan").classList.toggle("on", panMode);
  applyCamera();
}
sizeLabels(overlays, UNIT * (sph.dist / (radius * 2.6)));

var lastDist = sph.dist;
function loop() {
  requestAnimationFrame(loop);
  if (spin) { sph.theta += 0.004; applyCamera(); }
  if (Math.abs(sph.dist - lastDist) > radius * 0.01) {
    lastDist = sph.dist;
    sizeLabels(overlays, UNIT * (sph.dist / (radius * 2.6)));
  }
  renderer.render(scene, camera);
}
loop();

} catch (err) {
  fail("Viewer error: " + err.message);
}
</script>
</body>
</html>
