<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#0d1117;
    font-family:-apple-system, "Segoe UI", Roboto, sans-serif; color:#e6edf3; }
  #root { display:flex; flex-direction:column; height:100vh; }
  #stage { position:relative; flex:1 1 auto; min-height:0; touch-action:none; }
  #cv { display:block; width:100%; height:100%; }
  #hud { position:absolute; left:10px; top:8px; font-size:11px; line-height:1.45;
    color:#8b949e; pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.9); }
  #hud b { color:#e6edf3; font-size:12px; }
  #legend { position:absolute; right:10px; top:8px; font-size:10.5px;
    line-height:1.5; color:#c9d1d9; pointer-events:none; text-align:right;
    text-shadow:0 1px 3px rgba(0,0,0,.9); }
  .sw { display:inline-block; width:9px; height:9px; border-radius:2px;
    margin-left:5px; vertical-align:middle; }
  #err { position:absolute; left:10px; bottom:8px; color:#f85149; font-size:11px; }
  #props { position:absolute; right:8px; bottom:8px; max-height:62%;
    overflow:auto; background:rgba(13,17,23,.82); border:1px solid #30363d;
    border-radius:8px; padding:8px 10px; font-size:10.5px; line-height:1.5;
    color:#c9d1d9; display:none; max-width:62%; }
  #props .g { color:#6e7681; text-transform:uppercase; letter-spacing:.05em;
    font-size:9px; margin-top:6px; }
  #props .g:first-child { margin-top:0; }
  #props .k { color:#8b949e; display:inline-block; min-width:66px; }
  #props .v { color:#e6edf3; }
  #bar { flex:0 0 auto; background:#161b22; border-top:1px solid #30363d;
    padding:6px 8px; }
  .row { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  .row + .row { margin-top:5px; }
  button.t { background:#21262d; color:#8b949e; border:1px solid #30363d;
    border-radius:6px; padding:5px 9px; font-size:11px; cursor:pointer;
    white-space:nowrap; }
  button.t.on { background:#1f6feb; color:#fff; border-color:#1f6feb; }
  button.t:disabled { opacity:0.4; cursor:not-allowed; }
  button.v { background:#21262d; color:#c9d1d9; border:1px solid #30363d;
    border-radius:6px; padding:5px 9px; font-size:11px; cursor:pointer; }
  button.v:active { background:#1f6feb; color:#fff; }
  button.t:focus-visible, button.v:focus-visible, select:focus-visible {
    outline:2px solid #58a6ff; outline-offset:1px; }
  select { background:#21262d; color:#e6edf3; border:1px solid #30363d;
    border-radius:6px; padding:5px 7px; font-size:11px; flex:1 1 200px;
    min-width:150px; }
  #pickWrap { display:none; }
  .lbl { font-size:10px; color:#6e7681; text-transform:uppercase;
    letter-spacing:.05em; margin-right:2px; }
  #expl { font-size:11px; color:#8b949e; line-height:1.45; margin-top:6px;
    padding-top:6px; border-top:1px solid #21262d; }
  #expl .chk { color:#7ee787; }
  #expl .bad { color:#f0883e; }
</style>
</head>
<body>
<div id="root">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="legend"></div>
    <div id="props"></div>
    <div id="err"></div>
  </div>
  <div id="bar">
    <div class="row">
      <span class="lbl">View</span>
      <button class="v" id="vIso">Iso</button>
      <button class="v" id="vPlan">Plan</button>
      <button class="v" id="vSide">Side</button>
      <button class="v" id="vEnd">Section</button>
      <button class="v" id="vFit">Fit</button>
      <button class="t" id="vPan">Pan mode</button>
      <button class="v" id="vSpin">Spin</button>
    </div>
    <div class="row">
      <span class="lbl">Effects</span>
      <button class="t" id="tXray">X-ray steel</button>
      <button class="t" id="tTear">Tear out</button>
      <button class="t" id="tStretch">Elongation</button>
      <button class="t" id="tGhost">Undeformed ghost</button>
    </div>
    <div class="row">
      <span class="lbl">Show</span>
      <button class="t" id="tDim">Dimensions</button>
      <button class="t" id="tBolt">Bolts</button>
      <button class="t" id="tGus">Gusset</button>
      <button class="t" id="tLab">Labels</button>
      <button class="t" id="tLoad">Load</button>
      <button class="t" id="tProps">Design data</button>
      <button class="t" id="tAx">Axes</button>
    </div>
    <div class="row">
      <span class="lbl">Limit state</span>
      <select id="mode"></select>
    </div>
    <div class="row" id="pickWrap">
      <span class="lbl">Path</span>
      <select id="pick"></select>
    </div>
    <div id="expl"></div>
  </div>
</div>

<script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
<script>
var DATA = __GEOMETRY_JSON__;

function fail(m) { document.getElementById("err").textContent = m; }

try {

var SEC = DATA.sec || {};
var BOLT = DATA.bolt || {};
var NET = DATA.net || [];
var BLK = DATA.block || [];
var RES = DATA.res || {};

var C_STEEL = 0x8b949e;
var C_OK    = 0x3fb950;
var C_WARN  = 0xd29922;
var C_BAD   = 0xf85149;
var C_BLUE  = 0x58a6ff;
var C_ORNG  = 0xf0883e;
var C_DIM   = 0x6e7681;

var stage = document.getElementById("stage");
var canvas = document.getElementById("cv");

var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

var scene = new THREE.Scene();
scene.background = new THREE.Color(DATA.bg || "#0d1117");

function makeEnv() {
  var c = document.createElement("canvas");
  c.width = 16; c.height = 256;
  var g = c.getContext("2d");
  var grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0.00, "#ffffff");
  grad.addColorStop(0.35, "#c8d2dc");
  grad.addColorStop(0.55, "#7d8894");
  grad.addColorStop(0.75, "#3a424b");
  grad.addColorStop(1.00, "#14181d");
  g.fillStyle = grad; g.fillRect(0, 0, 16, 256);
  var tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  var p = new THREE.PMREMGenerator(renderer);
  p.compileEquirectangularShader();
  var env = p.fromEquirectangular(tex).texture;
  p.dispose(); tex.dispose();
  return env;
}
scene.environment = makeEnv();

var kl = new THREE.DirectionalLight(0xffffff, 1.35);
kl.position.set(1, 1.4, 1); scene.add(kl);
var fl = new THREE.DirectionalLight(0xffffff, 0.45);
fl.position.set(-1, 0.3, -0.8); scene.add(fl);
scene.add(new THREE.AmbientLight(0xffffff, 0.32));

// =====================================================================
// labels
// =====================================================================
function labelSprite(text, color, scale) {
  color = color || "#e6edf3"; scale = scale || 1.0;
  var pad = 8, fs = 44;
  var c = document.createElement("canvas");
  var g = c.getContext("2d");
  g.font = "600 " + fs + "px -apple-system, Segoe UI, Roboto, sans-serif";
  var wpx = Math.ceil(g.measureText(text).width) + pad * 2;
  c.width = wpx; c.height = fs + pad * 2;
  g = c.getContext("2d");
  g.font = "600 " + fs + "px -apple-system, Segoe UI, Roboto, sans-serif";
  g.fillStyle = "rgba(13,17,23,0.78)";
  g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = color; g.textBaseline = "middle";
  g.fillText(text, pad, c.height / 2);
  var tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false }));
  sp.userData.aspect = c.width / c.height;
  sp.userData.baseScale = scale;
  sp.renderOrder = 30;
  return sp;
}
var LABELS = [], labelsOn = true;
function addLabel(grp, text, pos, color, scale) {
  var sp = labelSprite(text, color, scale);
  sp.position.set(pos[0], pos[1], pos[2]);
  grp.add(sp); LABELS.push(sp); sp.visible = labelsOn;
  return sp;
}
function setLabels(on) {
  labelsOn = on;
  for (var i = 0; i < LABELS.length; i++) LABELS[i].visible = on;
}
function sizeLabels(root, unit) {
  root.traverse(function (o) {
    if (o.isSprite && o.userData.aspect) {
      var h = unit * o.userData.baseScale;
      o.scale.set(h * o.userData.aspect, h, 1);
    }
  });
}
function addLine(grp, a, b, color) {
  var g = new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(a[0], a[1], a[2]), new THREE.Vector3(b[0], b[1], b[2])]);
  grp.add(new THREE.Line(g, new THREE.LineBasicMaterial({
    color: color, depthTest: false })));
}

// overlay line, always drawn on top of the steel
function overLine(grp, a, b, color, order) {
  var g = new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(a[0], a[1], a[2]), new THREE.Vector3(b[0], b[1], b[2])]);
  var m = new THREE.Line(g, new THREE.LineBasicMaterial({
    color: color, depthTest: false, transparent: true, opacity: 0.95 }));
  m.renderOrder = (order === undefined ? 20 : order);
  grp.add(m);
  return m;
}

// =====================================================================
// bolt grid geometry
//   x  across the connected width, x = 0 is the free edge
//   y  through the thickness
//   z  along the member, z = 0 is the cut end, load pulls towards +z
// =====================================================================
var W  = SEC.w_conn || 140;
var T  = SEC.t_conn || 10;
var NL = Math.max(1, Math.round(BOLT.n_lines || 1));
var NR = Math.max(1, Math.round(BOLT.bolts_per_line || 2));
var S  = BOLT.pitch || 80;
var G  = BOLT.gauge || 60;
var E1 = BOLT.edge_end || 40;
var E2 = BOLT.edge_trans || 30;
var DH = BOLT.hole_dia || 22;
var DE = BOLT.d_eff || DH;

var xs = [], zs = [];
for (var j = 0; j < NL; j++) xs.push(E2 + j * G);
for (var i = 0; i < NR; i++) zs.push(E1 + i * S);

var LV = E1 + (NR - 1) * S;             // block shear plane length
var TAIL = Math.max(2.2 * S, 0.9 * W, 120);
var L = LV + TAIL;                       // drawn member length

var SCALE = Math.max(L, W * 1.6, 200);
var UNIT = SCALE * 0.040;

// Failure surfaces are swept just proud of both faces and drawn with
// depth testing off. Without this they sit inside the solid member and
// the steel wins the depth test, which is why they never appeared.
var EPS = Math.max(T * 0.10, 0.4);
var YB = -EPS, YT = T + EPS;

// =====================================================================
// groups
// =====================================================================
var gMember = new THREE.Group();
var gBolt = new THREE.Group();
var gGus = new THREE.Group();
var gGhost = new THREE.Group();
var gDim = new THREE.Group();
var gLoad = new THREE.Group();
var gAx = new THREE.Group();
var gFail = new THREE.Group();       // all failure overlays
var gBlockMove = new THREE.Group();  // the block that tears out
scene.add(gMember); scene.add(gBolt); scene.add(gGus); scene.add(gGhost);
scene.add(gDim); scene.add(gLoad); scene.add(gAx); scene.add(gFail);
scene.add(gBlockMove);

function steelMat(col, op) {
  return new THREE.MeshStandardMaterial({
    color: col, metalness: 0.80, roughness: 0.36, side: THREE.DoubleSide,
    transparent: true, opacity: (op === undefined ? 1 : op) });
}
var ghostMat = new THREE.MeshBasicMaterial({
  color: 0x30363d, wireframe: true, transparent: true, opacity: 0.35 });

// plan outline of the connected element, with every bolt hole cut out
function connectedShape() {
  var shp = new THREE.Shape();
  shp.moveTo(0, 0); shp.lineTo(W, 0); shp.lineTo(W, L); shp.lineTo(0, L);
  shp.closePath();
  for (var j = 0; j < NL; j++) {
    for (var i = 0; i < NR; i++) {
      var p = new THREE.Path();
      p.absarc(xs[j], zs[i], DH / 2, 0, Math.PI * 2, true);
      shp.holes.push(p);
    }
  }
  return shp;
}

var memberMeshes = [];
(function () {
  var g = new THREE.ExtrudeGeometry(connectedShape(), {
    depth: T, bevelEnabled: false, curveSegments: 18, steps: 1 });
  g.rotateX(Math.PI / 2);
  g.translate(0, T, 0);
  g.computeVertexNormals();
  var m = new THREE.Mesh(g, steelMat(C_STEEL));
  gMember.add(m); memberMeshes.push(m);
  gGhost.add(new THREE.Mesh(g.clone(), ghostMat));
})();

// outstanding elements, so the section reads as the shape it is
function slab(grp, x0, x1, y0, y1, z0, z1, col) {
  var g = new THREE.BoxGeometry(Math.abs(x1 - x0), Math.abs(y1 - y0),
                                Math.abs(z1 - z0));
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  var m = new THREE.Mesh(g, steelMat(col));
  grp.add(m); memberMeshes.push(m);
  gGhost.add(new THREE.Mesh(g.clone(), ghostMat));
  return m;
}

var KIND = DATA.kind || "plate";
var legOut = SEC.leg_out || 0;
(function () {
  if (KIND === "angle" || KIND === "double_angle") {
    if (legOut > 0) slab(gMember, W - T, W, T, T + legOut, 0, L, C_STEEL);
  } else if (KIND === "wt") {
    if (SEC.connected === "flange") {
      var ts = SEC.t_stem || T;
      var dd = SEC.d_depth || 0;
      if (dd > 0) slab(gMember, W / 2 - ts / 2, W / 2 + ts / 2,
                       T, T + (dd - T), 0, L, C_STEEL);
    } else {
      var tf = SEC.t_flange || T;
      var bf = SEC.b_flange || 0;
      if (bf > 0) {
        slab(gMember, W, W + tf, -(bf - T) / 2, T + (bf - T) / 2, 0, L,
             C_STEEL);
      }
    }
  } else if (KIND === "channel") {
    var tfc = SEC.t_flange || T;
    var bfc = SEC.b_flange || 0;
    if (bfc > 0) {
      slab(gMember, 0, bfc, T, T + tfc, 0, L, C_STEEL);
      slab(gMember, W - bfc, W, T, T + tfc, 0, L, C_STEEL);
    }
  }
})();

// second angle of a back to back pair, plus the gusset between them
(function () {
  var gt = SEC.gusset_t || 0;
  if (KIND === "double_angle") {
    var off = -(T + gt);
    var g = new THREE.ExtrudeGeometry(connectedShape(), {
      depth: T, bevelEnabled: false, curveSegments: 18, steps: 1 });
    g.rotateX(Math.PI / 2);
    g.translate(0, off + T, 0);
    g.computeVertexNormals();
    var m = new THREE.Mesh(g, steelMat(C_STEEL));
    gMember.add(m); memberMeshes.push(m);
    if (legOut > 0) slab(gMember, W - T, W, off - legOut, off, 0, L, C_STEEL);
  }
  if (gt > 0) {
    var z0 = (KIND === "double_angle") ? -TAIL * 0.35 : 0;
    var gm = new THREE.BoxGeometry(W * 1.15, gt, LV + TAIL * 0.5);
    gm.translate(W / 2, -gt / 2, (LV + TAIL * 0.5) / 2 + z0 - TAIL * 0.15);
    gGus.add(new THREE.Mesh(gm, steelMat(0x6e7681, 0.55)));
  }
})();
gGus.visible = false;
gGhost.visible = false;

// bolts through every hole
(function () {
  var bd = BOLT.bolt_dia || (DH - 2);
  for (var j = 0; j < NL; j++) {
    for (var i = 0; i < NR; i++) {
      var shaftLen = T * 2.6 + (SEC.gusset_t || 0);
      var g = new THREE.CylinderGeometry(bd / 2, bd / 2, shaftLen, 20);
      g.translate(xs[j], T / 2, zs[i]);
      gBolt.add(new THREE.Mesh(g, steelMat(0x484f58)));
      var hg = new THREE.CylinderGeometry(bd * 0.8, bd * 0.8, bd * 0.55, 6);
      hg.translate(xs[j], T + bd * 0.45, zs[i]);
      gBolt.add(new THREE.Mesh(hg, steelMat(0x30363d)));
    }
  }
})();

// =====================================================================
// dimensions
// =====================================================================
// =====================================================================
// dimensions
//
// These are member sizes only - the things you would find on a shop
// drawing. Anything derived from a limit state (Lv, wnt, An) belongs
// to that limit state's overlay, not here, so switching to "As
// detailed" leaves a clean dimensioned member.
//
// Each one is a proper dimension: extension lines, a dimension line
// with arrowheads, and the measurement sitting on the line.
// =====================================================================
var DIM_SCALE = 0.95;
var DIM_C = 0xc9d1d9;

// arrowhead at p pointing along (ux, uy, uz)
function dimArrow(grp, p, u, col) {
  var h = UNIT * 0.16;
  // build two barbs in whichever plane the arrow is not running along
  var n1, n2;
  if (Math.abs(u[1]) < 0.9) { n1 = [0, 1, 0]; }
  else { n1 = [1, 0, 0]; }
  n2 = [u[1] * n1[2] - u[2] * n1[1],
        u[2] * n1[0] - u[0] * n1[2],
        u[0] * n1[1] - u[1] * n1[0]];
  var L2 = Math.sqrt(n2[0] * n2[0] + n2[1] * n2[1] + n2[2] * n2[2]) || 1;
  n2 = [n2[0] / L2, n2[1] / L2, n2[2] / L2];
  for (var s = -1; s <= 1; s += 2) {
    addLine(grp, p, [p[0] - u[0] * h + n2[0] * h * 0.42 * s,
                     p[1] - u[1] * h + n2[1] * h * 0.42 * s,
                     p[2] - u[2] * h + n2[2] * h * 0.42 * s], col);
  }
}

// full dimension between two points, offset clear of the steel
function dimension(grp, a, b, off, text, hex, col) {
  col = (col === undefined) ? DIM_C : col;
  var A = [a[0] + off[0], a[1] + off[1], a[2] + off[2]];
  var B = [b[0] + off[0], b[1] + off[1], b[2] + off[2]];
  // extension lines back to the feature
  addLine(grp, a, A, col);
  addLine(grp, b, B, col);
  // dimension line
  addLine(grp, A, B, col);
  var d = [B[0] - A[0], B[1] - A[1], B[2] - A[2]];
  var len = Math.sqrt(d[0] * d[0] + d[1] * d[1] + d[2] * d[2]) || 1;
  var u = [d[0] / len, d[1] / len, d[2] / len];
  dimArrow(grp, A, [-u[0], -u[1], -u[2]], col);
  dimArrow(grp, B, u, col);
  // measurement sits on the line, nudged clear along the offset
  var m = Math.sqrt(off[0] * off[0] + off[1] * off[1] + off[2] * off[2]) || 1;
  var ou = [off[0] / m, off[1] / m, off[2] / m];
  var t = UNIT * 0.34;
  addLabel(grp, text,
           [(A[0] + B[0]) / 2 + ou[0] * t,
            (A[1] + B[1]) / 2 + ou[1] * t,
            (A[2] + B[2]) / 2 + ou[2] * t], hex || "#c9d1d9", DIM_SCALE);
}

// ---- bolt layout, dimensioned on the plan ----
(function () {
  var yT = T + UNIT * 0.05;

  // gauge and transverse edge, on the first bolt row, running clear of
  // the member towards the cut end
  var zG = -UNIT * 0.55;
  dimension(gDim, [0, yT, 0], [xs[0], yT, 0], [0, 0, zG],
            "e2 = " + E2.toFixed(0), "#7ee787", 0x7ee787);
  if (NL >= 2) {
    dimension(gDim, [xs[0], yT, 0], [xs[1], yT, 0], [0, 0, zG - UNIT * 0.55],
              "g = " + G.toFixed(0), "#7ee787", 0x7ee787);
  }

  // end distance and pitch, down the left hand side
  var xP = -UNIT * 0.55;
  dimension(gDim, [0, yT, 0], [0, yT, zs[0]], [xP, 0, 0],
            "e1 = " + E1.toFixed(0), "#79c0ff", 0x79c0ff);
  if (NR >= 2) {
    dimension(gDim, [0, yT, zs[0]], [0, yT, zs[1]], [xP - UNIT * 0.55, 0, 0],
              "s = " + S.toFixed(0), "#79c0ff", 0x79c0ff);
  }

  // overall connected width, out past the tail
  var zW = L - TAIL * 0.30;
  dimension(gDim, [0, yT, zW], [W, yT, zW], [0, UNIT * 0.75, 0],
            "w = " + W.toFixed(1), "#c9d1d9", DIM_C);

  // hole size, called off the first hole with a leader
  var lx = xs[0] + DH * 0.75, lz = zs[0] - DH * 0.75;
  addLine(gDim, [xs[0], yT, zs[0]],
                [lx + UNIT * 0.30, yT, lz - UNIT * 0.30], 0xd29922);
  addLabel(gDim, "hole " + DH.toFixed(1) + " dia" +
           (Math.abs(DE - DH) > 0.05
            ? "  (d_eff " + DE.toFixed(1) + ")" : ""),
           [lx + UNIT * 0.70, yT, lz - UNIT * 0.45], "#d29922", DIM_SCALE);
})();

// ---- cross section, dimensioned on the cut end ----
(function () {
  var zC = -Math.max(TAIL * 0.16, DH * 1.6);
  var bf = SEC.b_flange || 0, tf = SEC.t_flange || 0;
  var dd = SEC.d_depth || 0, tst = SEC.t_stem || 0;
  var ox = -UNIT * 0.55;

  // thickness of the connected element, on every section type
  dimension(gDim, [0, 0, zC], [0, T, zC], [ox, 0, 0],
            "t = " + T.toFixed(1), "#d29922", 0xd29922);

  if (KIND === "angle" || KIND === "double_angle") {
    dimension(gDim, [0, T, zC], [W, T, zC], [0, UNIT * 0.55, 0],
              "leg " + W.toFixed(0), "#a371f7", 0xa371f7);
    if (legOut > 0) {
      dimension(gDim, [W, T, zC], [W, T + legOut, zC], [UNIT * 0.55, 0, 0],
                "leg " + legOut.toFixed(0), "#a371f7", 0xa371f7);
    }
    if (KIND === "double_angle" && SEC.gusset_t > 0) {

    if (bf > 0) {

  } else if (KIND === "channel") {

    }
    if (tf > 0) {

  } else {

})();
gDim.visible = false;

// ---- dimensions that belong to a limit state, not to the member ----
var gDimLv = new THREE.Group(); gFail.add(gDimLv);
(function () {

gDimLv.visible = false;

// =====================================================================
// load

(function () {

  var len = SCALE * 0.30;

(function () {

              [[0, a, 0], 0x7ee787, "y  thickness"],

// =====================================================================
// overlay primitives
//
// A rupture surface is a vertical sheet through the thickness, so it is
// built from a plan-view polyline and swept from y = -EPS to y = T+EPS.
// =====================================================================

// vertical sheet between two plan points
function sheet(grp, ax, az, bx, bz, col, op, order) {
  var g = new THREE.BufferGeometry();
  var v = new Float32Array([
    ax, YB, az,  bx, YB, bz,  bx, YT, bz,
    ax, YB, az,  bx, YT, bz,  ax, YT, az]);
  g.setAttribute("position", new THREE.BufferAttribute(v, 3));
  g.computeVertexNormals();
  var m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    color: col, transparent: true, opacity: (op === undefined ? 0.6 : op),
    side: THREE.DoubleSide, depthTest: false, depthWrite: false }));
  m.renderOrder = (order === undefined ? 10 : order);
  grp.add(m);
  overLine(grp, [ax, YT, az], [bx, YT, bz], col, (order || 10) + 1);
  overLine(grp, [ax, YB, az], [bx, YB, bz], col, (order || 10) + 1);
  return m;
}

// ring marking a hole that a path actually deducts
function holeRing(grp, x, z, col, order) {
  var w = Math.max(DH * 0.14, 1.6);
  var g = new THREE.RingGeometry(DH / 2, DH / 2 + w, 26);
  g.rotateX(-Math.PI / 2);
  var mat = new THREE.MeshBasicMaterial({
    color: col, transparent: true, opacity: 0.95, side: THREE.DoubleSide,
    depthTest: false, depthWrite: false });
  var m = new THREE.Mesh(g, mat);
  m.position.set(x, YT + EPS * 0.5, z);
  m.renderOrder = (order === undefined ? 14 : order);
  grp.add(m);
  var m2 = new THREE.Mesh(g, mat);
  m2.position.set(x, YB - EPS * 0.5, z);
  m2.renderOrder = m.renderOrder;
  grp.add(m2);
  return m;
}

// arrow in plan showing which way a surface slides
function slideArrow(grp, x, z0, z1, col, order) {
  overLine(grp, [x, YT, z0], [x, YT, z1], col, order);
  var dir = (z1 > z0) ? 1 : -1;
  var h = Math.max(Math.abs(z1 - z0) * 0.12, DH * 0.4);
  overLine(grp, [x, YT, z1], [x + h * 0.5, YT, z1 - dir * h], col, order);
  overLine(grp, [x, YT, z1], [x - h * 0.5, YT, z1 - dir * h], col, order);
}

// trim a plan segment back by the hole radius at either end
function trimSeg(a, b, rA, rB) {
  var dx = b[0] - a[0], dz = b[1] - a[1];
  var len = Math.sqrt(dx * dx + dz * dz);
  if (len < 1e-6) return null;
  var ux = dx / len, uz = dz / len;
  var t0 = rA, t1 = len - rB;
  if (t1 - t0 < 1e-6) return null;
  return [[a[0] + ux * t0, a[1] + uz * t0],
          [a[0] + ux * t1, a[1] + uz * t1]];
}

// =====================================================================
// gross section yielding
// =====================================================================
var gGross = new THREE.Group(); gFail.add(gGross);
(function () {
  var z0 = LV + Math.max(S * 0.6, DH * 1.5);
  var z1 = L;
  if (z1 - z0 < S * 0.4) z0 = LV + (z1 - LV) * 0.25;

  sheet(gGross, 0, z0, W, z0, C_WARN, 0.55, 8);
  sheet(gGross, 0, z1 - 1, W, z1 - 1, C_WARN, 0.55, 8);
  overLine(gGross, [0, YT, z0], [0, YT, z1 - 1], C_WARN, 9);
  overLine(gGross, [W, YT, z0], [W, YT, z1 - 1], C_WARN, 9);
  slideArrow(gGross, W * 0.5, (z0 + z1) / 2, z1 - 1, C_WARN, 9);

  addLabel(gGross, "gross section Ag = "
           + Number(RES.Ag || 0).toFixed(0) + " mm2, no holes on this cut",
           [W / 2, T + UNIT * 0.75, (z0 + z1) / 2], "#d29922", 1.0);
  addLabel(gGross, "yields over the full length, member simply gets longer",
           [W / 2, T + UNIT * 0.45, (z0 + z1) / 2 - S * 0.35], "#8b949e",
           0.85);
})();

// =====================================================================
// net section fracture, one distinct surface per candidate path
//
// A path with n_holes = k tears through the first k hole lines. If k is
// less than the number of lines it has to dodge the rest, which is why
// a three hole path and a two hole path are not the same surface. A
// zig-zag steps one pitch at every stagger. Only net material is drawn,
// so the shaded sheet is An itself.
// =====================================================================
var netGroups = [], netDetails = [], netInfo = [];
var blockDetails = [];
var DODGE = (NR >= 2) ? S * 0.5 : Math.max(DH * 1.3, E1 * 0.6);

// A label like "Zig-zag: L1/R1 - L2/R3" names the exact hole taken on
// every bolt line. That is the only thing separating three zig-zags
// that all take two holes, so it is read straight off the description.
// If the label carries no L#/R# tokens, fall back to n_holes with the
// old alternating-row guess.
function parseNodes(desc) {
  var re = /L\s*(\d+)\s*\/\s*R\s*(\d+)/gi, raw = [], m;
  while ((m = re.exec(String(desc || ""))) !== null) {
    var li = parseInt(m[1], 10) - 1, ri = parseInt(m[2], 10) - 1;
    if (li < 0 || li > NL - 1 || ri < 0 || ri > NR - 1) continue;
    raw.push([li, ri]);
  }
  raw.sort(function (a, b) { return a[0] - b[0]; });
  var seen = {}, out = [];
  for (var i = 0; i < raw.length; i++) {
    if (seen[raw[i][0]]) continue;
    seen[raw[i][0]] = 1; out.push(raw[i]);
  }
  return out;
}

for (var ni = 0; ni < NET.length; ni++) {
  (function (n, idx) {
    var grp = new THREE.Group(); gFail.add(grp);
    var det = new THREE.Group(); grp.add(det);   // shown one-at-a-time only
    var nodes = parseNodes(n.desc);
    if (!nodes.length) {
      var zg = !!n.zig && NR >= 2;
      var k0 = Math.max(1, Math.min(NL, Math.round(n.n_holes || 1)));
      for (var j0 = 0; j0 < k0; j0++) nodes.push([j0, zg ? (j0 % 2) : 0]);
    }
    var k = nodes.length;
    var lastLine = nodes[k - 1][0], lastRow = nodes[k - 1][1];
    var zig = false;
    for (var zj = 1; zj < k; zj++) {
      if (nodes[zj][1] !== nodes[zj - 1][1]) zig = true;
    }

    var pts = [], onHole = [];
    pts.push([0, zs[nodes[0][1]]]); onHole.push(false);
    for (var j = 0; j < k; j++) {
      pts.push([xs[nodes[j][0]], zs[nodes[j][1]]]); onHole.push(true);
    }
    if (lastLine < NL - 1) {
      var zd = zs[lastRow] + DODGE;
      var xmid = (xs[lastLine] + xs[lastLine + 1]) / 2;
      pts.push([xmid, zd]); onHole.push(false);
      pts.push([W, zd]); onHole.push(false);
    } else {
      pts.push([W, zs[lastRow]]); onHole.push(false);
    }

    var col = n.governs ? C_BAD : C_ORNG;
    var op = n.governs ? 0.72 : 0.34;
    var order = n.governs ? 16 : 10;

    var drawn = 0;
    for (var m = 0; m + 1 < pts.length; m++) {
      var a = pts[m], b = pts[m + 1];
      var seg = trimSeg(a, b, onHole[m] ? DH / 2 : 0,
                              onHole[m + 1] ? DH / 2 : 0);
      if (!seg) continue;
      sheet(grp, seg[0][0], seg[0][1], seg[1][0], seg[1][1], col, op, order);
      drawn += Math.sqrt(Math.pow(seg[1][0] - seg[0][0], 2)
                       + Math.pow(seg[1][1] - seg[0][1], 2));
    }

    for (var q = 0; q < k; q++) {
      holeRing(grp, xs[nodes[q][0]], zs[nodes[q][1]], col, order + 4);
    }

    // short label always, the rest only when this path is on its own
    var mid = pts[Math.floor(pts.length / 2)];
    var yLab = T + UNIT * (0.60 + 0.34 * idx);
    addLabel(grp, (n.governs ? "GOVERNS  " : "") + (n.desc || "path")
             + "   Tr = " + Number(n.Tr || 0).toFixed(1) + " kN",
             [W * 0.5, yLab, mid[1]],
             n.governs ? "#f85149" : "#f0883e", 1.0);
    addLabel(det, "An = " + Number(n.An || 0).toFixed(0) + " mm2,  "
             + k + " hole(s) deducted",
             [W * 0.5, yLab - UNIT * 0.30, mid[1]], "#c9d1d9", 0.9);
    if (n.n_staggers > 0) {
      addLabel(det, n.n_staggers + " stagger(s), s2/4g adds back "
               + Number(n.stagger_term || 0).toFixed(1) + " mm of width",
               [W * 0.5, yLab - UNIT * 0.58, mid[1] - S * 0.45],
               "#8b949e", 0.85);
    }
    if (lastLine < NL - 1) {
      addLabel(det, "clears the remaining " + (NL - 1 - lastLine)
               + " hole line(s), so they are not deducted",
               [W * 0.82, yLab - UNIT * 0.30, zs[lastRow] + DODGE],
               "#8b949e", 0.85);
    }

    det.visible = false;
    grp.visible = false;
    netGroups.push(grp); netDetails.push(det);
    netInfo.push({ drawn_wn: drawn, k: k, zig: zig });
  })(NET[ni], ni);
}

// =====================================================================
// block shear, one distinct pattern per candidate
//
// The detector names its patterns however it likes - A / B / C on the
// built-in generator, NEAR-1 / FAR-2 on the geometry-driven one - so
// the key is not a reliable way to place the block. Instead every
// physically possible block is enumerated, its net tension width is
// measured with the hole gaps taken out, and the one that reproduces
// the reported wnt is the one drawn. The picture then agrees with the
// number in the expander by construction, whatever the detector calls
// the pattern.
// =====================================================================
var blockGroups = [], blockBodies = [], blockInfo = [];

// net tension width across [x0, x1] at the last bolt row, with a
// d_eff gap removed at every bolt line the span crosses
function netSpan(x0, x1) {
  var gaps = [];
  for (var j = 0; j < NL; j++) {
    var g0 = xs[j] - DE / 2, g1 = xs[j] + DE / 2;
    if (g1 <= x0 || g0 >= x1) continue;
    gaps.push([Math.max(g0, x0), Math.min(g1, x1)]);
  }
  gaps.sort(function (p, q) { return p[0] - q[0]; });
  var cur = x0, w = 0, segs = [];
  for (var i = 0; i < gaps.length; i++) {
    if (gaps[i][0] > cur) { segs.push([cur, gaps[i][0]]); w += gaps[i][0] - cur; }
    cur = Math.max(cur, gaps[i][1]);
  }
  if (cur < x1) { segs.push([cur, x1]); w += x1 - cur; }
  return { w: w, segs: segs };
}

// every block a bolt group of this shape can tear out
function blockCandidates() {
  var out = [];
  for (var j = 0; j < NL; j++) {
    out.push({ x0: 0, x1: xs[j], shear: [xs[j]],
               tag: "tension to the near edge, shear on line " + (j + 1) });
    out.push({ x0: xs[j], x1: W, shear: [xs[j]],
               tag: "tension to the far edge, shear on line " + (j + 1) });
  }
  for (var a = 0; a < NL - 1; a++) {
    for (var c = a + 1; c < NL; c++) {
      out.push({ x0: xs[a], x1: xs[c], shear: [xs[a], xs[c]],
                 tag: "tension between lines " + (a + 1) + " and " + (c + 1)
                      + ", shear on both" });
    }
  }
  return out;
}

function resolveBlock(b) {
  var planes = Math.max(1, Math.round(b.planes || 1));
  var wnt = Number(b.wnt || 0);
  var key = String(b.key || "");
  var wantNear = /near/i.test(key), wantFar = /far/i.test(key);
  var all = blockCandidates();

  var pool = [];
  for (var i = 0; i < all.length; i++) {
    if (all[i].shear.length === planes) pool.push(all[i]);
  }
  if (!pool.length) pool = all;

  var best = null, bestScore = Infinity;
  for (var k2 = 0; k2 < pool.length; k2++) {
    var c = pool[k2];
    var r = netSpan(c.x0, c.x1);
    // width is the real test; the key only breaks ties
    var score = Math.abs(r.w - wnt);
    if (wantNear && c.x0 !== 0) score += 0.05;
    if (wantFar && c.x1 !== W) score += 0.05;
    if (score < bestScore) {
      bestScore = score; best = c; best.calc = r;
    }
  }
  if (!best) {
    best = { x0: 0, x1: xs[NL - 1], shear: [xs[NL - 1]], tag: "default block" };
    best.calc = netSpan(best.x0, best.x1);
  }
  best.err = Math.abs(best.calc.w - wnt);
  return best;
}

for (var bi = 0; bi < BLK.length; bi++) {
  (function (b, idx) {
    var grp = new THREE.Group(); gFail.add(grp);
    var det = new THREE.Group(); grp.add(det);   // shown one-at-a-time only
    var body = new THREE.Group(); gBlockMove.add(body);

    var key = String(b.key || "?");
    var geo = resolveBlock(b);
    var bx0 = geo.x0, bx1 = geo.x1, shearX = geo.shear;
    var Lv = b.Lv || LV;
    var col = b.governs ? C_BAD : C_WARN;
    var order = b.governs ? 16 : 10;

    // shear planes, parallel to the load, gross over the full Lv
    for (var s = 0; s < shearX.length; s++) {
      sheet(grp, shearX[s], 0, shearX[s], Lv, C_BAD,
            b.governs ? 0.60 : 0.32, order);
      slideArrow(grp, shearX[s], Lv * 0.55, 0, C_BAD, order + 2);
      addLabel(det, "shear plane, Agv = Lv x t = " + Lv.toFixed(0)
               + " x " + T.toFixed(1) + " = "
               + (Lv * T).toFixed(0) + " mm2",
               [shearX[s], T + UNIT * (0.45 + 0.32 * s), Lv * 0.45],
               "#f85149", 0.9);
    }

    // tension plane at the last bolt row, hole gaps removed
    var segs = geo.calc.segs, drawnW = geo.calc.w;
    for (var q2 = 0; q2 < segs.length; q2++) {
      sheet(grp, segs[q2][0], Lv, segs[q2][1], Lv, C_BLUE,
            b.governs ? 0.68 : 0.34, order);
    }
    for (var q3 = 0; q3 < NL; q3++) {
      if (xs[q3] >= bx0 - DE && xs[q3] <= bx1 + DE) {
        holeRing(grp, xs[q3], Lv, C_BLUE, order + 4);
      }
    }
    slideArrow(grp, (bx0 + bx1) / 2, Lv, Lv - Math.max(S * 0.35, DH),
               C_BLUE, order + 2);

    addLabel(det, "tension plane, wnt = " + drawnW.toFixed(1)
             + " mm,  Ant = " + (drawnW * T).toFixed(0) + " mm2",
             [(bx0 + bx1) / 2, T + UNIT * 0.82, Lv], "#58a6ff", 0.95);
    addLabel(det, geo.tag,
             [(bx0 + bx1) / 2, T + UNIT * 0.55, Lv - Math.max(S * 0.5, DH)],
             "#8b949e", 0.85);

    // the block that is pushed out, with its own holes
    var shp = new THREE.Shape();
    shp.moveTo(bx0, 0); shp.lineTo(bx1, 0); shp.lineTo(bx1, Lv);
    shp.lineTo(bx0, Lv); shp.closePath();
    for (var hj = 0; hj < NL; hj++) {
      if (xs[hj] <= bx0 + DH * 0.55 || xs[hj] >= bx1 - DH * 0.55) continue;
      for (var hi = 0; hi < NR; hi++) {
        if (zs[hi] > Lv - DH * 0.55) continue;
        var hp = new THREE.Path();
        hp.absarc(xs[hj], zs[hi], DH / 2, 0, Math.PI * 2, true);
        shp.holes.push(hp);
      }
    }
    var bgeo = new THREE.ExtrudeGeometry(shp, {
      depth: T, bevelEnabled: false, curveSegments: 16, steps: 1 });
    bgeo.rotateX(Math.PI / 2);
    bgeo.translate(0, T, 0);
    bgeo.computeVertexNormals();
    var bm = new THREE.Mesh(bgeo, new THREE.MeshStandardMaterial({
      color: col, metalness: 0.6, roughness: 0.5,
      transparent: true, opacity: b.governs ? 0.75 : 0.40 }));
    body.add(bm);

    // short label rides with the block, so patterns stay legible when
    // they are all on screen together
    addLabel(body, (b.governs ? "GOVERNS  " : "") + key + "   "
             + shearX.length + " plane(s)   Tr = "
             + Number(b.Tr || 0).toFixed(1) + " kN",
             [(bx0 + bx1) / 2, T + UNIT * (0.38 + 0.32 * idx), Lv * 0.22],
             b.governs ? "#f85149" : "#d29922", 1.0);

    det.visible = false;
    grp.visible = false; body.visible = false;
    blockGroups.push(grp); blockBodies.push(body); blockDetails.push(det);
    blockInfo.push({ drawn_wnt: drawnW, planes: shearX.length, key: key,
                     tag: geo.tag, err: geo.err });
  })(BLK[bi], bi);
}

// =====================================================================
// fanning
//
// Candidates share geometry by nature: every net path leaves the same
// free edge, and patterns A, B and C all put their tension plane on the
// last bolt row. Shown all at once they land on top of each other and
// read as a single surface. In the "every" modes each candidate is
// nudged a few millimetres along the member so they can be told apart.
// The single-candidate modes are never fanned, so anything measured off
// the model there is in its true position.
// =====================================================================
var NET_FAN = Math.max(DH * 0.32, 3.0);
var BLK_FAN = Math.max(DH * 0.60, 6.0);

function fanGroups(groups, on, step) {
  var n = groups.length;
  for (var i = 0; i < n; i++) {
    groups[i].position.z = on ? (i - (n - 1) / 2) * step : 0;
  }
}
function clearFans() {
  fanGroups(netGroups, false, 0);
  fanGroups(blockGroups, false, 0);
  fanGroups(blockBodies, false, 0);
}

// =====================================================================
// effects
// =====================================================================
var tearOn = false, stretchOn = false, xrayOn = false;

function setXrayMats(on) {
  for (var i = 0; i < memberMeshes.length; i++) {
    memberMeshes[i].material.opacity = on ? 0.26 : 1.0;
    memberMeshes[i].material.depthWrite = !on;
    memberMeshes[i].material.needsUpdate = true;
  }
}

function applyEffects() {
  var d = tearOn ? -Math.max(S * 0.7, DH * 2.0, 22) : 0;
  gBlockMove.position.set(0, tearOn ? T * 0.35 : 0, d);
  var sc = stretchOn ? 1.0 + Math.min(Math.max(RES.util || 0.4, 0.2), 1.4)
                       * 0.045 : 1.0;
  // steel, bolts and overlays scale together so the holes, the bolts
  // and the failure surfaces stay registered to each other
  gMember.scale.set(1, 1, sc);
  gBolt.scale.set(1, 1, sc);
  gFail.scale.set(1, 1, sc);
}

// =====================================================================
// modes
// =====================================================================
var MODES = [
  ["plain", "As detailed",
   "The connected element with its real bolt holes. Turn on Dimensions to "
   + "see e1, e2, the pitch, the gauge, the hole size and Lv measured on "
   + "the steel itself."],
  ["gross", "Gross section yielding, Cl. 13.2 a) i)",
   "Tr = phi Ag Fy. This one has nothing to do with the holes. Away from "
   + "the connection the whole gross area yields and the member simply "
   + "gets longer, which is why it is a ductile limit state and carries "
   + "the higher resistance factor of 0.90."],
  ["net_all", "Net section fracture, every path",
   "Every candidate tear surface at once. Only the net material is drawn, "
   + "so the shaded sheet is An itself, and a ring marks each hole the "
   + "path deducts. Red is the path that governs, orange are the others."],
  ["net_one", "Net section fracture, one path",
   "One candidate at a time. Step through with the Path selector and "
   + "watch which holes get ringed and where the surface has to dodge "
   + "the lines it does not take."],
  ["block_all", "Block shear, every pattern",
   "Each pattern is a different guess at which lump of steel gets pushed "
   + "out of the member end. Red sheets are in shear along the load, the "
   + "blue sheet is in tension across it with the hole gaps removed, and "
   + "Cl. 13.11 adds the two together."],
  ["block_one", "Block shear, one pattern",
   "One pattern at a time. Tear out pushes the block clear of the member "
   + "so you can see every surface doing the work."],
  ["util", "Utilisation, governing limit state",
   "The member coloured by Tf over the governing Tr, with the governing "
   + "failure surface drawn on top."]
];

var sel = document.getElementById("mode");
for (var mi = 0; mi < MODES.length; mi++) {
  var o = document.createElement("option");
  o.value = MODES[mi][0]; o.textContent = MODES[mi][1];
  sel.appendChild(o);
}
var pick = document.getElementById("pick");
var pickWrap = document.getElementById("pickWrap");

function utilColour(u) {
  if (u === null || u === undefined || !isFinite(u)) {
    return new THREE.Color(C_STEEL);
  }
  if (u > 1.0) return new THREE.Color(C_BAD);
  var a = new THREE.Color(0x1f6f3f), b = new THREE.Color(C_OK);
  if (u <= 0.6) return a.lerp(b, u / 0.6);
  return new THREE.Color(C_OK).lerp(new THREE.Color(C_WARN), (u - 0.6) / 0.4);
}

function hideAllFail() {
  gGross.visible = false;
  gDimLv.visible = false;
  for (var i = 0; i < netGroups.length; i++) {
    netGroups[i].visible = false; netDetails[i].visible = false;
  }
  for (var k = 0; k < blockGroups.length; k++) {
    blockGroups[k].visible = false; blockBodies[k].visible = false;
    blockDetails[k].visible = false;
  }
}

function memberColour(c) {
  for (var i = 0; i < memberMeshes.length; i++) {
    memberMeshes[i].material.color.copy(c);
  }
}

function govIndex(list) {
  for (var i = 0; i < list.length; i++) if (list[i].governs) return i;
  return 0;
}

var currentMode = "plain";
function fillPicker(mode) {
  pick.innerHTML = "";
  var list = (mode === "net_one") ? NET : BLK;
  for (var i = 0; i < list.length; i++) {
    var o = document.createElement("option");
    o.value = String(i);
    if (mode === "net_one") {
      o.textContent = (list[i].governs ? "* " : "") + (list[i].desc || "path")
                    + "  -  Tr = " + Number(list[i].Tr || 0).toFixed(1)
                    + " kN";
    } else {
      o.textContent = (list[i].governs ? "* " : "") + "Pattern "
                    + (list[i].key || "?") + "  -  Tr = "
                    + Number(list[i].Tr || 0).toFixed(1) + " kN";
    }
    pick.appendChild(o);
  }
  pick.value = String(govIndex(list));
}

function pickNote() {
  var idx = parseInt(pick.value || "0", 10);
  if (currentMode === "net_one" && netInfo[idx]) {
    var n = NET[idx] || {};
    var wn = (n.wn === undefined || n.wn === null) ? null : Number(n.wn);
    var d = netInfo[idx].drawn_wn;
    var s = "Drawn net length along the surface = " + d.toFixed(1) + " mm.";
    if (wn !== null) {
      s += " Net width used in An: wn = " + wn.toFixed(1) + " mm.";
      if (netInfo[idx].zig) {
        s += "  <span class='bad'>The diagonal legs are longer than the "
           + "projected width, which is exactly what the s2/4g rule is "
           + "crediting back.</span>";
      } else {
        s += (Math.abs(d - wn) <= Math.max(1.0, wn * 0.06))
             ? "  <span class='chk'>Surface agrees with the area used.</span>"
             : "";
      }
    }
    return s;
  }
  if (currentMode === "block_one" && blockInfo[idx]) {
    var bi2 = blockInfo[idx];
    var rw = Number((BLK[idx] || {}).wnt || 0);
    var s2 = bi2.key + ": " + bi2.tag + ". Drawn tension width "
           + bi2.drawn_wnt.toFixed(1) + " mm against the reported wnt = "
           + rw.toFixed(1) + " mm.";
    s2 += (bi2.err <= Math.max(0.5, rw * 0.03))
          ? "  <span class='chk'>Block matches the pattern the check "
            + "used.</span>"
          : "  <span class='bad'>No candidate block reproduces this wnt, "
            + "so the closest one is drawn.</span>";
    return s2;
  }
  return "";
}

function writeExpl() {
  var base = "";
  for (var q = 0; q < MODES.length; q++) {
    if (MODES[q][0] === currentMode) base = MODES[q][2];
  }
  var extra = pickNote();
  document.getElementById("expl").innerHTML =
    base + (extra ? "<br><br>" + extra : "");
}

function showPicked() {
  var idx = parseInt(pick.value || "0", 10);
  if (currentMode === "net_one") {
    for (var i = 0; i < netGroups.length; i++) {
      netGroups[i].visible = (i === idx);
      netDetails[i].visible = (i === idx);
    }
  } else if (currentMode === "block_one") {
    for (var k = 0; k < blockGroups.length; k++) {
      blockGroups[k].visible = (k === idx);
      blockBodies[k].visible = (k === idx);
      blockDetails[k].visible = (k === idx);
    }
  }
  writeExpl();
}
pick.onchange = showPicked;

function buildLegend(m) {
  var h = "";
  function row(txt, col) {
    h += txt + "<span class='sw' style='background:" + col + "'></span><br>";
  }
  if (m === "gross") {
    row("gross area Ag in yield", "#d29922");
  } else if (m === "net_all" || m === "net_one") {
    row("governing tear surface", "#f85149");
    if (m === "net_all") row("other candidate paths", "#f0883e");
    row("ringed hole is deducted", "#f85149");
  } else if (m === "block_all" || m === "block_one") {
    row("shear plane Agv", "#f85149");
    row("tension plane Ant", "#58a6ff");
    row("block pushed out", "#d29922");
  } else if (m === "util") {
    row("reserve", "#3fb950");
    row("close to the limit", "#d29922");
    row("over, Tf > Tr", "#f85149");
  }
  document.getElementById("legend").innerHTML = h;
}

function setMode(m) {
  currentMode = m;
  hideAllFail();
  clearFans();
  memberColour(new THREE.Color(C_STEEL));
  pickWrap.style.display = "none";

  var wantXray = true;

  if (m === "gross") {
    gGross.visible = true;
    memberColour(new THREE.Color(0x7a5c1f));
    setStretch(true);
  } else if (m === "net_all") {
    for (var i = 0; i < netGroups.length; i++) netGroups[i].visible = true;
    fanGroups(netGroups, true, NET_FAN);
  } else if (m === "net_one") {
    pickWrap.style.display = "flex";
    fillPicker(m); showPicked();
  } else if (m === "block_all") {
    for (var k = 0; k < blockGroups.length; k++) {
      blockGroups[k].visible = true; blockBodies[k].visible = true;
    }
    fanGroups(blockGroups, true, BLK_FAN);
    fanGroups(blockBodies, true, BLK_FAN);
    gDimLv.visible = true;
  } else if (m === "block_one") {
    pickWrap.style.display = "flex";
    fillPicker(m); showPicked();
    gDimLv.visible = true;
    setTear(true);
  } else if (m === "util") {
    memberColour(utilColour(RES.util));
    var gn = String(RES.gov_name || "").toLowerCase();
    if (gn.indexOf("block") >= 0 && blockGroups.length) {
      var gb2 = govIndex(BLK);
      blockGroups[gb2].visible = true; blockBodies[gb2].visible = true;
    } else if (gn.indexOf("net") >= 0 && netGroups.length) {
      netGroups[govIndex(NET)].visible = true;
    } else {
      gGross.visible = true;
    }
  } else {
    wantXray = false;
  }

  if (m !== "gross") setStretch(false);
  if (m !== "block_one") setTear(false);
  setXray(wantXray);

  writeExpl();
  buildLegend(m);
  applyEffects();
}
sel.onchange = function () { setMode(sel.value); };

// =====================================================================
// camera
// =====================================================================
var FOV = 32;
var radius = SCALE * 0.75;
var camera = new THREE.PerspectiveCamera(FOV, 1, radius * 0.004, radius * 400);
var target = new THREE.Vector3(W / 2, T / 2, L * 0.42);
var sph = { theta: 0.75, phi: 1.05, dist: radius * 2.6 };
var spin = false, panMode = false;

function fitDist(objH, objW, mg) {
  var vt = Math.tan(FOV * Math.PI / 360);
  var asp = camera.aspect || 1;
  return Math.max((objH / 2) / vt, (objW / 2) / (asp * vt)) * (mg || 1.15);
}
function fitWhole(mg) { return fitDist(L * 1.05, W * 2.0, mg || 1.18); }
function fitConn(mg) {
  return fitDist(Math.max(LV * 2.2, W * 1.2), W * 1.6, mg || 1.2);
}
function applyCamera() {
  sph.phi = Math.max(0.02, Math.min(Math.PI - 0.02, sph.phi));
  sph.dist = Math.max(radius * 0.05, Math.min(radius * 40, sph.dist));
  var sp = Math.sin(sph.phi);
  camera.position.set(
    target.x + sph.dist * sp * Math.sin(sph.theta),
    target.y + sph.dist * Math.cos(sph.phi),
    target.z + sph.dist * sp * Math.cos(sph.theta));
  camera.lookAt(target);
}
function pan(dxPx, dyPx) {
  var hpx = stage.clientHeight || 1;
  var wpp = 2 * sph.dist * Math.tan(FOV * Math.PI / 360) / hpx;
  var st = Math.sin(sph.theta), ct = Math.cos(sph.theta);
  var sp = Math.sin(sph.phi), cp = Math.cos(sph.phi);
  target.x += (-dxPx * ct + dyPx * (-st * cp)) * wpp;
  target.y += (dyPx * sp) * wpp;
  target.z += (-dxPx * (-st) + dyPx * (-ct * cp)) * wpp;
  applyCamera();
}
applyCamera();

var ptrs = {}, last = null, pinch0 = null, mid0 = null;
canvas.addEventListener("pointerdown", function (e) {
  canvas.setPointerCapture(e.pointerId);
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  if (Object.keys(ptrs).length === 1) last = { x: e.clientX, y: e.clientY };
  spin = false;
});
canvas.addEventListener("pointermove", function (e) {
  if (!ptrs[e.pointerId]) return;
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  var ids = Object.keys(ptrs);
  if (ids.length === 1 && last) {
    var dx = e.clientX - last.x, dy = e.clientY - last.y;
    if (panMode) pan(dx, dy);
    else { sph.theta -= dx * 0.009; sph.phi -= dy * 0.009; applyCamera(); }
    last = { x: e.clientX, y: e.clientY };
  } else if (ids.length === 2) {
    var a = ptrs[ids[0]], b = ptrs[ids[1]];
    var d2 = Math.hypot(a.x - b.x, a.y - b.y);
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (pinch0 === null) { pinch0 = d2; mid0 = { x: mx, y: my }; }
    if (d2 > 0) { sph.dist *= pinch0 / d2; pinch0 = d2; }
    if (mid0) { pan(mx - mid0.x, my - mid0.y); mid0 = { x: mx, y: my }; }
    applyCamera();
  }
});
function up(e) {
  delete ptrs[e.pointerId];
  if (Object.keys(ptrs).length < 2) { pinch0 = null; mid0 = null; }
  if (Object.keys(ptrs).length === 0) last = null;
  var rest = Object.keys(ptrs);
  if (rest.length === 1) last = { x: ptrs[rest[0]].x, y: ptrs[rest[0]].y };
}
canvas.addEventListener("pointerup", up);
canvas.addEventListener("pointercancel", up);
canvas.addEventListener("wheel", function (e) {
  e.preventDefault();
  sph.dist *= (1 + (e.deltaY > 0 ? 0.12 : -0.12));
  applyCamera();
}, { passive: false });

function setView(th, ph, dist, tz) {
  spin = false;
  target.set(W / 2, T / 2, (tz === undefined ? L * 0.42 : tz));
  sph.theta = th; sph.phi = ph; sph.dist = dist;
  applyCamera();
  sizeLabels(scene, UNIT * (sph.dist / (radius * 2.6)));
}
document.getElementById("vIso").onclick = function () {
  setView(0.75, 1.05, fitWhole(1.2)); };
document.getElementById("vPlan").onclick = function () {
  setView(0, 0.04, fitConn(1.15), LV * 0.6); };
document.getElementById("vSide").onclick = function () {
  setView(1.5708, 1.5708, fitWhole(1.1)); };
document.getElementById("vEnd").onclick = function () {
  setView(0, 1.5708, fitDist(W * 1.4, W * 1.6, 1.3)); };
document.getElementById("vFit").onclick = function () {
  setView(sph.theta, sph.phi, fitWhole(1.15)); };
document.getElementById("vSpin").onclick = function () { spin = !spin; };
(function () {
  var pb = document.getElementById("vPan");
  pb.onclick = function () {
    panMode = !panMode; pb.classList.toggle("on", panMode); };
})();

// =====================================================================
// toggles
// =====================================================================
function bindToggle(id, grp, initial, after) {
  var b = document.getElementById(id);
  var on = !!initial;
  function apply() {
    b.classList.toggle("on", on);
    if (grp) grp.visible = on;
    if (after) after(on);
  }
  b.onclick = function () { if (b.disabled) return; on = !on; apply(); };
  apply();
  return function (want) { if (want !== on) { on = want; apply(); } };
}

(function () {
  var el = document.getElementById("props");
  var rows = DATA.props || [];
  if (!rows.length) { el.innerHTML = "<div class='g'>No data</div>"; return; }
  var cur = null, html = "";
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (r.group !== cur) { cur = r.group; html += "<div class='g'>" + cur + "</div>"; }
    var u = r.unit ? (" " + r.unit) : "";
    html += "<div><span class='k'>" + r.symbol + "</span><span class='v'>"
         + r.value + u + "</span></div>";
  }
  el.innerHTML = html;
})();

bindToggle("tDim", gDim, false);
bindToggle("tBolt", gBolt, true);
bindToggle("tGus", gGus, false);
bindToggle("tLoad", gLoad, true);
bindToggle("tAx", gAx, false);
bindToggle("tGhost", gGhost, false);
bindToggle("tProps", null, false, function (on) {
  document.getElementById("props").style.display = on ? "block" : "none"; });
bindToggle("tLab", null, true, function (on) { setLabels(on); });
var setTear = bindToggle("tTear", null, false, function (on) {
  tearOn = on; applyEffects(); });
var setStretch = bindToggle("tStretch", null, false, function (on) {
  stretchOn = on; applyEffects(); });
var setXray = bindToggle("tXray", null, false, function (on) {
  xrayOn = on; setXrayMats(on); });

if (!(SEC.gusset_t > 0)) {
  var gbtn = document.getElementById("tGus");
  gbtn.disabled = true;
  gbtn.title = "No gusset thickness was given for this connection.";
}

(function () {
  function dis(v) {
    var o = sel.querySelector("option[value=" + v + "]");
    if (o) o.disabled = true;
  }
  if (!NET.length) { dis("net_all"); dis("net_one"); }
  if (!BLK.length) { dis("block_all"); dis("block_one"); }
})();

setMode("plain");

// =====================================================================
// hud
// =====================================================================
(function () {
  var h = "<b>" + (DATA.label || "Tension member") + "</b><br>";
  if (DATA.clause) h += DATA.clause + "<br>";
  h += "connected width w = " + W.toFixed(1) + " mm, t = " + T.toFixed(1)
     + " mm<br>";
  h += NL + " line" + (NL === 1 ? "" : "s") + " x " + NR + " row"
     + (NR === 1 ? "" : "s") + ",  " + (BOLT.size || "bolt") + "<br>";
  h += NET.length + " net path" + (NET.length === 1 ? "" : "s") + ",  "
     + BLK.length + " block pattern" + (BLK.length === 1 ? "" : "s") + "<br>";
  // every resistance, U, Ut and Tf/Tr already live in the Design data
  // panel, so the corner carries only what identifies the check
  if (RES.gov_name) {
    h += "governs: <span style='color:#e6edf3'>" + RES.gov_name
       + "</span>";
    if (RES.Tr) h += "  " + Number(RES.Tr).toFixed(1) + " kN";
    h += "<br>";
  }
  if (RES.overall) {
    var cc = RES.overall === "OK" ? "#3fb950"
           : (RES.overall === "NG" ? "#f85149" : "#d29922");
    h += "<span style='color:" + cc + "'>" + RES.overall + "</span>";
  }
  document.getElementById("hud").innerHTML = h;
})();

// =====================================================================
// resize and loop
// =====================================================================
function resize() {
  var w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  sizeLabels(scene, UNIT * (sph.dist / (radius * 2.6)));
}
window.addEventListener("resize", resize);
resize();
sph.dist = fitWhole(1.2);
applyCamera();
sizeLabels(scene, UNIT * (sph.dist / (radius * 2.6)));

var lastDist = sph.dist;
function loop() {
  requestAnimationFrame(loop);
  if (spin) { sph.theta += 0.004; applyCamera(); }
  if (Math.abs(sph.dist - lastDist) > radius * 0.01) {
    lastDist = sph.dist;
    sizeLabels(scene, UNIT * (sph.dist / (radius * 2.6)));
  }
  renderer.render(scene, camera);
}
loop();

} catch (err) {
  fail("Viewer error: " + err.message);
}
</script>
</body>
