<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#0d1117;
    font-family:-apple-system, "Segoe UI", Roboto, sans-serif; color:#e6edf3; }
  #root { display:flex; flex-direction:column; height:100vh; }
  #stage { position:relative; flex:1 1 auto; min-height:0; touch-action:none; }
  #cv { display:block; width:100%; height:100%; }
  #hud { position:absolute; left:10px; top:8px; font-size:11px; line-height:1.45;
    color:#8b949e; pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.9); }
  #hud b { color:#e6edf3; font-size:12px; }
  #legend { position:absolute; right:10px; top:8px; font-size:10.5px;
    line-height:1.5; color:#c9d1d9; pointer-events:none; text-align:right;
    text-shadow:0 1px 3px rgba(0,0,0,.9); }
  .sw { display:inline-block; width:9px; height:9px; border-radius:2px;
    margin-left:5px; vertical-align:middle; }
  #err { position:absolute; left:10px; bottom:8px; color:#f85149; font-size:11px; }
  #props { position:absolute; right:8px; bottom:8px; max-height:62%;
    overflow:auto; background:rgba(13,17,23,.82); border:1px solid #30363d;
    border-radius:8px; padding:8px 10px; font-size:10.5px; line-height:1.5;
    color:#c9d1d9; display:none; max-width:62%; }
  #props .g { color:#6e7681; text-transform:uppercase; letter-spacing:.05em;
    font-size:9px; margin-top:6px; }
  #props .g:first-child { margin-top:0; }
  #props .k { color:#8b949e; display:inline-block; min-width:64px; }
  #props .v { color:#e6edf3; }
  #bar { flex:0 0 auto; background:#161b22; border-top:1px solid #30363d;
    padding:6px 8px; }
  .row { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  .row + .row { margin-top:5px; }
  button.t { background:#21262d; color:#8b949e; border:1px solid #30363d;
    border-radius:6px; padding:5px 9px; font-size:11px; cursor:pointer;
    white-space:nowrap; }
  button.t.on { background:#1f6feb; color:#fff; border-color:#1f6feb; }
  button.t:disabled { opacity:0.4; cursor:not-allowed; }
  button.v { background:#21262d; color:#c9d1d9; border:1px solid #30363d;
    border-radius:6px; padding:5px 9px; font-size:11px; cursor:pointer; }
  button.v:active { background:#1f6feb; color:#fff; }
  button.t:focus-visible, button.v:focus-visible, select:focus-visible {
    outline:2px solid #58a6ff; outline-offset:1px; }
  select { background:#21262d; color:#e6edf3; border:1px solid #30363d;
    border-radius:6px; padding:5px 7px; font-size:11px; flex:1 1 200px;
    min-width:150px; }
  .lbl { font-size:10px; color:#6e7681; text-transform:uppercase;
    letter-spacing:.05em; margin-right:2px; }
  #expl { font-size:11px; color:#8b949e; line-height:1.45; margin-top:6px;
    padding-top:6px; border-top:1px solid #21262d; }
</style>
</head>
<body>
<div id="root">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="legend"></div>
    <div id="props"></div>
    <div id="err"></div>
  </div>
  <div id="bar">
    <div class="row">
      <span class="lbl">View</span>
      <button class="v" id="vIso">Iso</button>
      <button class="v" id="vPlan">Plan</button>
      <button class="v" id="vSide">Side</button>
      <button class="v" id="vEnd">End</button>
      <button class="v" id="vFit">Fit</button>
      <button class="t" id="vPan">Pan mode</button>
      <button class="v" id="vSpin">Spin</button>
    </div>
    <div class="row">
      <span class="lbl">Effects</span>
      <button class="t" id="tSlip">Shear slip</button>
      <button class="t" id="tRup">Rupture</button>
      <button class="t" id="tExp">Explode</button>
      <button class="t" id="tGhost">Undeformed ghost</button>
    </div>
    <div class="row">
      <span class="lbl">Show</span>
      <button class="t" id="tThroat">Throat plane</button>
      <button class="t" id="tFuse">Fusion faces</button>
      <button class="t" id="tDim">Dimensions</button>
      <button class="t" id="tLab">Labels</button>
      <button class="t" id="tLoad">Loads</button>
      <button class="t" id="tProps">Design data</button>
      <button class="t" id="tAx">Axes</button>
    </div>
    <div class="row">
      <span class="lbl">Behaviour</span>
      <select id="mode"></select>
    </div>
    <div id="expl"></div>
  </div>
</div>

<script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
<script>
var DATA = __GEOMETRY_JSON__;

function fail(m) { document.getElementById("err").textContent = m; }

try {

var DIM  = DATA.dims || {};
var RES  = DATA.results || {};
var LOAD = DATA.loads || {};
var SEGS = DATA.segments || [];
var DET  = DATA.detailing || [];
var KIND = DATA.kind || "fillet";

var C_OK   = 0x3fb950;
var C_WARN = 0xd29922;
var C_BAD  = 0xf85149;
var C_STEEL = 0x8b949e;
var C_WELD = 0xd9a441;
var C_BLUE = 0x58a6ff;

var stage = document.getElementById("stage");
var canvas = document.getElementById("cv");

var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

var scene = new THREE.Scene();
scene.background = new THREE.Color(DATA.bg || "#0d1117");

function makeEnv() {
  var c = document.createElement("canvas");
  c.width = 16; c.height = 256;
  var g = c.getContext("2d");
  var grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0.00, "#ffffff");
  grad.addColorStop(0.35, "#c8d2dc");
  grad.addColorStop(0.55, "#7d8894");
  grad.addColorStop(0.75, "#3a424b");
  grad.addColorStop(1.00, "#14181d");
  g.fillStyle = grad; g.fillRect(0, 0, 16, 256);
  var tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  var p = new THREE.PMREMGenerator(renderer);
  p.compileEquirectangularShader();
  var env = p.fromEquirectangular(tex).texture;
  p.dispose(); tex.dispose();
  return env;
}
scene.environment = makeEnv();

var key = new THREE.DirectionalLight(0xffffff, 1.35);
key.position.set(1, 1.4, 1); scene.add(key);
var fillL = new THREE.DirectionalLight(0xffffff, 0.45);
fillL.position.set(-1, 0.3, -0.8); scene.add(fillL);
scene.add(new THREE.AmbientLight(0xffffff, 0.32));

// =====================================================================
// labels
// =====================================================================
function label(text, color, scale) {
  color = color || "#e6edf3"; scale = scale || 1.0;
  var pad = 8, fs = 44;
  var c = document.createElement("canvas");
  var g = c.getContext("2d");
  g.font = "600 " + fs + "px -apple-system, Segoe UI, Roboto, sans-serif";
  var wpx = Math.ceil(g.measureText(text).width) + pad * 2;
  c.width = wpx; c.height = fs + pad * 2;
  g = c.getContext("2d");
  g.font = "600 " + fs + "px -apple-system, Segoe UI, Roboto, sans-serif";
  g.fillStyle = "rgba(13,17,23,0.72)";
  g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = color; g.textBaseline = "middle";
  g.fillText(text, pad, c.height / 2);
  var tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false }));
  sp.userData.aspect = c.width / c.height;
  sp.userData.baseScale = scale;
  return sp;
}
var LABELS = [], labelsOn = true;
function addLabel(grp, text, pos, color, scale) {
  var sp = label(text, color, scale);
  sp.position.set(pos[0], pos[1], pos[2]);
  grp.add(sp);
  LABELS.push(sp);
  sp.visible = labelsOn;
  return sp;
}
function setLabels(on) {
  labelsOn = on;
  for (var i = 0; i < LABELS.length; i++) LABELS[i].visible = on;
}
function sizeLabels(root, unit) {
  root.traverse(function (o) {
    if (o.isSprite && o.userData.aspect) {
      var h = unit * o.userData.baseScale;
      o.scale.set(h * o.userData.aspect, h, 1);
    }
  });
}
function addLine(grp, a, b, color) {
  var g = new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(a[0], a[1], a[2]), new THREE.Vector3(b[0], b[1], b[2])]);
  var m = new THREE.LineBasicMaterial({ color: color, depthTest: false });
  grp.add(new THREE.Line(g, m));
}

// =====================================================================
// groups
// =====================================================================
var gBase = new THREE.Group();     // supported part, never moves
var gAttach = new THREE.Group();   // attached part, moves on slip/rupture
var gWeld = new THREE.Group();     // weld beads
var gThroat = new THREE.Group();
var gFuse = new THREE.Group();
var gLoad = new THREE.Group();
var gDim = new THREE.Group();
var gAx = new THREE.Group();
var gGhost = new THREE.Group();
var overlays = new THREE.Group();

scene.add(gBase); scene.add(gAttach); scene.add(gWeld);
scene.add(gGhost); scene.add(overlays);
overlays.add(gThroat); overlays.add(gFuse); overlays.add(gLoad);
overlays.add(gDim); overlays.add(gAx);

function steelMat(col) {
  return new THREE.MeshStandardMaterial({
    color: col, metalness: 0.82, roughness: 0.34, side: THREE.DoubleSide });
}
var ghostMat = new THREE.MeshBasicMaterial({
  color: 0x30363d, wireframe: true, transparent: true, opacity: 0.35 });

function box(grp, x0, x1, y0, y1, z0, z1, col, ghostToo) {
  var g = new THREE.BoxGeometry(Math.abs(x1 - x0), Math.abs(y1 - y0),
                                Math.abs(z1 - z0));
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  var m = new THREE.Mesh(g, steelMat(col));
  grp.add(m);
  if (ghostToo) gGhost.add(new THREE.Mesh(g.clone(), ghostMat));
  return m;
}

// quad from four corner vectors
function quad(grp, p0, p1, p2, p3, col, op) {
  var g = new THREE.BufferGeometry();
  var v = new Float32Array([
    p0.x, p0.y, p0.z, p1.x, p1.y, p1.z, p2.x, p2.y, p2.z,
    p0.x, p0.y, p0.z, p2.x, p2.y, p2.z, p3.x, p3.y, p3.z]);
  g.setAttribute("position", new THREE.BufferAttribute(v, 3));
  g.computeVertexNormals();
  var m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    color: col, transparent: true, opacity: (op === undefined ? 0.45 : op),
    side: THREE.DoubleSide, depthWrite: false }));
  grp.add(m);
  return m;
}

// =====================================================================
// dimensions of the drawn joint
// =====================================================================
var t1 = DIM.t1 || 10;          // thinner part
var t2 = DIM.t2 || 12;          // thicker part
var Dleg = DIM.D || 8;          // fillet leg
var throat = DIM.throat || (Dleg / Math.SQRT2);

var maxL = 100;
for (var si = 0; si < SEGS.length; si++) {
  maxL = Math.max(maxL, SEGS[si].L || 0);
}

// plate width across the joint, sized so a transverse bead fits on it
var Wp = 0;
for (var si2 = 0; si2 < SEGS.length; si2++) {
  if ((SEGS[si2].theta || 0) >= 45) Wp = Math.max(Wp, SEGS[si2].L || 0);
}
if (Wp <= 0) Wp = Math.max(70, maxL * 0.7);
Wp = Math.max(Wp, 60);

var Lp = maxL * 1.45 + 45;      // attached plate length along z
var margin = Math.max(28, Dleg * 3);

// scene scale reference
var SCALE = Math.max(Lp, Wp + 2 * margin, 120);
var UNIT = SCALE * 0.055;

// =====================================================================
// joint geometry
// =====================================================================
var beads = [];         // {mesh, seg, throatMesh, fuseA, fuseB}
var attachPullDir = new THREE.Vector3(0, 0, 1);
var loadAnchor = new THREE.Vector3(0, 0, 0);
var rupturePlane = "throat";

function buildFillet() {
  // base (supported) plate lies below y = 0
  var bx = Wp / 2 + margin;
  var bz0 = -Lp * 0.45, bz1 = maxL + margin;
  box(gBase, -bx, bx, -t2, 0, bz0, bz1, C_STEEL, false);

  // attached (lapped) plate sits on top, pulled in +z
  box(gAttach, -Wp / 2, Wp / 2, 0, t1, 0, Lp, C_STEEL, true);

  addLabel(overlays, "supported part  t = " + t2.toFixed(0) + " mm",
           [0, -t2 - UNIT * 0.7, bz0 + (bz1 - bz0) * 0.18], "#8b949e", 0.95);
  addLabel(overlays, "attached part  t = " + t1.toFixed(0) + " mm",
           [0, t1 + UNIT * 0.7, Lp * 0.86], "#8b949e", 0.95);

  // one bead per segment, laid out around the attached plate
  var leftNext = 0, rightNext = 0, sideFlip = 0;
  for (var i = 0; i < SEGS.length; i++) {
    var s = SEGS[i];
    var th = (s.theta || 0) * Math.PI / 180.0;
    var Ls = s.L || 100;

    var dir, outward, origin;
    if ((s.theta || 0) >= 45) {
      // transverse: runs across x at the far toe of the lapped plate
      dir = new THREE.Vector3(1, 0, 0);
      outward = new THREE.Vector3(0, 0, -1);
      origin = new THREE.Vector3(-Ls / 2, 0, 0);
      if ((s.theta || 0) < 88) {
        // inclined: rotate the bead about y by (90 - theta)
        var a = (90 - (s.theta || 0)) * Math.PI / 180.0;
        dir = new THREE.Vector3(Math.cos(a), 0, Math.sin(a)).normalize();
        outward = new THREE.Vector3(Math.sin(a), 0, -Math.cos(a)).normalize();
        origin = new THREE.Vector3(-Ls * Math.cos(a) / 2, 0,
                                   -Ls * Math.sin(a) / 2);
      }
    } else {
      // longitudinal: runs along z on alternating side edges
      var side = (sideFlip % 2 === 0) ? 1 : -1;
      sideFlip += 1;
      var zStart = (side > 0) ? rightNext : leftNext;
      if (side > 0) rightNext += Ls + Dleg * 1.5;
      else leftNext += Ls + Dleg * 1.5;
      dir = new THREE.Vector3(0, 0, 1);
      outward = new THREE.Vector3(side, 0, 0);
      origin = new THREE.Vector3(side * Wp / 2, 0, zStart);
      if ((s.theta || 0) > 2) {
        var a2 = (s.theta || 0) * Math.PI / 180.0;
        dir = new THREE.Vector3(side * Math.sin(a2), 0,
                                Math.cos(a2)).normalize();
        outward = new THREE.Vector3(side * Math.cos(a2), 0,
                                    -Math.sin(a2)).normalize();
      }
    }
    addBead(s, i, Dleg, Ls, dir, outward, origin);
  }

  attachPullDir.set(0, 0, 1);
  loadAnchor.set(0, t1 / 2, Lp);
}

// A fillet bead: right triangle of leg D, extruded along dir.
// local u = outward (horizontal leg), local v = up (vertical leg)
function addBead(seg, idx, D, Ls, dir, outward, origin) {
  var up = new THREE.Vector3(0, 1, 0);
  var basis = new THREE.Matrix4().makeBasis(
    outward.clone().normalize(), up, dir.clone().normalize());
  basis.setPosition(origin);

  var shp = new THREE.Shape();
  shp.moveTo(0, 0); shp.lineTo(D, 0); shp.lineTo(0, D); shp.closePath();
  var g = new THREE.ExtrudeGeometry(shp, {
    depth: Ls, bevelEnabled: false, curveSegments: 1, steps: 1 });
  g.applyMatrix4(basis);
  g.computeVertexNormals();
  var m = new THREE.Mesh(g, steelMat(C_WELD));
  gWeld.add(m);
  gGhost.add(new THREE.Mesh(g.clone(), ghostMat));

  function P(u, v, w) {
    return new THREE.Vector3(u, v, w).applyMatrix4(basis);
  }
  // throat plane: the hypotenuse, from (D,0) to (0,D)
  var tm = quad(gThroat, P(D, 0, 0), P(0, D, 0), P(0, D, Ls), P(D, 0, Ls),
                C_BLUE, 0.5);
  // fusion faces: the two legs against the parent metal
  var fa = quad(gFuse, P(0, 0, 0), P(0, D, 0), P(0, D, Ls), P(0, 0, Ls),
                C_WARN, 0.4);
  var fb = quad(gFuse, P(0, 0, 0), P(D, 0, 0), P(D, 0, Ls), P(0, 0, Ls),
                C_WARN, 0.4);

  var mid = P(D * 0.34, D * 0.34, Ls / 2);
  addLabel(overlays, "Seg " + (idx + 1) + "  th=" + (seg.theta || 0).toFixed(0)
           + " deg  L=" + Ls.toFixed(0), [mid.x, mid.y + D * 1.6, mid.z],
           "#d9a441", 0.9);

  var dimP = P(D, 0, Ls * 0.5);
  addLine(gDim, [dimP.x, dimP.y, dimP.z],
          [dimP.x, dimP.y + D, dimP.z], C_OK);
  addLabel(gDim, "D = " + D.toFixed(0) + " mm",
           [dimP.x, dimP.y + D * 1.15, dimP.z], "#3fb950", 0.85);
  var tp = P(D * 0.5, D * 0.5, Ls * 0.5);
  addLabel(gDim, "throat = " + throat.toFixed(2) + " mm",
           [tp.x + D * 0.9, tp.y + D * 0.55, tp.z], "#58a6ff", 0.85);

  beads.push({ mesh: m, seg: seg, throat: tm, fuseA: fa, fuseB: fb });
}

function buildGroove() {
  var t = Math.max(t1, t2);
  var gap = Math.max(DIM.gap || t * 0.28, 3);
  var W = Math.max(Wp, 90);
  var Ls = Math.max(maxL, 110);
  var pen = DIM.penetration;
  if (!pen || pen <= 0) pen = (KIND === "cjp") ? t : t * 0.55;
  pen = Math.min(pen, t);

  // two plates butted together, weld in the gap
  box(gBase, -W / 2, W / 2, -t / 2, t / 2, -Ls - gap / 2, -gap / 2,
      C_STEEL, false);
  box(gAttach, -W / 2, W / 2, -t / 2, t / 2, gap / 2, Ls + gap / 2,
      C_STEEL, true);

  // fused weld metal, from the top face down by the penetration
  var wm = box(gWeld, -W / 2, W / 2, t / 2 - pen, t / 2,
               -gap / 2, gap / 2, C_WELD, true);
  beads.push({ mesh: wm, seg: (SEGS[0] || { theta: 90 }),
               throat: null, fuseA: null, fuseB: null });

  // the unfused root of a PJP does nothing and is drawn as a void
  if (pen < t - 0.01) {
    var rootG = new THREE.BoxGeometry(W, t - pen, gap);
    rootG.translate(0, (-t / 2 + (t - pen) / 2), 0);
    gWeld.add(new THREE.Mesh(rootG, new THREE.MeshBasicMaterial({
      color: 0x21262d, transparent: true, opacity: 0.75,
      side: THREE.DoubleSide })));
    addLabel(overlays, "unfused root  " + (t - pen).toFixed(1) + " mm",
             [0, -t / 2 + (t - pen) / 2, gap * 2.6], "#f85149", 0.9);
  }

  // fusion faces are the two prepared groove faces
  var hy0 = t / 2 - pen, hy1 = t / 2;
  quad(gFuse, new THREE.Vector3(-W / 2, hy0, -gap / 2),
       new THREE.Vector3(W / 2, hy0, -gap / 2),
       new THREE.Vector3(W / 2, hy1, -gap / 2),
       new THREE.Vector3(-W / 2, hy1, -gap / 2), C_WARN, 0.45);
  quad(gFuse, new THREE.Vector3(-W / 2, hy0, gap / 2),
       new THREE.Vector3(W / 2, hy0, gap / 2),
       new THREE.Vector3(W / 2, hy1, gap / 2),
       new THREE.Vector3(-W / 2, hy1, gap / 2), C_WARN, 0.45);
  // throat plane of a groove weld is the fused throat itself
  quad(gThroat, new THREE.Vector3(-W / 2, hy0, 0),
       new THREE.Vector3(W / 2, hy0, 0),
       new THREE.Vector3(W / 2, hy1, 0),
       new THREE.Vector3(-W / 2, hy1, 0), C_BLUE, 0.55);

  addLine(gDim, [W / 2 + 8, hy0, 0], [W / 2 + 8, hy1, 0], C_BLUE);
  addLabel(gDim, "effective throat = " + pen.toFixed(1) + " mm",
           [W / 2 + 8, hy1 + UNIT * 0.4, 0], "#58a6ff", 0.9);
  addLabel(overlays, "supported part", [0, -t / 2 - UNIT * 0.6, -Ls * 0.55],
           "#8b949e", 0.95);
  addLabel(overlays, "attached part", [0, t / 2 + UNIT * 0.6, Ls * 0.55],
           "#8b949e", 0.95);

  // a reinforcing fillet, if the page says the joint carries one
  if (DIM.has_fillet) {
    var fD = Math.max(Dleg, 5);
    var s1 = new THREE.Shape();
    s1.moveTo(0, 0); s1.lineTo(0, fD); s1.lineTo(fD, 0); s1.closePath();
    var fg = new THREE.ExtrudeGeometry(s1, {
      depth: W, bevelEnabled: false, steps: 1 });
    fg.rotateY(Math.PI / 2);
    fg.translate(gap / 2, t / 2, -W / 2);
    var fm = new THREE.Mesh(fg, steelMat(C_WELD));
    gWeld.add(fm);
    beads.push({ mesh: fm, seg: { theta: 90, label: "reinforcing fillet" },
                 throat: null, fuseA: null, fuseB: null });
    addLabel(overlays, "reinforcing fillet",
             [0, t / 2 + fD * 1.4, gap / 2 + fD], "#d9a441", 0.9);
  }

  attachPullDir.set(0, 0, 1);
  loadAnchor.set(0, 0, Ls + gap / 2);
  SCALE = Math.max(W, Ls * 1.2, 120);
  UNIT = SCALE * 0.055;
}

function buildFlare() {
  var wf = DIM.wf || 20;
  var Lb = DIM.L_fb || 150;
  var R = wf;
  var W = Math.max(R * 4, 80);
  var tp = Math.max(t2, 8);

  // supporting plate
  box(gBase, -W / 2, W / 2, -tp, 0, -Lb * 0.62, Lb * 0.62, C_STEEL, false);

  // the rounded corner being welded, a bar lying on the plate
  var cg = new THREE.CylinderGeometry(R, R, Lb, 28, 1, false);
  cg.rotateX(Math.PI / 2);
  cg.translate(0, R, 0);
  var cm = new THREE.Mesh(cg, steelMat(C_STEEL));
  gAttach.add(cm);
  gGhost.add(new THREE.Mesh(cg.clone(), ghostMat));

  // weld in each flare groove, drawn as a bead in the tangent corner
  for (var s = -1; s <= 1; s += 2) {
    var shp = new THREE.Shape();
    shp.moveTo(0, 0); shp.lineTo(R * 0.85, 0); shp.lineTo(0, R * 0.85);
    shp.closePath();
    var g = new THREE.ExtrudeGeometry(shp, {
      depth: Lb, bevelEnabled: false, steps: 1 });
    var basis = new THREE.Matrix4().makeBasis(
      new THREE.Vector3(s, 0, 0), new THREE.Vector3(0, 1, 0),
      new THREE.Vector3(0, 0, 1));
    basis.setPosition(new THREE.Vector3(0, 0, -Lb / 2));
    g.applyMatrix4(basis);
    g.computeVertexNormals();
    var m = new THREE.Mesh(g, steelMat(C_WELD));
    gWeld.add(m);
    beads.push({ mesh: m, seg: (SEGS[0] || { theta: 0 }),
                 throat: null, fuseA: null, fuseB: null });
  }

  // effective throat of a flare bevel is taken as 0.5 wf
  var teff = 0.5 * wf;
  quad(gThroat, new THREE.Vector3(-teff, 0, -Lb / 2),
       new THREE.Vector3(-teff, 0, Lb / 2),
       new THREE.Vector3(-teff, R * 0.85, Lb / 2),
       new THREE.Vector3(-teff, R * 0.85, -Lb / 2), C_BLUE, 0.5);
  quad(gThroat, new THREE.Vector3(teff, 0, -Lb / 2),
       new THREE.Vector3(teff, 0, Lb / 2),
       new THREE.Vector3(teff, R * 0.85, Lb / 2),
       new THREE.Vector3(teff, R * 0.85, -Lb / 2), C_BLUE, 0.5);
  quad(gFuse, new THREE.Vector3(-W / 2, 0, -Lb / 2),
       new THREE.Vector3(W / 2, 0, -Lb / 2),
       new THREE.Vector3(W / 2, 0, Lb / 2),
       new THREE.Vector3(-W / 2, 0, Lb / 2), C_WARN, 0.25);

  addLabel(gDim, "wf = " + wf.toFixed(0) + " mm",
           [R * 1.3, R * 1.9, 0], "#3fb950", 0.9);
  addLabel(gDim, "Aw = 0.50 wf L", [R * 1.3, R * 1.4, 0], "#58a6ff", 0.9);
  addLabel(overlays, "rounded corner", [0, R * 2.1, Lb * 0.3],
           "#8b949e", 0.95);

  attachPullDir.set(0, 0, 1);
  loadAnchor.set(0, R, Lb / 2);
  SCALE = Math.max(W, Lb, 120);
  UNIT = SCALE * 0.055;
}

if (KIND === "fillet") buildFillet();
else if (KIND === "flare") buildFlare();
else buildGroove();

gGhost.visible = false;
gThroat.visible = false;
gFuse.visible = false;
gDim.visible = false;

// =====================================================================
// loads
// =====================================================================
var Vf = Math.abs(LOAD.Vf_kN || 0);
var Tf = Math.abs(LOAD.Tf_kN || 0);
var Pload = Math.max(Vf, Tf);

(function () {
  if (Pload <= 0) return;
  var len = SCALE * 0.42;
  var d = attachPullDir.clone().normalize();
  var a = loadAnchor.clone();
  var b = a.clone().addScaledVector(d, len);
  addLine(gLoad, [a.x, a.y, a.z], [b.x, b.y, b.z], C_BAD);
  var head = new THREE.Mesh(
    new THREE.ConeGeometry(SCALE * 0.022, SCALE * 0.07, 16),
    new THREE.MeshBasicMaterial({ color: C_BAD }));
  head.position.copy(b);
  head.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d);
  gLoad.add(head);
  addLabel(gLoad, (Tf > Vf ? "Tf = " : "Vf = ") + Pload.toFixed(0) + " kN",
           [b.x, b.y + UNIT * 0.8, b.z], "#f85149", 1.05);

  // the reaction the supported part has to deliver
  var a2 = a.clone().addScaledVector(d, -SCALE * 0.95);
  addLabel(gLoad, "reaction", [a2.x, a2.y - UNIT * 0.8, a2.z],
           "#8b949e", 0.9);
})();

// axes
(function () {
  var a = SCALE * 0.55;
  var defs = [[[a, 0, 0], 0xff7b72, "x"], [[0, a, 0], 0x7ee787, "y"],
              [[0, 0, a], 0x79c0ff, "z  line of action"]];
  for (var i = 0; i < defs.length; i++) {
    addLine(gAx, [0, 0, 0], defs[i][0], defs[i][1]);
    addLabel(gAx, defs[i][2],
             [defs[i][0][0] * 1.1, defs[i][0][1] * 1.1, defs[i][0][2] * 1.1],
             "#" + new THREE.Color(defs[i][1]).getHexString(), 0.95);
  }
})();
gAx.visible = false;

// =====================================================================
// colour helpers
// =====================================================================
function lerpCol(c1, c2, f) {
  var a = new THREE.Color(c1), b = new THREE.Color(c2);
  return a.lerp(b, Math.max(0, Math.min(1, f)));
}
function utilColour(u) {
  if (u === null || u === undefined || !isFinite(u)) return new THREE.Color(C_STEEL);
  if (u > 1.0) return new THREE.Color(C_BAD);
  if (u <= 0.6) return lerpCol(0x1f6f3f, C_OK, u / 0.6);
  return lerpCol(C_OK, C_WARN, (u - 0.6) / 0.4);
}
function scaleColour(v, lo, hi, cLo, cHi) {
  if (hi - lo < 1e-9) return new THREE.Color(cHi);
  return lerpCol(cLo, cHi, (v - lo) / (hi - lo));
}

function segUtil(s) {
  if (s && s.util !== undefined && s.util !== null) return s.util;
  return RES.util;
}

// =====================================================================
// behaviour modes
// =====================================================================
var MODES = [
  ["plain", "As fabricated",
   "The joint as detailed. Nothing mapped onto it yet. Rotate with one "
   + "finger, pinch to zoom."],
  ["throat", "Effective throat, the failure plane",
   "A fillet weld is not checked on its leg, it is checked on its throat: "
   + "the shortest path through the bead, at 45 degrees, aw = D/sqrt(2). "
   + "That blue plane is the surface every shear stress is divided by. "
   + "Growing D moves the plane outward and enlarges Aw in proportion."],
  ["orientation", "Orientation factor, 1.00 + 0.50 sin^1.5 theta",
   "Colour is the orientation factor of each segment. A transverse bead "
   + "at 90 degrees is the brightest: it is 50 percent stronger than a "
   + "longitudinal bead because the throat is loaded across its width "
   + "rather than along it. It is also the least ductile, which is why "
   + "Mw then penalises the softer segments beside it."],
  ["mw", "Mw, multi-orientation reduction",
   "When segments of different angle share a joint, they do not all reach "
   + "their peak together. The stiffest segment, nearest 90 degrees, "
   + "sheds load first, so Cl. 13.13.2.2 scales every other segment down "
   + "by Mw. Dark beads are the ones being held back."],
  ["capacity", "Share of the joint resistance",
   "Each bead coloured by how much of the total Vr it delivers. Length, "
   + "leg size and angle all feed in. A short bead at a poor angle is "
   + "carrying almost nothing, which is where a redesign usually starts."],
  ["util", "Utilisation, Vf over Vr",
   "The whole joint coloured by the demand over the governing resistance. "
   + "Green has reserve, amber is close, red is over. Turn on Shear slip "
   + "to see the movement the utilisation implies."],
  ["failure", "Where it lets go",
   "The governing failure surface is picked out in red and the joint is "
   + "pulled apart on it. Weld metal governing means rupture on the "
   + "throat; base metal governing means rupture on the fusion face, in "
   + "the parent steel beside the bead, which no amount of extra "
   + "electrode strength will fix."],
  ["detailing", "Detailing limits, Cl. 6.2.3",
   "Colour is compliance with the size and length rules rather than "
   + "strength. A bead can be perfectly strong on paper and still be "
   + "unbuildable: too small to fuse the parent metal, too large for the "
   + "thinner part, or too short to be counted at all."]
];

function paint(m) {
  var i, b, c;

  // plates
  var plateCol = new THREE.Color(C_STEEL);
  if (m === "util" || m === "failure") {
    plateCol = utilColour(RES.util);
  }
  gBase.traverse(function (o) { if (o.isMesh) o.material.color.copy(plateCol); });
  gAttach.traverse(function (o) { if (o.isMesh) o.material.color.copy(plateCol); });

  // beads
  var maxShare = 0.0001, maxMw = 0.0001;
  for (i = 0; i < SEGS.length; i++) {
    maxShare = Math.max(maxShare, SEGS[i].share || 0);
    maxMw = Math.max(maxMw, SEGS[i].Mw || 0);
  }

  for (i = 0; i < beads.length; i++) {
    b = beads[i];
    var s = b.seg || {};
    c = new THREE.Color(C_WELD);
    if (m === "orientation") {
      c = scaleColour(s.orient || 1.0, 1.0, 1.5, 0x1f4f7a, 0x58a6ff);
    } else if (m === "mw") {
      c = scaleColour(s.Mw === undefined ? 1.0 : s.Mw, 0.75, 1.0,
                      0x6e2f2f, C_OK);
    } else if (m === "capacity") {
      c = scaleColour(s.share || 0, 0, maxShare, 0x33240c, C_WARN);
    } else if (m === "util") {
      c = utilColour(segUtil(s));
    } else if (m === "failure") {
      c = new THREE.Color(
        RES.governs === "base metal" ? C_STEEL : C_BAD);
    } else if (m === "detailing") {
      c = new THREE.Color(RES.detail_ok === false ? C_BAD : C_OK);
    } else if (m === "throat") {
      c = new THREE.Color(0x5a4a2a);
    }
    b.mesh.material.color.copy(c);
  }

  // overlays that belong to a mode
  setThroat(m === "throat" || (m === "failure" && RES.governs !== "base metal"));
  setFuse(m === "failure" && RES.governs === "base metal");
  if (m === "failure") setRupture(true);
  if (m === "util") setSlip(true);

  // the failure surface itself
  for (i = 0; i < beads.length; i++) {
    b = beads[i];
    if (b.throat) {
      b.throat.material.color.set(
        (m === "failure" && RES.governs !== "base metal") ? C_BAD : C_BLUE);
    }
    if (b.fuseA) b.fuseA.material.color.set(
      (m === "failure" && RES.governs === "base metal") ? C_BAD : C_WARN);
    if (b.fuseB) b.fuseB.material.color.set(
      (m === "failure" && RES.governs === "base metal") ? C_BAD : C_WARN);
  }

  buildLegend(m);
}

function buildLegend(m) {
  var h = "";
  function row(txt, col) {
    h += txt + "<span class='sw' style='background:" + col + "'></span><br>";
  }
  if (m === "orientation") {
    row("theta = 0, factor 1.00", "#1f4f7a");
    row("theta = 90, factor 1.50", "#58a6ff");
  } else if (m === "mw") {
    row("Mw held back", "#6e2f2f");
    row("Mw = 1.00", "#3fb950");
  } else if (m === "capacity") {
    row("small share of Vr", "#33240c");
    row("largest share of Vr", "#d29922");
  } else if (m === "util" ) {
    row("reserve", "#3fb950");
    row("close to the limit", "#d29922");
    row("over, Vf > Vr", "#f85149");
  } else if (m === "failure") {
    row(RES.governs === "base metal"
        ? "fusion face, parent metal" : "throat, weld metal", "#f85149");
  } else if (m === "detailing") {
    row("within Cl. 6.2.3", "#3fb950");
    row("outside Cl. 6.2.3", "#f85149");
  } else if (m === "throat") {
    row("effective throat plane", "#58a6ff");
  }
  document.getElementById("legend").innerHTML = h;
}

// =====================================================================
// movement: slip, rupture, explode
// =====================================================================
var slipOn = false, rupOn = false, expOn = false;

function applyMove() {
  var d = attachPullDir.clone().normalize();
  var off = new THREE.Vector3(0, 0, 0);
  var u = RES.util;
  if (slipOn) {
    var f = (u === null || u === undefined || !isFinite(u)) ? 0.35 : u;
    off.addScaledVector(d, Math.min(f, 1.6) * SCALE * 0.035);
  }
  if (rupOn) off.addScaledVector(d, SCALE * 0.10);
  if (expOn) off.y += SCALE * 0.16;
  gAttach.position.copy(off);
  // the beads stay with the parent metal they were laid on, except in a
  // rupture, where the joint separates on its failure surface
  if (rupOn && RES.governs !== "base metal") {
    gWeld.position.copy(off).multiplyScalar(0.45);
  } else if (rupOn) {
    gWeld.position.set(0, 0, 0);
  } else {
    gWeld.position.copy(off).multiplyScalar(slipOn ? 0.35 : 0.0);
  }
}

// =====================================================================
// camera
// =====================================================================
var FOV = 32;
var radius = SCALE * 0.9;
var camera = new THREE.PerspectiveCamera(FOV, 1, radius * 0.004, radius * 400);
var target = new THREE.Vector3(0, 0, 0);
var sph = { theta: 0.85, phi: 1.15, dist: radius * 2.6 };
var spin = false, panMode = false;

function fitDist(objH, objW, margin2) {
  var vt = Math.tan(FOV * Math.PI / 360);
  var asp = camera.aspect || 1;
  return Math.max((objH / 2) / vt, (objW / 2) / (asp * vt)) * (margin2 || 1.15);
}
function fitWhole(margin2) {
  return fitDist(SCALE * 1.35, SCALE * 1.9, margin2 || 1.18);
}
function applyCamera() {
  sph.phi = Math.max(0.02, Math.min(Math.PI - 0.02, sph.phi));
  sph.dist = Math.max(radius * 0.05, Math.min(radius * 40, sph.dist));
  var sp = Math.sin(sph.phi);
  camera.position.set(
    target.x + sph.dist * sp * Math.sin(sph.theta),
    target.y + sph.dist * Math.cos(sph.phi),
    target.z + sph.dist * sp * Math.cos(sph.theta));
  camera.lookAt(target);
}
function pan(dxPx, dyPx) {
  var hpx = stage.clientHeight || 1;
  var wpp = 2 * sph.dist * Math.tan(FOV * Math.PI / 360) / hpx;
  var st = Math.sin(sph.theta), ct = Math.cos(sph.theta);
  var sp = Math.sin(sph.phi), cp = Math.cos(sph.phi);
  target.x += (-dxPx * ct + dyPx * (-st * cp)) * wpp;
  target.y += (dyPx * sp) * wpp;
  target.z += (-dxPx * (-st) + dyPx * (-ct * cp)) * wpp;
  applyCamera();
}
applyCamera();

var ptrs = {}, last = null, pinch0 = null, mid0 = null;
canvas.addEventListener("pointerdown", function (e) {
  canvas.setPointerCapture(e.pointerId);
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  if (Object.keys(ptrs).length === 1) last = { x: e.clientX, y: e.clientY };
  spin = false;
});
canvas.addEventListener("pointermove", function (e) {
  if (!ptrs[e.pointerId]) return;
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  var ids = Object.keys(ptrs);
  if (ids.length === 1 && last) {
    var dx = e.clientX - last.x, dy = e.clientY - last.y;
    if (panMode) pan(dx, dy);
    else { sph.theta -= dx * 0.009; sph.phi -= dy * 0.009; applyCamera(); }
    last = { x: e.clientX, y: e.clientY };
  } else if (ids.length === 2) {
    var a = ptrs[ids[0]], b = ptrs[ids[1]];
    var d2 = Math.hypot(a.x - b.x, a.y - b.y);
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (pinch0 === null) { pinch0 = d2; mid0 = { x: mx, y: my }; }
    if (d2 > 0) { sph.dist *= pinch0 / d2; pinch0 = d2; }
    if (mid0) { pan(mx - mid0.x, my - mid0.y); mid0 = { x: mx, y: my }; }
    applyCamera();
  }
});
function up(e) {
  delete ptrs[e.pointerId];
  if (Object.keys(ptrs).length < 2) { pinch0 = null; mid0 = null; }
  if (Object.keys(ptrs).length === 0) last = null;
  var rest = Object.keys(ptrs);
  if (rest.length === 1) last = { x: ptrs[rest[0]].x, y: ptrs[rest[0]].y };
}
canvas.addEventListener("pointerup", up);
canvas.addEventListener("pointercancel", up);
canvas.addEventListener("wheel", function (e) {
  e.preventDefault();
  sph.dist *= (1 + (e.deltaY > 0 ? 0.12 : -0.12));
  applyCamera();
}, { passive: false });

function setView(th, ph, dist) {
  spin = false; target.set(0, 0, 0);
  sph.theta = th; sph.phi = ph; sph.dist = dist;
  applyCamera();
  sizeLabels(scene, UNIT * (sph.dist / (radius * 2.6)));
}
document.getElementById("vIso").onclick = function () {
  setView(0.85, 1.15, fitWhole(1.2)); };
document.getElementById("vPlan").onclick = function () {
  setView(0, 0.05, fitWhole(1.1)); };
document.getElementById("vSide").onclick = function () {
  setView(1.5708, 1.5708, fitWhole(1.1)); };
document.getElementById("vEnd").onclick = function () {
  setView(0, 1.5708, fitWhole(1.1)); };
document.getElementById("vFit").onclick = function () {
  setView(sph.theta, sph.phi, fitWhole(1.15)); };
document.getElementById("vSpin").onclick = function () { spin = !spin; };
(function () {
  var pb = document.getElementById("vPan");
  pb.onclick = function () {
    panMode = !panMode; pb.classList.toggle("on", panMode); };
})();

// =====================================================================
// toggles
// =====================================================================
function bindToggle(id, grp, initial, after) {
  var b = document.getElementById(id);
  var on = !!initial;
  function apply() {
    b.classList.toggle("on", on);
    if (grp) grp.visible = on;
    if (after) after(on);
  }
  b.onclick = function () { if (b.disabled) return; on = !on; apply(); };
  apply();
  return function (want) { if (want !== on) { on = want; apply(); } };
}

(function () {
  var el = document.getElementById("props");
  var rows = DATA.props || [];
  if (!rows.length) { el.innerHTML = "<div class='g'>No data</div>"; return; }
  var cur = null, html = "";
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (r.group !== cur) { cur = r.group; html += "<div class='g'>" + cur + "</div>"; }
    var u = r.unit ? (" " + r.unit) : "";
    html += "<div><span class='k'>" + r.symbol + "</span><span class='v'>"
         + r.value + u + "</span></div>";
  }
  el.innerHTML = html;
})();

var setThroat = bindToggle("tThroat", gThroat, false);
var setFuse = bindToggle("tFuse", gFuse, false);
bindToggle("tDim", gDim, false);
bindToggle("tLoad", gLoad, true);
bindToggle("tAx", gAx, false);
bindToggle("tGhost", gGhost, false);
bindToggle("tProps", null, false, function (on) {
  document.getElementById("props").style.display = on ? "block" : "none"; });
bindToggle("tLab", null, true, function (on) { setLabels(on); });

var setSlip = bindToggle("tSlip", null, false, function (on) {
  slipOn = on; applyMove(); });
var setRupture = bindToggle("tRup", null, false, function (on) {
  rupOn = on; applyMove(); });
bindToggle("tExp", null, false, function (on) {
  expOn = on; applyMove(); });

if (KIND !== "fillet") {
  var bt = document.getElementById("tThroat");
  bt.title = "Groove and flare welds are checked on the fused throat, "
           + "which is shown here as the plane through the weld.";
}

// =====================================================================
// behaviour dropdown
// =====================================================================
var sel = document.getElementById("mode");
for (var mi = 0; mi < MODES.length; mi++) {
  var o = document.createElement("option");
  o.value = MODES[mi][0]; o.textContent = MODES[mi][1];
  sel.appendChild(o);
}
var currentMode = "plain";
function setMode(m) {
  currentMode = m;
  if (m !== "failure") setRupture(false);
  if (m !== "util") setSlip(false);
  paint(m);
  applyMove();
  for (var i = 0; i < MODES.length; i++) {
    if (MODES[i][0] === m) {
      document.getElementById("expl").textContent = MODES[i][2];
    }
  }
}
sel.onchange = function () { setMode(sel.value); };
setMode("plain");

// =====================================================================
// hud
// =====================================================================
(function () {
  var h = "<b>" + (DATA.label || "Welded joint") + "</b><br>";
  if (DATA.clause) h += DATA.clause + "<br>";
  if (KIND === "fillet") {
    h += "D = " + Dleg.toFixed(0) + " mm, throat = " + throat.toFixed(2)
       + " mm<br>";
    h += SEGS.length + " segment" + (SEGS.length === 1 ? "" : "s") + "<br>";
  }
  if (RES.Vr_kN !== undefined && RES.Vr_kN !== null) {
    h += "Vr = " + Number(RES.Vr_kN).toFixed(1) + " kN<br>";
  }
  if (RES.Tr_kN !== undefined && RES.Tr_kN !== null) {
    h += "Tr = " + Number(RES.Tr_kN).toFixed(1) + " kN<br>";
  }
  if (Pload > 0) h += (Tf > Vf ? "Tf = " : "Vf = ") + Pload.toFixed(1)
                    + " kN<br>";
  if (RES.governs) h += "governs: " + RES.governs + "<br>";
  if (RES.util !== undefined && RES.util !== null && isFinite(RES.util)) {
    h += "utilisation = " + Number(RES.util).toFixed(3) + "<br>";
  }
  if (RES.overall) {
    var cc = RES.overall === "OK" ? "#3fb950"
           : (RES.overall === "NG" ? "#f85149" : "#d29922");
    h += "<span style='color:" + cc + "'>" + RES.overall + "</span>";
  }
  document.getElementById("hud").innerHTML = h;
})();

// =====================================================================
// resize and loop
// =====================================================================
function resize() {
  var w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  sizeLabels(scene, UNIT * (sph.dist / (radius * 2.6)));
}
window.addEventListener("resize", resize);
resize();
sph.dist = fitWhole(1.2);
applyCamera();
sizeLabels(scene, UNIT * (sph.dist / (radius * 2.6)));

var lastDist = sph.dist;
function loop() {
  requestAnimationFrame(loop);
  if (spin) { sph.theta += 0.004; applyCamera(); }
  if (Math.abs(sph.dist - lastDist) > radius * 0.01) {
    lastDist = sph.dist;
    sizeLabels(scene, UNIT * (sph.dist / (radius * 2.6)));
  }
  renderer.render(scene, camera);
}
loop();

} catch (err) {
  fail("Viewer error: " + err.message);
}
</script>
</body>
</html>
